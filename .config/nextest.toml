# nextest runs every test in the selected binaries as one pool, one process per
# test, instead of one binary after another. `cargo test` is still what runs
# doctests; nothing else here changes what a test proves.

[profile.default]
# What `cargo test` does, and what a reader of a red run wants: the whole
# picture, not the first failure.
fail-fast = false

# CI cuts the next run's shards from the durations in this report.
[profile.default.junit]
path = "junit.xml"

# Ten simulated minutes of `clock.sleep`, bounded by the process rather than by
# a clock the test reads: if the runtime ever waited them out, nextest kills the
# run here instead of a partition sitting on it.
[[profile.default.overrides]]
filter = 'binary_id(=ply-cli-tests::suite) & test(=cli::a_simulated_sleep_is_a_jump_rather_than_a_wait)'
slow-timeout = { period = "60s", terminate-after = 1 }

# The bootstrap fixpoint compiles the emitter's own unit twice, which is what a runner cannot
# hold beside the rest of the run: every test thread, after everything else.
[[profile.default.overrides]]
filter = 'binary_id(=ply-codegen-tests::bootstrap)'
threads-required = "num-test-threads"
priority = -90
slow-timeout = { period = "600s" }


[[profile.default.overrides]]
filter = 'binary_id(=ply-cli-tests::suite) & test(=corpus::the_compiled_tier_runs_the_compilers_own_tests_as_the_only_engine)'
threads-required = "num-test-threads"
priority = -90
slow-timeout = { period = "600s" }
