# nextest runs every test in the selected binaries as one pool, one process per
# test, instead of one binary after another. `cargo test` is still what runs
# doctests; nothing else here changes what a test proves.

[profile.default]
# What `cargo test` does, and what a reader of a red run wants: the whole
# picture, not the first failure.
fail-fast = false

# The wall-clock tests in .github/ci-shards.sh's DEFERRED table. Every test
# thread and the lowest priority: each starts only once the rest of the run is
# over, and nothing runs beside it. Their output is shown because the output is
# the measurement. The filter is that script's `deferred-filter` output
# verbatim, and `ci-shards.sh verify` fails when the two disagree.
[[profile.default.overrides]]
filter = '(binary_id(=ply-eval-tests::allocation) & test(=region_arena_cost::snapshot_cost_as_a_function_of_region_size)) | (binary_id(=ply-eval-tests::allocation) & test(=fixture_open_cost::a_seeded_fixture_opens_per_test_in_microseconds)) | (binary_id(=ply-eval-tests::suite) & test(=simulation::a_long_sleep_is_a_jump)) | (binary_id(=ply-test-tests::suite) & test(=region_fixture_cost::a_region_scoped_fixture_costs_the_fixture_and_never_the_test)) | (binary_id(=ply-test-tests::suite) & test(=region_fixture_cost::discarding_a_tests_own_cells_costs_nothing)) | (binary_id(=ply-test-tests::suite) & test(=region_fixture_cost::a_group_amortizes_the_build_up_to_a_ceiling_the_open_decides)) | (binary_id(=ply-test-tests::suite) & test(=region_fixture_cost::a_group_with_no_fixture_opens_and_closes_in_constant_time)) | (binary_id(=ply-corpus) & test(=measure::tests::every_resumption_costs_about_what_the_first_one_did)) | (binary_id(=ply-corpus) & test(=measure::tests::capture_and_resume_are_flat_in_the_frames_they_move)) | (binary_id(=ply-corpus) & test(=measure::tests::opening_a_fixture_beats_rebuilding_it_once_the_fixture_is_real)) | (binary_id(=ply-store) & test(=tests::opening_a_ten_thousand_definition_cache_is_under_the_budget)) | (binary_id(=ply-store) & test(=tests::a_baseline_for_every_test_does_not_slow_the_open)) | (binary_id(=ply-cli::suite) & test(=w3_http_audit::routing_a_path_of_escapes_costs_its_length_and_not_its_square)) | (binary_id(=ply-corpus) & test(=payload::tests::the_map_rows_survive_subtracting_the_fold_around_them))'
threads-required = "num-test-threads"
priority = -100
success-output = "immediate"

# The long tests, started first so the run's tail is not one of them alone.
[[profile.default.overrides]]
filter = 'test(/::over_examples$/) | test(/differential_corpus::answering::over_fixture_bucket_[34]$/) | test(/^(the_drain_answers|two_runs_over_one_corpus|the_differential_tier_audit)/) | test(no_mutation_of_a_fingerprint) | test(the_census_denominator) | test(constant_memo_service::) | test(the_unbounded_runaway_dies) | test(db_transaction_audit::) | test(the_driver_speaks_to_a_real_postgres) | test(host_park::) | test(the_drain_never_commits_and_never_leaks) | test(r4_value_construction) | test(w5_drain_audit::) | test(tiers::)'
priority = 100
