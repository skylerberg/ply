# A separate cargo project, for the reason `spikes/ply-lexer/harness/Cargo.toml`
# gives at length: a fourteenth workspace member moves the test counts that
# `README.md`, `CONTRIBUTING.md` and `docs/ONBOARDING.md` all state, and a spike
# should not make three documents stale. Nothing here is reached by
# `cargo test --workspace`. Run `../run.sh`.
[workspace]

[package]
name = "ply-parser-spike-harness"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
publish = false

[dependencies]
# The parser under comparison. By path, so the comparison is against the tree it
# sits in rather than against a copy.
ply-syntax = { path = "../../../crates/ply-syntax" }
ply-span = { path = "../../../crates/ply-span" }
ply-core = { path = "../../../crates/ply-core" }
ply-derive = { path = "../../../crates/ply-derive" }

[[bin]]
name = "refdump"
path = "src/main.rs"

[lib]
name = "ply_parser_spike_harness"
path = "src/lib.rs"
