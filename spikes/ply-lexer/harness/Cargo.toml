# A separate cargo project, deliberately: `crates/ply-codegen-spike` does the
# same thing and `CONTRIBUTING.md` §"Things known to be broken" item 1 records
# what it cost — `cargo build --workspace` does not reach it and it bit-rotted
# twice. The trade is taken again here for one reason and it is written in
# `../README.md` §"How this is wired": adding a fourteenth workspace member
# moves the test counts that `README.md`, `CONTRIBUTING.md` and
# `docs/ONBOARDING.md` all state, and a spike should not make three documents
# stale. Run `../run.sh`; it is one command and it says so in the README.
[workspace]

[package]
name = "ply-lexer-spike-harness"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
publish = false

[dependencies]
# The lexer under comparison. By path, so the comparison is against the tree it
# sits in rather than against a copy.
ply-syntax = { path = "../../../crates/ply-syntax" }
ply-span = { path = "../../../crates/ply-span" }

[[bin]]
name = "plydump"
path = "src/main.rs"

[lib]
name = "ply_lexer_spike_harness"
path = "src/lib.rs"
