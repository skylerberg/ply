[workspace]
resolver = "3"
members = [
    "crates/ply-span",
    "crates/ply-syntax",
    "crates/ply-derive",
    "crates/ply-core",
    "crates/ply-hash",
    "crates/ply-eval",
    "crates/ply-codegen",
    "crates/ply-store",
    "crates/ply-test",
    "crates/ply-prove",
    "crates/ply-host",
    "crates/ply-std",
    "crates/ply-cli",
    "crates/ply-corpus",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/skylerberg/ply"

[workspace.dependencies]
ply-span = { path = "crates/ply-span" }
ply-syntax = { path = "crates/ply-syntax" }
ply-derive = { path = "crates/ply-derive" }
ply-core = { path = "crates/ply-core" }
ply-hash = { path = "crates/ply-hash" }
ply-eval = { path = "crates/ply-eval" }
ply-codegen = { path = "crates/ply-codegen" }
ply-store = { path = "crates/ply-store" }
ply-test = { path = "crates/ply-test" }
ply-prove = { path = "crates/ply-prove" }
ply-host = { path = "crates/ply-host" }
ply-std = { path = "crates/ply-std" }
ply-cli = { path = "crates/ply-cli" }

anyhow = "1.0.104"
ariadne = "0.6.0"
assert_cmd = "2.2.2"
# The two allocation-attribution suites in `ply-corpus` need a stack walk
# they can memoise. `std::backtrace::Backtrace` resolves symbols only when
# it is formatted and exposes no frames before that, so attributing an
# allocation through it means symbolicating the whole stack every time; this
# crate separates the walk from the resolve, which is what lets the resolve
# happen once per code address instead of once per allocation.
backtrace = "0.3.76"
blake3 = "1.8.5"
clap = { version = "4.6.4", features = ["derive"] }
indexmap = "2.14.0"
# W2. `memchr` is the algorithmic half of the byte builtins: W1's request path
# cost 5.41us per byte because every scan was an O(n) fold boxing an Int per
# byte with no early exit, and no amount of interpreter tuning fixes a pass
# count. `rust_decimal` is bounded — 96-bit mantissa, scale 0..=28, no
# allocation — which is what a value that enters a hash and a cache key needs;
# `bigdecimal`'s unbounded scale would let a division produce a value whose size
# depends on history. `ryu` and `itoa` were rejected: Rust's own `f64`/`i64`
# formatting already round-trips, so both buy speed in a place nothing measured.
memchr = "2.8.3"
memmap2 = "0.9.11"
# Default features off on purpose: they pull `borsh`, `rkyv`, `rand`,
# `serde_json` and forty-odd transitive crates into a trusted computing base
# `ply hosts` invites a reader to check. What is wanted is the arithmetic.
rust_decimal = { version = "1.42.1", default-features = false, features = [
    "std",
    "maths",
] }
rayon = "1.12.0"
rpds = "1.2.1"
rustc-hash = "2.1.3"
# W3, and the only place the trusted computing base grows in it: cryptography is
# the one part of a web server it would be reckless to write in Ply. The latest
# stable 0.23 — `cargo search` surfaces `0.24.0-dev.1`, which is a pre-release.
# `ring` rather than the default `aws_lc_rs`, which needs a C toolchain and cmake
# on some platforms; the provider is installed explicitly by `ply_host::tls` so
# the one line that decides it is the line `ply hosts` names.
rcgen = "0.14.9"
rustls = { version = "0.23.43", default-features = false, features = [
    "ring",
    "std",
    "tls12",
] }
rustls-pemfile = "2.2.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
stacker = "0.1.24"
tempfile = "3.27.0"
thiserror = "2.0.19"
# W4, and the second place the trusted computing base grows: a postgres client
# is a wire protocol and reimplementing one to avoid an async runtime would be
# growing the TCB to hold a protocol for nothing. `rt` and not
# `rt-multi-thread`: one current-thread runtime on one OS thread owned by
# `ply_host::db::Reactor`, because every connection's future is independent, the
# pool bounds the concurrency, and a work-stealing runtime would make the thread
# count a number nobody chose. `deadpool-postgres` rather than `bb8` or a
# hand-rolled pool: it is the smallest of the three, its recycling hook is where
# rollback-on-release lives, and its size is a declared number rather than a
# default.
deadpool-postgres = "0.14.1"
postgres-protocol = "0.6.12"
tokio = { version = "1.53.1", features = ["rt", "net", "time", "sync", "signal"] }
tokio-postgres = { version = "0.7.18", features = ["runtime"] }

# The suite's cost is Ply evaluation, not Rust: the interpreter and the prover
# are dispatch loops, and at `opt-level = 0` `cargo test` spends its time in
# unoptimized evaluation rather than in anything the tests are about.
#
# `cargo test -p ply-eval --test differential_corpus`, which is 48% of CI's
# longest shard by itself, on the machine in docs/ONBOARDING.md §Provenance,
# 2026-08-30, one run each, back to back:
#
#                   in-test wall   process CPU time
#   opt-level = 0        199.03s            632.81s
#   opt-level = 2         30.67s            104.32s
#                          6.5x              6.07x
#
# **The load gate in CONTRIBUTING.md §"Gate on an idle machine before measuring,
# not after" was NOT applied to these, and that section is right that it should
# have been.** Load was not checked before either run and not recorded at the
# time; the machine was found at load ~30 shortly afterwards, with three other
# agents' suites on it, and a follow-up benchmark meant to add `opt-level = 1`
# was abandoned mid-run for that reason. So the wall-clock column has the exact
# provenance defect that section describes.
#
# What survives it is the *direction*, on two grounds. The CPU-time column is
# the second instrument and it is far less load-sensitive than wall clock; the
# two agree at 6.07x and 6.5x. And §"Gate on an idle machine" records load-30
# windows spreading 0.497–1.607 on a ratio whose true value was 1.000 — a factor
# of about 3 of noise, against a factor of 6 of signal here. **Treat the ordering
# as established and the two-significant-figure magnitudes as provisional.**
# Re-take both rows behind a `load < 4` spin before quoting either as a figure.
#
# The cost is the inner loop and it is real, on the same caveat: an incremental
# rebuild after touching `crates/ply-eval/src/lib.rs` went 10s -> 27s. So this
# trades roughly +17s on every edit against roughly -170s on every run of that
# one binary, at a rate of running the suite this project happens to have.
#
# **`opt-level = 1` is UNMEASURED** — it is the abandoned run above, not a
# considered rejection. 2 is the value with evidence behind it rather than the
# established optimum; if the rebuild cost starts to hurt, measure 1 before
# assuming it is the middle ground it looks like.
#
# `debug-assertions` is left at the `dev` default of on, and that is load-
# bearing. Nine sites branch on `cfg!(debug_assertions)` rather than on
# opt-level to pick a wall-clock budget — `crates/ply-test/tests/
# region_fixture_cost.rs:387` and `crates/ply-store/src/tests.rs:2615` among
# them — so they keep their looser debug branch while the code under them gets
# faster. That moves those assertions away from their boundary, never toward it.
# Turning debug-assertions off here would tighten all nine at once.
#
# The `test` profile inherits this one — checked, not recalled: `cargo test -p
# ply-derive --no-run` reports ``Finished `test` profile [optimized +
# debuginfo]`` — so this covers both the test targets and the workspace crates
# they depend on.
# **`debug = "line-tables-only"` was measured here and REJECTED**, and the
# reason is not a build-time one. Cold `cargo test --workspace --no-run` on the
# machine in docs/ONBOARDING.md §Provenance, two clean builds into a wiped
# target, 2026-08-31, **at 54a568d — before cranelift shipped, so the two build
# figures are smaller than this tree's and the ratio is the part to read**:
#
#                        wall      CPU     target/
#   debug = true      151.1s   1277.7s      5.4 GB
#   line-tables-only  128.9s   1040.8s      3.8 GB
#                       -15%     -18.5%       -30%
#
# That is a real saving and it cannot be taken. `crates/ply-corpus/tests/
# r4_value_construction.rs` and `tests/w6_alloc_sites.rs` attribute an
# allocation to the `ply_*` frame that asked for it, and with `opt-level = 2`
# above them the names they need live in DWARF rather than in the symbol table
# — the callers have been inlined. Under line tables only, **unattributed goes
# from 8.5% to 98.7% on the health window and from 11.4% to 99.4% on routing**,
# five of nine tests fail, and the two files stop measuring the thing they
# exist for. Run them before touching this line; a build that is 15% faster and
# reports 99% unattributed is not a trade, it is a deletion.
#
# `debug = 1` is the same setting under its older spelling. `split-debuginfo`
# is a different lever and is UNMEASURED.
[profile.dev]
opt-level = 2

[profile.release]
opt-level = 3
lto = "thin"
