[workspace]
resolver = "3"
members = [
    "crates/ply-eval",
    "crates/ply-codegen",
    "crates/ply-machine",
    "crates/ply-launcher",
    "crates/ply-host",
    "crates/ply-std",
    "crates/ply-codegen-tests",
    "crates/ply-compiler",
    "crates/ply-eval-tests",
    "crates/ply-host-tests",
    "crates/ply-machine-tests",
    "crates/ply-launcher-tests",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/skylerberg/ply"

[workspace.dependencies]
ply-eval = { path = "crates/ply-eval" }
ply-codegen = { path = "crates/ply-codegen" }
ply-compiler = { path = "crates/ply-compiler" }
ply-machine = { path = "crates/ply-machine" }
ply-launcher = { path = "crates/ply-launcher" }
ply-host = { path = "crates/ply-host" }
ply-std = { path = "crates/ply-std" }

anyhow = "1.0.104"
assert_cmd = "2.2.2"
# `std::backtrace` resolves symbols only when it is formatted, so attributing an
# allocation through it symbolicates the whole stack every time; this crate
# separates the walk from the resolve, so the resolve happens once per code
# address instead of once per allocation.
backtrace = "0.3.76"
blake3 = "1.8.5"
# A unit's C is sealed with it, by the runtime's `bytes_gzip` and by the loader that reads one back.
flate2 = "1.1.10"
indexmap = "2.14.0"
# The float functions a platform's libm answers to within an ulp, answered here
# the same on every machine: test results are cached and the prover evaluates
# ground terms, so an answer that moved with the OS would be a wrong cache hit.
libm = "0.2.16"
# The algorithmic half of the byte builtins: every scan used to be an O(n) fold
# boxing an Int per byte with no early exit, and no interpreter tuning fixes a
# pass count. `ryu` and `itoa` were rejected — Rust's own `f64`/`i64` formatting
# already round-trips.
memchr = "2.8.3"
memmap2 = "0.9.11"
# Bounded — 96-bit mantissa, scale 0..=28, no allocation — which is what a value
# that enters a hash and a cache key needs; `bigdecimal`'s unbounded scale would
# let a division produce a value whose size depends on its history. Default
# features off: they pull `borsh`, `rkyv`, `rand`, `serde_json` and forty-odd
# transitive crates into a trusted computing base `ply hosts` invites a reader to
# audit.
rust_decimal = { version = "1.42.1", default-features = false, features = [
    "std",
    "maths",
] }
rayon = "1.12.0"
rpds = "1.2.1"
rustc-hash = "2.1.3"
# Cryptography is the one part of a web server it would be reckless to write in
# Ply. `ring` rather than the default `aws_lc_rs`, which needs a C toolchain and
# cmake on some platforms; the provider is installed explicitly by
# `ply_host::tls` so the one line that decides it is the line `ply hosts` names.
rcgen = "0.14.9"
rustls = { version = "0.23.43", default-features = false, features = [
    "ring",
    "std",
    "tls12",
] }
rustls-pemfile = "2.2.0"
webpki-roots = "1.0.9"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.151", features = ["float_roundtrip"] }
stacker = "0.1.24"
tempfile = "3.27.0"
# Only `ply_host::signal` is async: it waits for SIGINT and SIGTERM on a
# current-thread runtime of its own.
tokio = { version = "1.53.1", features = ["rt", "net", "time", "sync", "signal"] }

# The suite's cost is running Ply: compiled code calls into the Rust runtime for every
# allocation and count, so at `opt-level = 0` `cargo test` spends its time in unoptimized
# helpers rather than in anything the tests are about. This trades a slower incremental
# rebuild for a much faster suite, and the suite dominates.
#
# Workspace members keep their DWARF: `ply --count-alloc-sites` attributes an allocation to
# the `ply_*` frame that asked for it, and with `opt-level = 2` those callers are inlined, so
# their names live in DWARF rather than in the symbol table. `debug = "line-tables-only"`
# loses them; the `package."*"` block below drops DWARF for dependencies only. CI, where nothing
# attributes allocation sites, builds line tables only (`CARGO_PROFILE_DEV_DEBUG` in ci.yml).
#
# Incremental builds stay on: an agent builds, edits and builds a worktree again many times,
# and without them a one-line edit in a low crate rebuilds everything above it. CI pins
# `CARGO_INCREMENTAL=0` in `.github/workflows/ci.yml`, where no later job could reuse the
# cache.
[profile.dev]
opt-level = 2

# Dependencies only — `*` does not match workspace members. See the DWARF note
# above for why that boundary is where it is.
[profile.dev.package."*"]
debug = false

# The integration suites live in packages of their own so that they can be
# compiled at `opt-level = 0` while the libraries they exercise stay at 2: cargo
# sets a profile per package, not per target, so a crate's own `tests/` would
# share its library's level. A suite drives code that lives in the libraries, so
# the test code's level is worth nothing at run time and a great deal at compile
# time. Cargo builds a package's binaries only for that package's own tests, so
# `crates/ply-launcher/tests/binary.rs` is what keeps `ply` built for the Ply
# suites that drive it, the CLI's in `crates/ply-cli-tests/ply` among them. The
# unit tests of a crate whose `[lib]` says `test = false` have moved too, to
# their `-tests` package's `tests/unit`, so each package links one test binary
# per target; the rest still keep theirs in `src/`.

[profile.dev.package.ply-launcher-tests]
opt-level = 0

[profile.dev.package.ply-machine-tests]
opt-level = 0

[profile.dev.package.ply-codegen-tests]
opt-level = 0

[profile.dev.package.ply-eval-tests]
opt-level = 0

[profile.dev.package.ply-host-tests]
opt-level = 0

[profile.release]
opt-level = 3
lto = "thin"
