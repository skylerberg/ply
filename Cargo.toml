[workspace]
resolver = "3"
members = [
    "crates/ply-core",
    "crates/ply-compiled",
    "crates/ply-privileged",
    "crates/ply-launcher",
    "crates/ply-runtime",
    "crates/ply-host",
    "crates/ply-pack",
    "crates/ply-compiled-tests",
    "crates/ply-core-tests",
    "crates/ply-host-tests",
    "crates/ply-privileged-tests",
    "crates/ply-launcher-tests",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/skylerberg/ply"

[workspace.dependencies]
ply-core = { path = "crates/ply-core" }
ply-compiled = { path = "crates/ply-compiled" }
ply-privileged = { path = "crates/ply-privileged" }
ply-launcher = { path = "crates/ply-launcher" }
ply-host = { path = "crates/ply-host" }
ply-pack = { path = "crates/ply-pack" }

anyhow = "1.0.104"
ctor = "1.0.13"
blake3 = "1.8.5"
zstd = { version = "0.14.2", default-features = false }
cc = "1.8.0"
astro-float = { version = "0.9.6", default-features = false, features = ["std"] }
memchr = "2.8.3"
memmap2 = "0.9.11"
rust_decimal = { version = "1.42.1", default-features = false, features = [
    "std",
    "maths",
] }
rusqlite = { version = "0.40.2", default-features = false, features = [
    "bundled",
    "cache",
    "functions",
    "hooks",
    "limits",
    "serialize",
] }
rayon = "1.12.0"
rustc-hash = "2.1.3"
rcgen = "0.14.9"
rustls = { version = "0.23.43", default-features = false, features = [
    "ring",
    "std",
    "tls12",
] }
rustls-pemfile = "2.2.0"
ring = "0.17.14"
curve25519-dalek = { version = "5.0.0", default-features = false, features = [
    "zeroize",
] }
p256 = { version = "0.14.0", default-features = false, features = [
    "ecdsa",
    "ecdh",
    "pkcs8",
] }
p384 = { version = "0.14.0", default-features = false, features = ["ecdsa", "pkcs8"] }
p521 = { version = "0.14.0", default-features = false, features = ["ecdsa", "pkcs8"] }
k256 = { version = "0.14.0", default-features = false, features = ["ecdsa", "pkcs8"] }
subtle = "2.6.1"
zeroize = "1.9.0"
argon2 = { version = "0.6.0", default-features = false, features = [
    "alloc",
    "zeroize",
] }
scrypt = { version = "0.12.0", default-features = false }
blowfish = { version = "0.10.0", features = ["bcrypt", "zeroize"] }
webpki-roots = "1.0.9"
tempfile = "3.27.0"
tokio = { version = "1.53.1", features = ["rt", "net", "time", "sync", "signal"] }

[profile.dev]
opt-level = 2
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

[profile.dev.package.ply-launcher-tests]
opt-level = 0

[profile.dev.package.ply-privileged-tests]
opt-level = 0

[profile.dev.package.ply-compiled-tests]
opt-level = 0

[profile.dev.package.ply-core-tests]
opt-level = 0

[profile.dev.package.ply-host-tests]
opt-level = 0

[profile.release]
opt-level = 3
lto = "thin"
