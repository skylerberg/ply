[workspace]
resolver = "3"
members = [
    "crates/ply-span",
    "crates/ply-syntax",
    "crates/ply-derive",
    "crates/ply-core",
    "crates/ply-hash",
    "crates/ply-eval",
    "crates/ply-codegen",
    "crates/ply-store",
    "crates/ply-test",
    "crates/ply-prove",
    "crates/ply-host",
    "crates/ply-std",
    "crates/ply-cli",
    "crates/ply-corpus",
    "crates/ply-codegen-tests",
    "crates/ply-core-tests",
    "crates/ply-corpus-tests",
    "crates/ply-derive-tests",
    "crates/ply-eval-tests",
    "crates/ply-hash-tests",
    "crates/ply-host-tests",
    "crates/ply-span-tests",
    "crates/ply-store-tests",
    "crates/ply-test-tests",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/skylerberg/ply"

[workspace.dependencies]
ply-span = { path = "crates/ply-span" }
ply-syntax = { path = "crates/ply-syntax" }
ply-derive = { path = "crates/ply-derive" }
ply-core = { path = "crates/ply-core" }
ply-hash = { path = "crates/ply-hash" }
ply-eval = { path = "crates/ply-eval" }
ply-codegen = { path = "crates/ply-codegen" }
ply-store = { path = "crates/ply-store" }
ply-test = { path = "crates/ply-test" }
ply-prove = { path = "crates/ply-prove" }
ply-host = { path = "crates/ply-host" }
ply-std = { path = "crates/ply-std" }
ply-cli = { path = "crates/ply-cli" }
ply-corpus = { path = "crates/ply-corpus" }

anyhow = "1.0.104"
ariadne = "0.6.0"
assert_cmd = "2.2.2"
# `std::backtrace` resolves symbols only when it is formatted, so attributing an
# allocation through it symbolicates the whole stack every time; this crate
# separates the walk from the resolve, so the resolve happens once per code
# address instead of once per allocation.
backtrace = "0.3.76"
blake3 = "1.8.5"
clap = { version = "4.6.4", features = ["derive"] }
indexmap = "2.14.0"
# The algorithmic half of the byte builtins: every scan used to be an O(n) fold
# boxing an Int per byte with no early exit, and no interpreter tuning fixes a
# pass count. `ryu` and `itoa` were rejected — Rust's own `f64`/`i64` formatting
# already round-trips.
memchr = "2.8.3"
memmap2 = "0.9.11"
# Bounded — 96-bit mantissa, scale 0..=28, no allocation — which is what a value
# that enters a hash and a cache key needs; `bigdecimal`'s unbounded scale would
# let a division produce a value whose size depends on its history. Default
# features off: they pull `borsh`, `rkyv`, `rand`, `serde_json` and forty-odd
# transitive crates into a trusted computing base `ply hosts` invites a reader to
# audit.
rust_decimal = { version = "1.42.1", default-features = false, features = [
    "std",
    "maths",
] }
rayon = "1.12.0"
rpds = "1.2.1"
rustc-hash = "2.1.3"
# Cryptography is the one part of a web server it would be reckless to write in
# Ply. `ring` rather than the default `aws_lc_rs`, which needs a C toolchain and
# cmake on some platforms; the provider is installed explicitly by
# `ply_host::tls` so the one line that decides it is the line `ply hosts` names.
rcgen = "0.14.9"
rustls = { version = "0.23.43", default-features = false, features = [
    "ring",
    "std",
    "tls12",
] }
rustls-pemfile = "2.2.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
stacker = "0.1.24"
tempfile = "3.27.0"
thiserror = "2.0.19"
# A postgres client is a wire protocol, and reimplementing one to avoid an async
# runtime would grow the TCB to hold a protocol for nothing. `rt` and not
# `rt-multi-thread`: one current-thread runtime on one OS thread owned by
# `ply_host::db::Reactor`, because every connection's future is independent, the
# pool bounds the concurrency, and a work-stealing runtime would make the thread
# count a number nobody chose. `deadpool-postgres` rather than `bb8` or a
# hand-rolled pool: it is the smallest of the three, and its recycling hook is
# where rollback-on-release lives.
deadpool-postgres = "0.14.1"
postgres-protocol = "0.6.12"
tokio = { version = "1.53.1", features = ["rt", "net", "time", "sync", "signal"] }
tokio-postgres = { version = "0.7.18", features = ["runtime"] }

# The suite's cost is Ply evaluation, not Rust: the interpreter and the prover
# are dispatch loops, so at `opt-level = 0` `cargo test` spends its time in
# unoptimized evaluation rather than in anything the tests are about. This trades
# a slower incremental rebuild for a much faster suite, and the suite dominates.
#
# `debug-assertions` stays at the `dev` default of on, and that is load-bearing:
# nine sites branch on `cfg!(debug_assertions)` rather than on opt-level to pick
# a wall-clock budget, so they keep their looser branch while the code under them
# gets faster. Turning it off would tighten all nine at once.
#
# `debug = "line-tables-only"` was measured and rejected, and the note is here so
# nobody runs the experiment again: it is worth about 15% of build time, but
# `crates/ply-corpus-tests/tests/r4_value_construction.rs` and `tests/w6_alloc_sites.rs`
# attribute an allocation to the `ply_*` frame that asked for it, and with
# `opt-level = 2` above them those names live in DWARF rather than in the symbol
# table — the callers have been inlined. Under line tables only, unattributed
# allocations go from 8.5% to 98.7% and five of nine tests fail. What was
# rejected is the *global* setting. Those two suites name `ply_*` frames and
# nothing else, so the `package."*"` block below drops DWARF for dependencies
# only and both still pass; widening it to workspace members is the rejected
# experiment wearing a different flag.
#
# `incremental = false` was measured and rejected, and the note is here so nobody
# runs the experiment again. It was argued from worktrees that "build once and
# are thrown away", and that is not how a worktree is used: an agent builds,
# edits and builds again many times. Off, it saved nothing on the first build
# and made every rebuild after a one-line edit in `ply-core` a full rebuild of
# everything above it — minutes instead of seconds. The cost of leaving it on is
# a few GB of `target/debug/incremental` per worktree. CI pins
# `CARGO_INCREMENTAL=0` in `.github/workflows/ci.yml`, where no later job could
# reuse the cache.
[profile.dev]
opt-level = 2

# Dependencies only — `*` does not match workspace members. See the DWARF note
# above for why that boundary is where it is.
[profile.dev.package."*"]
debug = false

# The integration suites live in packages of their own so that they can be
# compiled at `opt-level = 0` while the libraries they exercise stay at 2: cargo
# sets a profile per package, not per target, so a crate's own `tests/` would
# share its library's level. The suite drives an interpreter that lives in the
# library, so the test code's level is worth nothing at run time and a great
# deal at compile time — measured on `ply-eval`'s suite as a fivefold cheaper
# build for an identical run. A test that runs its crate's binary stays in the
# crate: cargo builds a package's binaries only for that package's own tests, so
# `ply-cli`'s suite stays whole and `ply-corpus` keeps the one file that runs
# `w6-alloc`. Unit tests stay in `src/` and keep their crate's level; what a
# unit-test binary costs is the tests and what they reach, not a second compile
# of the crate, so they are the next candidates once they can leave `src/`.

[profile.dev.package.ply-codegen-tests]
opt-level = 0

[profile.dev.package.ply-core-tests]
opt-level = 0

[profile.dev.package.ply-corpus-tests]
opt-level = 0

[profile.dev.package.ply-derive-tests]
opt-level = 0

[profile.dev.package.ply-eval-tests]
opt-level = 0

[profile.dev.package.ply-hash-tests]
opt-level = 0

[profile.dev.package.ply-host-tests]
opt-level = 0

[profile.dev.package.ply-span-tests]
opt-level = 0

[profile.dev.package.ply-store-tests]
opt-level = 0

[profile.dev.package.ply-test-tests]
opt-level = 0

[profile.release]
opt-level = 3
lto = "thin"
