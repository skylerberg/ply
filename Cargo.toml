[workspace]
resolver = "3"
members = [
    "crates/ply-span",
    "crates/ply-syntax",
    "crates/ply-derive",
    "crates/ply-core",
    "crates/ply-hash",
    "crates/ply-eval",
    "crates/ply-store",
    "crates/ply-test",
    "crates/ply-prove",
    "crates/ply-host",
    "crates/ply-std",
    "crates/ply-cli",
    "crates/ply-corpus",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/skylerberg/ply"

[workspace.dependencies]
ply-span = { path = "crates/ply-span" }
ply-syntax = { path = "crates/ply-syntax" }
ply-derive = { path = "crates/ply-derive" }
ply-core = { path = "crates/ply-core" }
ply-hash = { path = "crates/ply-hash" }
ply-eval = { path = "crates/ply-eval" }
ply-store = { path = "crates/ply-store" }
ply-test = { path = "crates/ply-test" }
ply-prove = { path = "crates/ply-prove" }
ply-host = { path = "crates/ply-host" }
ply-std = { path = "crates/ply-std" }
ply-cli = { path = "crates/ply-cli" }

anyhow = "1.0.104"
ariadne = "0.6.0"
assert_cmd = "2.2.2"
blake3 = "1.8.5"
clap = { version = "4.6.4", features = ["derive"] }
indexmap = "2.14.0"
# W2. `memchr` is the algorithmic half of the byte builtins: W1's request path
# cost 5.41us per byte because every scan was an O(n) fold boxing an Int per
# byte with no early exit, and no amount of interpreter tuning fixes a pass
# count. `rust_decimal` is bounded — 96-bit mantissa, scale 0..=28, no
# allocation — which is what a value that enters a hash and a cache key needs;
# `bigdecimal`'s unbounded scale would let a division produce a value whose size
# depends on history. `ryu` and `itoa` were rejected: Rust's own `f64`/`i64`
# formatting already round-trips, so both buy speed in a place nothing measured.
memchr = "2.8.3"
memmap2 = "0.9.11"
# Default features off on purpose: they pull `borsh`, `rkyv`, `rand`,
# `serde_json` and forty-odd transitive crates into a trusted computing base
# `ply hosts` invites a reader to check. What is wanted is the arithmetic.
rust_decimal = { version = "1.42.1", default-features = false, features = [
    "std",
    "maths",
] }
rayon = "1.12.0"
rpds = "1.2.1"
rustc-hash = "2.1.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
stacker = "0.1.24"
tempfile = "3.27.0"
thiserror = "2.0.19"
# W1's only new dependency, and `rt-multi-thread` is deliberately absent: a
# work-stealing runtime is unusable here because nothing it would steal is
# `Send`. Tokio earns its place as the reactor and the timer wheel; the blocking
# pool is `std::thread` owned by `ply-host`, so its size is a reviewable number
# rather than tokio's default of 512.
tokio = { version = "1.53.1", features = ["rt", "net", "time", "sync"] }

[profile.release]
opt-level = 3
lto = "thin"
