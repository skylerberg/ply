name: Keep the toolchain
description: >-
  On main, saves what later runs start from, under the toolchain's key: the stage, reduced to the
  files that this job's `ply` programs read or wrote since `/tmp/ply-c-used.mark`, and the `ply` at
  `target/release/ply`. Only the job that last bootstrapped the toolchain saves them, so the saved
  stage contains the compiled bootstrap that the `ply` main publishes needs.
inputs:
  toolchain:
    description: the toolchain's key
    required: true
  stage:
    description: "`true` when no cache entry contains this toolchain's stage yet"
    required: true
  ply_saved:
    description: "`true` when a cache entry already contains this toolchain's `ply`"
    required: true
runs:
  using: composite
  steps:
    - name: Cut the stage to what this job used
      if: inputs.stage == 'true'
      shell: bash
      run: .github/ci-warm.sh used /tmp/ply-c-used.mark
    - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      if: inputs.stage == 'true'
      with:
        path: |
          /tmp/ply-c-cache
          /tmp/ply-c-stage
        key: ply-c-stage-sources-${{ inputs.toolchain }}
    - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      if: inputs.ply_saved != 'true'
      with:
        path: target/release/ply
        key: ply-built-${{ runner.os }}-${{ runner.arch }}-${{ inputs.toolchain }}
