name: Keep the toolchain
description: >-
  On main, what the runs after start from: the stage cut to what this job's `ply`s read and wrote
  since `/tmp/ply-c-used.mark`, and the `ply` at `target/release/ply`, each under the toolchain's
  key. The job that last bootstrapped the toolchain keeps it, so the stage holds the builder the
  `ply` main publishes asks for.
inputs:
  toolchain:
    description: the toolchain's key
    required: true
  stage:
    description: "`true` where no cache entry holds this toolchain's stage yet"
    required: true
  kept:
    description: "`true` where a cache entry already holds this toolchain's `ply`"
    required: true
runs:
  using: composite
  steps:
    - name: Cut the stage to what this job used
      if: inputs.stage == 'true'
      shell: bash
      run: .github/ci-warm.sh used /tmp/ply-c-used.mark
    - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      if: inputs.stage == 'true'
      with:
        path: |
          /tmp/ply-c-cache
          /tmp/ply-c-stage
        key: ply-c-stage-sources-${{ inputs.toolchain }}
    - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      if: inputs.kept != 'true'
      with:
        path: target/release/ply
        key: ply-built-${{ runner.os }}-${{ runner.arch }}-${{ inputs.toolchain }}
