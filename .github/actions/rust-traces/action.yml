name: The Rust tests' traces
description: >-
  What each Rust test read the last time it passed, restored to /tmp/ply-rust-traces: a test whose
  reads of the pack and through the host still answer as they did is not run again. The store is
  keyed by the Rust key and the checkout files tests read directly, outside the pack.
outputs:
  digest:
    description: what the store is keyed by, after `rust-traces-`
    value: ${{ steps.digest.outputs.digest }}
runs:
  using: composite
  steps:
    - uses: ./.github/actions/rust-key
      id: rust
    - id: digest
      shell: bash
      env:
        RUST: ${{ steps.rust.outputs.key }}
        READ: ${{ hashFiles('benches/**', 'examples/**', 'tests/**', 'crates/*/tests/**') }}
      run: echo "digest=$RUST-${READ:0:16}" >> "$GITHUB_OUTPUT"
    - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      if: env.PLY_CI_COLD != 'true'
      with:
        path: /tmp/ply-rust-traces
        key: rust-traces-${{ steps.digest.outputs.digest }}-${{ github.run_id }}
        restore-keys: rust-traces-${{ steps.digest.outputs.digest }}-
