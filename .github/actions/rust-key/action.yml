name: Compute the Rust key
description: >-
  Computes a digest of everything that the Rust build and its tests read, and nothing else. The
  archive, the runtime's library and a passing run of the Rust tests are cached under it, so a change
  to Ply sources alone builds and runs no Rust. `ci-shards.sh rust-inputs` checks that a fresh
  build's dep-info matches these patterns.
outputs:
  key:
    description: the digest, as hex
    value: ${{ steps.key.outputs.key }}
runs:
  using: composite
  steps:
    - id: key
      shell: bash
      env:
        INPUTS: ${{ hashFiles('Cargo.toml', 'Cargo.lock', '.cargo/config.toml', 'crates/*/Cargo.toml', 'crates/*/build.rs', 'crates/*/src/**', 'crates/*/tests/**') }}
      run: |
        set -euo pipefail
        : "${RUST_TOOLCHAIN:?the workflow names its toolchain in RUST_TOOLCHAIN}"
        key=$(printf '%s\n' "$RUST_TOOLCHAIN" "${NEXTEST_VERSION:-}" "$INPUTS" | shasum -a 256 | cut -c1-40)
        echo "key=$key" >> "$GITHUB_OUTPUT"
        echo "the Rust key is $key"
