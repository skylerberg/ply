name: Compute the Rust key
description: >-
  A digest of everything the Rust build reads, and nothing it does not: the archive and the runtime
  binary are cached under it, so a change to Ply sources alone builds no Rust. `ci-shards.sh
  rust-inputs` holds a fresh build's dep-info to these patterns.
outputs:
  key:
    description: the digest, as hex
    value: ${{ steps.key.outputs.key }}
runs:
  using: composite
  steps:
    - id: key
      shell: bash
      env:
        INPUTS: ${{ hashFiles('Cargo.toml', 'Cargo.lock', '.cargo/config.toml', 'crates/*/Cargo.toml', 'crates/*/build.rs', 'crates/*/src/**', 'crates/*/tests/**/*.rs') }}
      run: |
        set -euo pipefail
        : "${RUST_TOOLCHAIN:?the workflow names its toolchain in RUST_TOOLCHAIN}"
        key=$(printf '%s\n' "$RUST_TOOLCHAIN" "${CARGO_PROFILE_DEV_DEBUG:-}" "${NEXTEST_VERSION:-}" "$INPUTS" | sha256sum | cut -c1-40)
        echo "key=$key" >> "$GITHUB_OUTPUT"
        echo "the Rust key is $key"
