name: Restore the C cache and stages
description: >-
  Restores the C cache and stages that main saved for this toolchain. If there are none, restores the
  newest C cache and std's records that main saved for another toolchain, without its stages
  (`ci-warm.sh foreign`). Either way, objects, cached results and std's checks whose inputs
  did not change are not built again. Restored files keep their modification times, so `ci-warm.sh
  used` can delete the files that a job did not read.
inputs:
  toolchain:
    description: the toolchain's key
    required: true
runs:
  using: composite
  steps:
    - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      id: cached
      with:
        path: |
          /tmp/ply-c-cache
          /tmp/ply-c-stage
        key: ply-c-stage-sources-${{ inputs.toolchain }}
        restore-keys: ply-c-stage-sources-
    - name: Keep only the C cache and std's records of another toolchain's entry
      if: steps.cached.outputs.cache-matched-key != '' && steps.cached.outputs.cache-hit != 'true'
      shell: bash
      run: .github/ci-warm.sh foreign
