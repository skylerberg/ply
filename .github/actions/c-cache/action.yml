name: Restore the C cache and stages
description: >-
  The C cache and stages main saved of this toolchain, or else the newest C cache and std's records
  main saved of another, without its stages (`ci-warm.sh foreign`): the objects, builders, answers
  and std's checks whose inputs did not move are not made again. Restored files keep their times, so `ci-warm.sh used`
  drops those a job did not read.
inputs:
  toolchain:
    description: the toolchain's key
    required: true
runs:
  using: composite
  steps:
    - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      id: cached
      with:
        path: |
          /tmp/ply-c-cache
          /tmp/ply-c-stage
        key: ply-c-stage-sources-${{ inputs.toolchain }}
        restore-keys: ply-c-stage-sources-
    - name: Keep only the C cache and std's records of another toolchain's entry
      if: steps.cached.outputs.cache-matched-key != '' && steps.cached.outputs.cache-hit != 'true'
      shell: bash
      run: .github/ci-warm.sh foreign
