name: Restore the C cache and stages
description: >-
  Restores the C cache and stages that main saved for this toolchain, or else the newest entry main
  saved for another toolchain. The stores check their own facts, and a binary's directory is
  released once its binary is gone, so nothing in another toolchain's entry is read wrongly.
inputs:
  toolchain:
    description: the toolchain's key
    required: true
runs:
  using: composite
  steps:
    - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: |
          /tmp/ply-c-cache
          /tmp/ply-c-stage
        key: ply-c-stage-sources-${{ inputs.toolchain }}
        restore-keys: ply-c-stage-sources-
