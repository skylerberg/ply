name: The built suite
description: tcc, nextest, the build job's archive unpacked in place, and this slot's object cache
inputs:
  slot:
    description: Which slice of the suite this job runs, naming the object cache it restores
    required: true
outputs:
  objects-key:
    description: The object cache's key for this slot
    value: ${{ steps.objects.outputs.cache-primary-key }}
  objects-hit:
    description: Whether that exact key was restored, so a save would write what is already there
    value: ${{ steps.objects.outputs.cache-hit }}
runs:
  using: composite
  steps:
    - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
      with:
        name: tcc
        path: tcc
    - name: tcc, the development profile's C compiler
      shell: bash
      run: sudo dpkg -i tcc/*.deb
    - uses: taiki-e/install-action@0758d235715de2f3551eacc980d9ae8fce9342c3 # v2.87.3
      with:
        tool: cargo-nextest@0.9.143
    - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: nextest.tar.zst
        key: nextest-archive-${{ github.run_id }}
        fail-on-cache-miss: true
    # Unpacked where it was built, so paths compiled into test binaries still resolve. Removed
    # after, since the runner's disk is small.
    - name: Unpack the archive where it was built
      shell: bash
      run: |
        set -euo pipefail
        zstd -d --long=30 -c nextest.tar.zst | tar -xf -
        rm nextest.tar.zst
        test -f target/nextest/binaries-metadata.json
    # Content-addressed, so any older cache is correct, only slower.
    - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      id: objects
      with:
        path: /tmp/ply-c-cache
        key: ply-c-cache-${{ inputs.slot }}-${{ hashFiles('crates/ply-codegen/src/**', 'crates/ply-compiler/**', 'crates/ply-std/**') }}
        restore-keys: ply-c-cache-${{ inputs.slot }}-
