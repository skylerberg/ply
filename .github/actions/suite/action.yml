name: The built suite
description: tcc, nextest, the build job's archive unpacked in place, and the run's emitted stage
runs:
  using: composite
  steps:
    - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: tcc
        key: tcc-${{ runner.os }}-${{ runner.arch }}
    # The cache is an optimisation, not the source: apt still has it if the entry was evicted.
    - name: tcc, the development profile's C compiler
      shell: bash
      run: |
        set -euo pipefail
        if compgen -G 'tcc/*.deb' >/dev/null; then
          sudo dpkg -i tcc/*.deb
        else
          sudo apt-get update -qq
          sudo apt-get install -y -qq tcc
        fi
        tcc -v
    - uses: taiki-e/install-action@0758d235715de2f3551eacc980d9ae8fce9342c3 # v2.87.3
      with:
        tool: cargo-nextest@0.9.143
    - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: nextest.tar.zst
        key: nextest-archive-${{ github.run_id }}
        fail-on-cache-miss: true
    # Unpacked where it was built, so paths compiled into test binaries still resolve. Removed
    # after, since the runner's disk is small.
    - name: Unpack the archive where it was built
      shell: bash
      run: |
        set -euo pipefail
        zstd -d --long=30 -c nextest.tar.zst | tar -xf -
        rm nextest.tar.zst
        test -f target/nextest/binaries-metadata.json
    # What the `stage` job emitted for this run: the emitted bodies under `ply-c-cache` and the
    # native stage they were built from under `ply-c-stage`. Both are content-addressed, so one
    # copy serves every slice, and both are restored here rather than rebuilt by the warm-up
    # below. The prefix is what `stage` itself restores, since the run's own key cannot exist yet
    # when it runs.
    - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: |
          /tmp/ply-c-cache
          /tmp/ply-c-stage
        key: ply-c-stage-run-${{ github.run_id }}
        # A suite job wants this run's stage. `stage` itself, running before that exists, wants the
        # one carried from a tree whose sources hash the same, and settles for any as a last resort.
        restore-keys: |
          ply-c-stage-${{ hashFiles('crates/*/src/**', 'crates/*/Cargo.toml', 'Cargo.lock', 'crates/ply-compiler/ply/**', 'crates/ply-std/ply/**', 'crates/ply-cli/ply/**', 'crates/ply-corpus/ply/**') }}
          ply-c-stage-
    # The `stage` job has already emitted this, so these two find it and return; they stay because
    # a test must never be the one that pays for it under a wall-clock limit. `explain` is the
    # cheapest entry into the program: it builds it, lays out the shelf and files the front end,
    # and reaches no tree at all.
    - name: Warm the emitter's stage and the `ply` program
      shell: bash
      run: |
        set -euo pipefail
        ply=$(find target -maxdepth 2 -type f -name ply -perm -u+x | head -1)
        [ -n "$ply" ] || { echo "no ply binary in the archive" >&2; exit 1; }
        "$ply" check examples/hello.ply >/dev/null
        "$ply" explain E0001 >/dev/null
    # The corpus's own front door is a stage of the same kind, and only a run of the corpus builds
    # it. Warming it here means a shard's corpus tests find it rather than each race to build one.
    - name: Warm the corpus's stage
      shell: bash
      run: |
        set -euo pipefail
        cargo-nextest nextest run \
          --binaries-metadata target/nextest/binaries-metadata.json \
          --cargo-metadata target/nextest/cargo-metadata.json \
          --workspace-remap "$GITHUB_WORKSPACE" --target-dir-remap "$GITHUB_WORKSPACE/target" \
          -E 'test(a_corpus_with_no_effects_still_compiles)' >/dev/null
