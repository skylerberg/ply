# The built suite, on a runner that built nothing: the C compiler the
# development profile calls (its packages fetched once by `build-ply`),
# nextest, and the archive `build` made, unpacked
# where it was built so a path compiled into a test binary is still the path
# it names. The archive is removed once unpacked -- a runner's disk is small,
# and the unpacked tree is most of it. The `run` steps of the jobs that use
# this pass `target/nextest/*.json` to nextest rather than the archive, which
# is also what lets one job run nextest twice without unpacking twice.
name: The built suite
description: tcc, nextest, the archive the build job made unpacked in place, and the object cache the last run of this slot left
inputs:
  slot:
    description: Which slice of the suite this job runs, naming the object cache it restores
    required: true
outputs:
  objects-key:
    description: The object cache's key for this slot, from what decides a unit's contents
    value: ${{ steps.objects.outputs.cache-primary-key }}
  objects-hit:
    description: Whether that exact key was restored, so a save would write what is already there
    value: ${{ steps.objects.outputs.cache-hit }}
runs:
  using: composite
  steps:
    - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
      with:
        name: tcc
        path: tcc
    - name: tcc, the development profile's C compiler
      shell: bash
      run: sudo dpkg -i tcc/*.deb
    - uses: taiki-e/install-action@0758d235715de2f3551eacc980d9ae8fce9342c3 # v2.87.3
      with:
        tool: cargo-nextest@0.9.143
    - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: nextest.tar.zst
        key: nextest-archive-${{ github.run_id }}
        fail-on-cache-miss: true
    - name: Unpack the archive where it was built
      shell: bash
      run: |
        set -euo pipefail
        echo "before: $(df -h / | awk 'NR == 2 { print $4 " free" }'), $(free -m | awk 'NR == 2 { print $7 " MB available" }')"
        zstd -d --long=30 -c nextest.tar.zst | tar -xf -
        rm nextest.tar.zst
        test -f target/nextest/binaries-metadata.json
        echo "after:  $(df -h / | awk 'NR == 2 { print $4 " free" }'), target is $(du -sh target | cut -f1)"
    # The tier's object cache, content-addressed, from the last run of this
    # slot on `main`: a test program that has not changed loads its compiled
    # unit instead of emitting and compiling it again. Any older cache is a
    # correct one -- an entry is never wrong, only absent -- and the sweep in
    # `crates/ply-codegen/src/c/sweep.rs` keeps it bounded. Saved by the job
    # itself, at the end, on `main`.
    # Keyed by what decides a unit's contents -- the runtime, the compiler and the
    # standard library -- so a run that changed none of them restores the key exactly
    # and its jobs skip the save, which cost the slowest partition a tenth of its time.
    # A test program those runs added is compiled again until the key next moves; the
    # cache is content-addressed, so a stale one is only slower, never wrong.
    - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      id: objects
      with:
        path: /tmp/ply-c-cache
        key: ply-c-cache-${{ inputs.slot }}-${{ hashFiles('crates/ply-codegen/src/**', 'crates/ply-compiler/**', 'crates/ply-std/**') }}
        restore-keys: ply-c-cache-${{ inputs.slot }}-
