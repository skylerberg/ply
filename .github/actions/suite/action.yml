name: Set up the built suite
description: tcc, the `ply` build-ply bootstrapped, and the C cache and stages the run's jobs read
inputs:
  stage:
    description: the artifact `build-ply` handed the run's stage over in, or empty where it saved it to the cache
    required: false
    default: ""
  toolchain:
    description: the key of the toolchain the run's `ply` is of, as `build-ply` names it
    required: true
runs:
  using: composite
  steps:
    - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: tcc
        key: tcc-${{ runner.os }}-${{ runner.arch }}
    - name: Install tcc
      shell: bash
      run: .github/ci-tcc.sh install
    # Installs `tcc` where the test suites' permissions (`--exec`, `--fs` and `--allow` options)
    # expect to find it.
    - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
      with:
        name: ply
        path: target/debug
    - name: Make the downloaded `ply` runnable
      shell: bash
      run: |
        set -euo pipefail
        chmod +x target/debug/ply
        target/debug/ply --version
    # Restores the caches for C compilation, by the first of these sources that has them. First, the
    # artifact that this run's `build-ply` job uploaded, named by the `stage` input. Second, the
    # cache entry that `main` saved under the key of this run's toolchain, which is the hash of the
    # files that a bootstrap reads `ply` from. Third, the C cache saved by a run with a different
    # toolchain (see `foreign` in `ci-warm.sh`). That cache keeps only the standard library's stored
    # results, and the other directories are removed.
    #
    # The caches have two parts. `ply-c-cache` holds compiled objects and stored results of the C
    # emitter. `ply-c-stage` holds the files that the bootstrap of this run's `ply` produced along
    # the way.
    - name: Restore the stage this run's `build-ply` handed over
      id: handed
      if: inputs.stage != ''
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        STAGE: ${{ inputs.stage }}
      run: .github/ci-warm.sh handed "$STAGE"
    - uses: ./.github/actions/c-cache
      if: ${{ (steps.handed.outputs.found != 'true') && env.PLY_CI_COLD != 'true' }}
      with:
        toolchain: ${{ inputs.toolchain }}
