# The built suite, on a runner that built nothing: the C compiler the
# development profile calls, nextest, and the archive `build` made, unpacked
# where it was built so a path compiled into a test binary is still the path
# it names. The archive is removed once unpacked -- a runner's disk is small,
# and the unpacked tree is most of it. The `run` steps of the jobs that use
# this pass `target/nextest/*.json` to nextest rather than the archive, which
# is also what lets one job run nextest twice without unpacking twice.
name: The built suite
description: tcc, nextest, and the archive the build job made, unpacked in place
runs:
  using: composite
  steps:
    - name: tcc, the development profile's C compiler
      shell: bash
      run: sudo apt-get update -qq && sudo apt-get install -y -qq tcc
    - uses: taiki-e/install-action@0758d235715de2f3551eacc980d9ae8fce9342c3 # v2.87.3
      with:
        tool: cargo-nextest@0.9.143
    - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
      with:
        name: nextest-archive
    - name: Unpack the archive where it was built
      shell: bash
      run: |
        set -euo pipefail
        echo "before: $(df -h / | awk 'NR == 2 { print $4 " free" }'), $(free -m | awk 'NR == 2 { print $7 " MB available" }')"
        tar --zstd -xf nextest.tar.zst
        rm nextest.tar.zst
        test -f target/nextest/binaries-metadata.json
        echo "after:  $(df -h / | awk 'NR == 2 { print $4 " free" }'), target is $(du -sh target | cut -f1)"
