name: The built suite
description: tcc, nextest, the build job's archive unpacked in place, and the run's emitted stage
runs:
  using: composite
  steps:
    - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: tcc
        key: tcc-${{ runner.os }}-${{ runner.arch }}
    - name: tcc, the development profile's C compiler
      shell: bash
      run: .github/ci-tcc.sh install
    - uses: taiki-e/install-action@0758d235715de2f3551eacc980d9ae8fce9342c3 # v2.87.3
      with:
        tool: cargo-nextest@0.9.143
    - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: nextest.tar.zst
        key: nextest-archive-${{ github.run_id }}
        fail-on-cache-miss: true
    # Unpacked where it was built, so paths compiled into test binaries still resolve. Removed
    # after, since the runner's disk is small.
    - name: Unpack the archive where it was built
      shell: bash
      run: |
        set -euo pipefail
        zstd -d --long=30 -c nextest.tar.zst | tar -xf -
        rm nextest.tar.zst
        test -f target/nextest/binaries-metadata.json
    # What this run emitted: the emitted bodies under `ply-c-cache` and the native stage they were
    # built from under `ply-c-stage`. Both are content-addressed, so one copy serves every slice,
    # and both are restored here rather than rebuilt by the warm-up below. `build-ply`'s self-test
    # emits the emitter's own unit and saves it under the emitter key; `stage` adds the corpus
    # program's unit to it and saves the run's. A job that restores the run key has everything.
    - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: |
          /tmp/ply-c-cache
          /tmp/ply-c-stage
        key: ply-c-stage-run-${{ github.run_id }}
        # `stage` itself runs before the run's key exists, so it wants what `build-ply` emitted.
        # Anything earlier wants the stage of a tree whose sources hash the same, and settles for
        # what any run left as a last resort — a mismatched stage gives up the buckets of emitted
        # C that did not move, which is most of them.
        restore-keys: |
          ply-c-stage-emitter-${{ github.run_id }}
          ply-c-stage-sources-${{ hashFiles('crates/*/src/**', 'crates/*/Cargo.toml', 'Cargo.lock', 'crates/*/ply/**') }}
          ply-c-stage-
    # The `stage` job has already emitted this, so these two find it and return; they stay because
    # a test must never be the one that pays for it under a wall-clock limit. `explain` is the
    # cheapest entry into the program: it builds it, lays out the shelf and files the front end,
    # and reaches no tree at all.
    - name: Warm the emitter's stage and the `ply` program
      shell: bash
      run: |
        set -euo pipefail
        ply=$(find target -maxdepth 2 -type f -name ply -perm -u+x | head -1)
        [ -n "$ply" ] || { echo "no ply binary in the archive" >&2; exit 1; }
        "$ply" check examples/hello.ply >/dev/null
        "$ply" explain E0001 >/dev/null
    # The corpus tests run the program `ply build` makes of the corpus package, found where
    # `benches/corpus-program.sh` puts it for these sources and this `ply`. It is built here once a
    # job and run once so its compiled unit is warm, and no test pays for either under a wall-clock
    # limit. `--version` reaches no tree.
    - name: Build the corpus program
      shell: bash
      run: |
        set -euo pipefail
        test -x target/debug/ply || { echo "no target/debug/ply in the archive" >&2; exit 1; }
        program=$(benches/corpus-program.sh target/debug/ply target/corpus-program)
        target/debug/ply run "$program" --host --allow machine --allow claims -- --version >/dev/null
