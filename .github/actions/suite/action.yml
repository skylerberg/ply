name: Set up the built suite
description: tcc, the `ply` build-ply bootstrapped, and the C cache and stages the run's jobs read
inputs:
  stage:
    description: the artifact `build-ply` handed the run's stage over in, or empty where it saved it to the cache
    required: false
    default: ""
runs:
  using: composite
  steps:
    - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      if: runner.environment == 'github-hosted'
      with:
        path: tcc
        key: tcc-${{ runner.os }}-${{ runner.arch }}
    - name: Install tcc
      shell: bash
      run: .github/ci-tcc.sh install
    # Where the suites' grants name it.
    - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
      with:
        name: ply
        path: target/debug
    - name: Make the downloaded `ply` runnable
      shell: bash
      run: |
        set -euo pipefail
        chmod +x target/debug/ply
        target/debug/ply --version
    # What `build-ply` compiled and answered: its objects, kept parts and memo stores under
    # `ply-c-cache`, and the stages under `ply-c-stage`. All are content-addressed, so one copy
    # serves every job. `build-ply` hands them over in the artifact `stage` names, or on main saves
    # them under the tree's own key. A last resort is what any run left: a mismatched stage gives up
    # the parts that did not move, which is most of them.
    - name: Restore the stage this run's `build-ply` handed over
      id: handed
      if: inputs.stage != ''
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        STAGE: ${{ inputs.stage }}
      run: .github/ci-warm.sh handed "$STAGE"
    - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      if: ${{ (steps.handed.outputs.found != 'true') && env.PLY_CI_COLD != 'true' }}
      with:
        path: |
          /tmp/ply-c-cache
          /tmp/ply-c-stage
        key: ply-c-stage-sources-${{ hashFiles('crates/*/src/**', 'crates/*/Cargo.toml', 'Cargo.lock', 'crates/*/ply/**', 'crates/ply-compiler/prelude.ply') }}
        restore-keys: ply-c-stage-
