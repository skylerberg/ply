name: Set up the built suite
description: tcc, the `ply` build-ply bootstrapped, and the C cache and stages the run's jobs read
inputs:
  stage:
    description: the artifact `build-ply` handed the run's stage over in, or empty where it saved it to the cache
    required: false
    default: ""
  toolchain:
    description: the key of the toolchain the run's `ply` is of, as `build-ply` names it
    required: true
runs:
  using: composite
  steps:
    - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: tcc
        key: tcc-${{ runner.os }}-${{ runner.arch }}
    - name: Install tcc
      shell: bash
      run: .github/ci-tcc.sh install
    # Where the suites' grants name it.
    - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
      with:
        name: ply
        path: target/debug
    - name: Make the downloaded `ply` runnable
      shell: bash
      run: |
        set -euo pipefail
        chmod +x target/debug/ply
        target/debug/ply --version
    # What the bootstrap of the run's `ply` compiled and cached: its objects, cached parts and memo
    # stores under `ply-c-cache`, and the stages under `ply-c-stage`. `build-ply` hands them over in
    # the artifact `stage` names, or main saved them under that `ply`'s toolchain key. A last resort
    # is the C cache another toolchain's run left, with std's records and none of its stages
    # (`ci-warm.sh foreign`).
    - name: Restore the stage this run's `build-ply` handed over
      id: handed
      if: inputs.stage != ''
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        STAGE: ${{ inputs.stage }}
      run: .github/ci-warm.sh handed "$STAGE"
    - uses: ./.github/actions/c-cache
      if: ${{ (steps.handed.outputs.found != 'true') && env.PLY_CI_COLD != 'true' }}
      with:
        toolchain: ${{ inputs.toolchain }}
