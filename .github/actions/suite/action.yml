name: Set up the built suite
description: tcc, the `ply` build-ply bootstrapped, and the C cache and stages the run's jobs read
inputs:
  stage:
    description: the artifact `build-ply` handed the run's stage over in, or empty where it saved it to the cache
    required: false
    default: ""
runs:
  using: composite
  steps:
    - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: tcc
        key: tcc-${{ runner.os }}-${{ runner.arch }}
    - name: Install tcc
      shell: bash
      run: .github/ci-tcc.sh install
    # Where the suites' grants name it.
    - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
      with:
        name: ply
        path: target/debug
    - name: Make the downloaded `ply` runnable
      shell: bash
      run: |
        set -euo pipefail
        chmod +x target/debug/ply
        target/debug/ply --version
    # What a bootstrap of this toolchain compiled and answered: its objects, kept parts and memo
    # stores under `ply-c-cache`, and the stages under `ply-c-stage`. `build-ply` hands them over in
    # the artifact `stage` names, or main saved them under the toolchain's key. A last resort is the
    # C cache another toolchain's run left, without its stages (`ci-warm.sh foreign`).
    - name: Restore the stage this run's `build-ply` handed over
      id: handed
      if: inputs.stage != ''
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        STAGE: ${{ inputs.stage }}
      run: .github/ci-warm.sh handed "$STAGE"
    - uses: ./.github/actions/toolchain-key
      id: toolchain
      if: ${{ (steps.handed.outputs.found != 'true') && env.PLY_CI_COLD != 'true' }}
    - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      id: cached
      if: ${{ (steps.handed.outputs.found != 'true') && env.PLY_CI_COLD != 'true' }}
      with:
        path: |
          /tmp/ply-c-cache
          /tmp/ply-c-stage
        key: ply-c-stage-sources-${{ steps.toolchain.outputs.key }}
        restore-keys: ply-c-stage-sources-
    - name: Keep only the C cache of another toolchain's entry
      if: steps.cached.outputs.cache-matched-key != '' && steps.cached.outputs.cache-hit != 'true'
      shell: bash
      run: .github/ci-warm.sh foreign
