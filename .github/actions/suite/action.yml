name: Set up the built suite
description: Installs tcc, the `ply` that `build-ply` bootstrapped, and the parts of the run's stage that the job reads
inputs:
  stage:
    description: the artifact in which `build-ply` uploaded the run's stage, or empty when it saved the stage to the cache instead
    required: false
    default: ""
  toolchain:
    description: the key of the toolchain the run's `ply` is of, as `build-ply` names it
    required: true
  parts:
    description: what to lay from the stage, `cache` for a suite or `cache stage` for a bootstrap, which also reads the bootstrap's stores
    required: false
    default: cache
runs:
  using: composite
  steps:
    - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: tcc
        key: tcc-${{ runner.os }}-${{ runner.arch }}
    - name: Install tcc
      shell: bash
      run: .github/ci-tcc.sh install
    - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
      with:
        name: ply
        path: target/debug
    - name: Make the downloaded `ply` runnable
      shell: bash
      run: |
        set -euo pipefail
        chmod +x target/debug/ply
        target/debug/ply --version
    - name: Download the stage that this run's `build-ply` uploaded
      id: this_run
      if: inputs.stage != ''
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        STAGE: ${{ inputs.stage }}
        PARTS: ${{ inputs.parts }}
      run: .github/ci-warm.sh this-run "$STAGE" $PARTS
    - uses: ./.github/actions/c-cache
      if: ${{ (steps.this_run.outputs.found != 'true') && env.PLY_CI_COLD != 'true' }}
      with:
        toolchain: ${{ inputs.toolchain }}
