name: Unpack the Rust test archive
description: nextest, and the build job's archive of the workspace's tests unpacked where it was built
runs:
  using: composite
  steps:
    - uses: taiki-e/install-action@0758d235715de2f3551eacc980d9ae8fce9342c3 # v2.87.3
      with:
        tool: cargo-nextest@0.9.143
    - uses: ./.github/actions/rust-key
      id: rust
    - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      id: archive
      with:
        path: nextest.tar.zst
        key: nextest-archive-${{ steps.rust.outputs.key }}
    - name: Download the archive a run uploaded, where the cache gave it up
      if: steps.archive.outputs.cache-hit != 'true'
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        NAME: nextest-archive-${{ steps.rust.outputs.key }}
      run: |
        set -euo pipefail
        run=$(.github/artifact-run.sh "$NAME")
        [ -n "$run" ] || { echo "the cache gave up $NAME and no run uploaded it: re-run the whole run, whose build job builds it" >&2; exit 1; }
        gh run download "$run" -n "$NAME"
        echo "$NAME came back from run $run"
    - name: Unpack the archive where it was built
      shell: bash
      run: |
        set -euo pipefail
        zstd -d --long=30 -c nextest.tar.zst | tar -xf -
        rm nextest.tar.zst
        test -f target/nextest/binaries-metadata.json
