name: Compute the toolchain key
description: >-
  A digest of everything `ply bootstrap` reads of a checkout, and nothing it does not: the Rust the
  runtime's library is built from (the Rust key), `ply.work`, and the Ply the binary is built from,
  which is the shipped modules' trees and the CLI's with each package its manifest names. The `ply` a run
  bootstrapped and the C it compiled doing so are kept under it, so a change that moves none of these
  bootstraps nothing. `ci-shards.sh verify` holds the trees named here to the ones the bootstrap
  reads.
outputs:
  key:
    description: the digest, as hex
    value: ${{ steps.key.outputs.key }}
runs:
  using: composite
  steps:
    - uses: ./.github/actions/rust-key
      id: rust
    - id: key
      shell: bash
      env:
        RUST: ${{ steps.rust.outputs.key }}
        PLY: ${{ hashFiles('ply.work', 'crates/ply-std/ply/**', 'crates/ply-compiler/ply/**', 'crates/ply-cli/ply/**', 'crates/ply-prove/ply/**', 'crates/ply-sim/ply/**', 'crates/ply-store/ply/**', 'crates/ply-test/ply/**') }}
      run: |
        set -euo pipefail
        key=$(printf '%s\n' "$RUST" "$PLY" | shasum -a 256 | cut -c1-40)
        echo "key=$key" >> "$GITHUB_OUTPUT"
        echo "the toolchain key is $key"
