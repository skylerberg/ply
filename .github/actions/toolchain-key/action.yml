name: Compute the toolchain key
description: >-
  A digest of everything `ply bootstrap` reads of a checkout, and nothing it does not: the Rust the
  runtime's library is built from (the Rust key), `ply.work`, and the Ply the binary is built from,
  which is the trees `ply.work` places the shipped modules and the CLI in, with each package their
  manifests name (`ci-shards.sh toolchain-inputs`). The `ply` a run bootstrapped and the C it
  compiled doing so are kept under it, so a change that moves none of these bootstraps nothing. The
  same digest with of the library only what the rest embeds of it (`toolchain-inputs core`), the
  core, leads the key: every `ply` reads the rest of a checkout's library from its sources, so a pull
  request that moves only the rest is tested by the `ply` main kept of that core. The job reads
  `ply.work` with a `ply` of its own or the last release (`scripts/stage0.sh`).
outputs:
  core:
    description: the core's digest, as hex
    value: ${{ steps.key.outputs.core }}
  key:
    description: the core's digest, then the digest with the whole library, as `<core>-<full>`
    value: ${{ steps.key.outputs.key }}
runs:
  using: composite
  steps:
    - uses: ./.github/actions/rust-key
      id: rust
    - id: key
      shell: bash
      env:
        RUST: ${{ steps.rust.outputs.key }}
      run: |
        set -euo pipefail
        # The index's blob of each tracked file below the inputs: their bytes, and no store a run
        # wrote.
        digest() {
          local inputs ply
          inputs=$(.github/ci-shards.sh toolchain-inputs "$1")
          # shellcheck disable=SC2086 # one path a word
          ply=$(git ls-files -s -- $inputs | shasum -a 256 | cut -c1-64)
          printf '%s\n' "$RUST" "$ply" | shasum -a 256 | cut -c1-40
        }
        core=$(digest core)
        key="$core-$(digest all)"
        echo "core=$core" >> "$GITHUB_OUTPUT"
        echo "key=$key" >> "$GITHUB_OUTPUT"
        echo "the toolchain key is $key"
