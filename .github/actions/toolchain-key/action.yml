name: Compute the toolchain key
description: >-
  Computes a digest of the C compiler that a bootstrap compiles with (`ci-shards.sh c-compiler`) and
  of everything that a bootstrap reads from a checkout, and nothing else: the Rust that the runtime's library is built from (the Rust key), `ply.work`, the bootstrap's package, and the Ply that the
  binary is built from. That Ply is the trees where `ply.work` places the shipped modules and the
  CLI, plus each package that their manifests list (`ci-shards.sh toolchain-inputs`). The `ply` that
  a run bootstrapped, and the C it compiled while doing so, are cached under this digest, so a
  change that touches none of these files bootstraps nothing. The key starts with a second digest,
  the core: the same files, but with only the parts of the standard library that the rest embeds
  (`toolchain-inputs core`). Every `ply` reads the rest of a checkout's standard library from its
  sources, so a pull request that changes only the rest is tested with the `ply` that main cached
  for that core. The job reads `ply.work` with its own `ply` or with the last release
  (`scripts/stage0.sh`).
outputs:
  core:
    description: the core's digest, as hex
    value: ${{ steps.key.outputs.core }}
  key:
    description: the core's digest, then the digest with the whole library, as `<core>-<full>`
    value: ${{ steps.key.outputs.key }}
runs:
  using: composite
  steps:
    - uses: ./.github/actions/rust-key
      id: rust
    - id: key
      shell: bash
      env:
        RUST: ${{ steps.rust.outputs.key }}
      run: |
        set -euo pipefail
        compiler=$(.github/ci-shards.sh c-compiler)
        digest() {
          local inputs ply
          inputs=$(.github/ci-shards.sh toolchain-inputs "$1")
          # shellcheck disable=SC2086
          ply=$(git ls-files -s -- $inputs | shasum -a 256 | cut -c1-64)
          printf '%s\n' "$compiler" "$RUST" "$ply" | shasum -a 256 | cut -c1-40
        }
        core=$(digest core)
        key="$core-$(digest all)"
        echo "core=$core" >> "$GITHUB_OUTPUT"
        echo "key=$key" >> "$GITHUB_OUTPUT"
        echo "the toolchain key is $key"
