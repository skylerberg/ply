name: Bootstrap ply
description: >-
  Builds this tree's `ply`. Cargo builds the runtime's static library from this tree's Rust and
  caches it under the Rust key, and then `driver` runs `ply bootstrap`. When the driver is the last
  `ply` that main published (stage0), the builder is this tree's compiler as stage0 compiles it.
  When the driver is the `ply` that the first bootstrap produced, the binary is what this tree's own
  compiler builds. The C, the builder and the pack are stored in the toolchain's cache, which the
  caller restores and saves.
inputs:
  driver:
    description: the `ply` that runs the bootstrap
    required: false
    default: target/stage0/ply
  out:
    description: where the `ply` goes
    required: false
    default: target/release/ply
outputs:
  replays:
    description: >-
      `true` where the `ply` built bootstraps as `driver` does: the same program on the same runtime,
      so a bootstrap it drove would build that `ply` again
    value: ${{ steps.replays.outputs.yes == 'true' }}
runs:
  using: composite
  steps:
    - name: Download the last ply main published
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        set -euo pipefail
        [ -x target/stage0/ply ] || scripts/stage0.sh target/stage0/ply
    # The cargo package `ply.work` names the runtime, and the library file it builds.
    - name: Name the runtime's library
      id: runtime
      shell: bash
      run: |
        set -euo pipefail
        echo "crate=$(.github/ci-shards.sh work runtime)" >> "$GITHUB_OUTPUT"
        echo "library=target/release/$(.github/ci-shards.sh work library)" >> "$GITHUB_OUTPUT"
    - uses: ./.github/actions/rust-key
      id: rust
    - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      id: cached
      with:
        path: ${{ steps.runtime.outputs.library }}
        key: ply-runtime-${{ runner.os }}-${{ runner.arch }}-${{ steps.rust.outputs.key }}
    # Main cannot read a pull request's cache, so the run on main takes the library the pull
    # request's run uploaded.
    - name: Download the runtime's library a pull request built of this Rust
      id: reuse
      if: steps.cached.outputs.cache-hit != 'true' && github.event_name == 'push'
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        NAME: ply-runtime-${{ runner.os }}-${{ runner.arch }}-${{ steps.rust.outputs.key }}
      run: |
        set -euo pipefail
        run=$(.github/artifact-run.sh "$NAME")
        if [ -z "$run" ]; then echo "no run has built this Rust; building"; exit 0; fi
        gh run download "$run" -n "$NAME" -D target/release
        echo "reused=true" >> "$GITHUB_OUTPUT"
        echo "$NAME came back from run $run"
    - name: Decide whether to build the runtime's library
      id: builds
      if: steps.cached.outputs.cache-hit != 'true' && steps.reuse.outputs.reused != 'true'
      shell: bash
      run: echo "yes=true" >> "$GITHUB_OUTPUT"
    - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # v1
      if: steps.builds.outputs.yes == 'true'
      with:
        toolchain: ${{ env.RUST_TOOLCHAIN }}
    - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      if: steps.builds.outputs.yes == 'true'
      with:
        save-if: ${{ github.ref_name == github.event.repository.default_branch }}
    - name: Build the runtime's library
      if: steps.builds.outputs.yes == 'true'
      shell: bash
      env:
        CRATE: ${{ steps.runtime.outputs.crate }}
      run: cargo build --locked --release -p "$CRATE"
    # Fails the build if the compiled runtime library depends on a file that the Rust cache key does
    # not cover. Otherwise every later run would restore a stale library from the cache.
    - name: Check every input the build read is under the Rust key
      if: steps.builds.outputs.yes == 'true'
      shell: bash
      env:
        LIBRARY: ${{ steps.runtime.outputs.library }}
      run: .github/ci-shards.sh rust-inputs "${LIBRARY%.a}.d"
    - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      if: steps.builds.outputs.yes == 'true' && github.event_name == 'pull_request'
      with:
        name: ply-runtime-${{ runner.os }}-${{ runner.arch }}-${{ steps.rust.outputs.key }}
        path: ${{ steps.runtime.outputs.library }}
        retention-days: 2
        if-no-files-found: error
    - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      if: steps.cached.outputs.cache-hit != 'true'
      with:
        path: ${{ steps.runtime.outputs.library }}
        key: ply-runtime-${{ runner.os }}-${{ runner.arch }}-${{ steps.rust.outputs.key }}
    # The `rust-cache` step restores `target/` over the files the earlier `Rust` setup step already
    # put there. The previously released `ply` (the one `scripts/stage0.sh` downloads to
    # `target/stage0/ply`) must therefore be downloaded after it, and only if `target/stage0/ply` is
    # missing.
    - name: Download the last ply main published, if the Rust cache took it
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        set -euo pipefail
        [ -x target/stage0/ply ] || scripts/stage0.sh target/stage0/ply
    # Bootstraps this checkout's `ply` with the `ply` given as the `driver` input. The bootstrap
    # compiles this checkout's compiler into a program called the builder, then uses the builder to
    # compile the command line program into a bundle of compiled sources called the pack. If the
    # driver itself was built from this checkout, the step reuses the builder and pack that the
    # earlier bootstrap, which the latest release drove, already produced. It builds new ones only
    # if the sources that produce them differ from the release's.
    - name: Bootstrap this tree's ply
      shell: bash
      env:
        DRIVER: ${{ inputs.driver }}
        OUT: ${{ inputs.out }}
        PLY_C_PHASES: 1
      run: |
        set -euo pipefail
        "$DRIVER" bootstrap . --profile release --out "$OUT"
        "$OUT" --version
    # Records in the `yes` output whether the `ply` just built bootstraps the same way as the
    # driver, meaning the `ply` that ran the bootstrap above. The step compares the output of
    # `bootstrap --identity` of both programs. If the driver does not support `--identity`, the step
    # assumes the two differ and sets no output.
    - name: Say whether the ply built bootstraps as its driver does
      id: replays
      shell: bash
      env:
        DRIVER: ${{ inputs.driver }}
        OUT: ${{ inputs.out }}
      run: |
        set -euo pipefail
        built=$("$OUT" bootstrap --identity)
        driver=$("$DRIVER" bootstrap --identity 2> /dev/null) || driver=
        echo "the ply built bootstraps as $built, its driver as ${driver:-it does not say}"
        if [ "$built" = "$driver" ]; then echo "yes=true" >> "$GITHUB_OUTPUT"; fi
