name: Bootstrap ply
description: >-
  This tree's `ply`, built by `ply`: the runtime's static library cargo builds of this tree's Rust,
  then `ply bootstrap` run by the last `ply` main published (stage0) and again by the `ply` that
  made, so the binary is what this tree's own bootstrap builds. Where the checkout holds the `ply`
  an earlier run bootstrapped from what a bootstrap would read now, that one stands.
inputs:
  out:
    description: where the `ply` goes
    required: false
    default: target/release/ply
  kept:
    description: whether a `ply` an earlier run left there may stand
    required: false
    default: "false"
runs:
  using: composite
  steps:
    - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # v1
      if: runner.environment == 'github-hosted'
      with:
        toolchain: ${{ env.RUST_TOOLCHAIN }}
    - name: Build the runtime's library
      shell: bash
      run: cargo build --locked --release -p ply-native
    - name: Name what a bootstrap reads of this tree
      id: toolchain
      shell: bash
      env:
        OUT: ${{ inputs.out }}
        KEPT: ${{ inputs.kept }}
      run: |
        set -euo pipefail
        key=$(.github/ci-tables.sh toolchain-key)
        echo "key=$key" >> "$GITHUB_OUTPUT"
        if [ "$KEPT" = true ] && [ -x "$OUT" ] && [ "$(cat "$OUT.toolchain" 2>/dev/null)" = "$key" ]; then
          echo "stands=true" >> "$GITHUB_OUTPUT"
          echo "the ply here was bootstrapped from this toolchain ($key)"
        fi
    - name: Download the last ply main published
      if: steps.toolchain.outputs.stands != 'true'
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
      run: scripts/stage0.sh target/stage0/ply
    # Stage0's bootstrap builds this tree's builder with stage0's compiler; the `ply` that makes
    # then bootstraps again, so the binary is what this tree's own bootstrap and compiler build.
    # The second takes the builder and the pack the first kept, and makes its own of either only
    # where the definitions of this tree that make it are not the release's.
    - name: Bootstrap this tree's ply
      if: steps.toolchain.outputs.stands != 'true'
      shell: bash
      env:
        OUT: ${{ inputs.out }}
        KEY: ${{ steps.toolchain.outputs.key }}
        PLY_C_PHASES: 1
      run: |
        set -euo pipefail
        rm -f "$OUT.toolchain"
        target/stage0/ply bootstrap . --profile release --out target/release/ply-stage1
        target/release/ply-stage1 bootstrap . --profile release --out "$OUT"
        "$OUT" --version
        echo "$KEY" > "$OUT.toolchain"
