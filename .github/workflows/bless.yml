# Writes the differentials' goldens from the Rust reference, on a runner, for a
# branch: the reference's dump beside every input the harness compares (ADR 0050
# §2). Run it by hand for the ref whose goldens should move --
#
#   gh workflow run bless.yml -f ref=<branch>
#
# -- then download the `goldens` artifact into crates/ply-compiler-diff/fixtures
# and commit it on that branch. The job prints what the goldens weigh, since the
# record says which phases are too large to review as text.
name: bless
on:
  workflow_dispatch:
    inputs:
      ref:
        description: the branch or commit whose harness writes the goldens
        default: main
        type: string
permissions:
  contents: read
env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  RUST_BACKTRACE: "1"
jobs:
  bless:
    name: the goldens, from the reference
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # v1
        with:
          toolchain: "1.93.1"
      - name: tcc, the development profile's C compiler
        run: sudo apt-get update -qq && sudo apt-get install -y -qq tcc
      - name: Bless
        run: |
          set -euo pipefail
          rm -rf crates/ply-compiler-diff/fixtures/goldens
          PLY_DIFF_BLESS=1 cargo test --locked -p ply-compiler-diff --test suite -- --skip emit_diff:: --skip lower_diff::
          echo "=== what the goldens weigh"
          du -sh crates/ply-compiler-diff/fixtures/goldens
          du -sh crates/ply-compiler-diff/fixtures/goldens/* | sort -h
          find crates/ply-compiler-diff/fixtures/goldens -type f | wc -l
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: goldens
          path: crates/ply-compiler-diff/fixtures/goldens
          retention-days: 7
          if-no-files-found: error
