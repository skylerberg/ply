# Bootstraps main's `ply` for macOS and uploads it to the rolling release that `scripts/stage0.sh`
# downloads. A `ply` built on a Linux runner does not run on a Mac, so each commit is bootstrapped
# here. `ci.yml` starts this workflow for each commit of main that passes CI. It is a separate
# workflow so that main's next run does not wait for it.
name: publish-macos
run-name: Publish macOS ply of ${{ inputs.sha }}

on:
  workflow_dispatch:
    inputs:
      sha:
        description: the commit of main to bootstrap and publish
        required: true
        type: string

# One at a time and none dropped: each bootstrap starts from the `ply` the commit before it published.
concurrency:
  group: ${{ github.workflow }}
  queue: max

permissions:
  contents: read

env:
  RUST_TOOLCHAIN: "1.93.1"
  RUST_BACKTRACE: "1"
  # Sets these two paths explicitly so that the second `ply` of the bootstrap reads the C cache and
  # the compiled toolchain output (the stage) that the first `ply` wrote. Without them, each `ply`
  # would use its own default location.
  PLY_C_CACHE: /tmp/ply-c-cache
  PLY_C_STAGE: /tmp/ply-c-stage

jobs:
  publish-macos:
    name: Bootstrap and publish main's ply for macOS
    # The stage0 it starts from is built for macOS 15.
    runs-on: macos-15
    timeout-minutes: 90
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.sha }}
          persist-credentials: false
      - name: Fetch the last ply main published, which reads `ply.work`
        env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/stage0.sh target/stage0/ply
      # Restores the `ply` that an earlier run of this workflow bootstrapped from the same
      # toolchain, which is the `ply` this run would build.
      - uses: ./.github/actions/toolchain-key
        id: toolchain
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: built
        with:
          path: target/release/ply
          key: ply-built-${{ runner.os }}-${{ runner.arch }}-${{ steps.toolchain.outputs.key }}
      - uses: ./.github/actions/bootstrap
        id: first
        if: steps.built.outputs.cache-hit != 'true'
        with:
          out: target/release/ply-stage1
      - uses: ./.github/actions/bootstrap
        if: steps.built.outputs.cache-hit != 'true' && steps.first.outputs.replays != 'true'
        with:
          driver: target/release/ply-stage1
          out: target/release/ply
      - name: Take the first ply, which a second bootstrap would build again
        if: steps.built.outputs.cache-hit != 'true' && steps.first.outputs.replays == 'true'
        run: mv target/release/ply-stage1 target/release/ply
      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: steps.built.outputs.cache-hit != 'true'
        with:
          path: target/release/ply
          key: ply-built-${{ runner.os }}-${{ runner.arch }}-${{ steps.toolchain.outputs.key }}
      # A `Float` gives the same bits on every target: the float programs Linux checked, here too.
      - name: Hold its floats to the digests the language suite pins
        run: |
          set -euo pipefail
          target/release/ply test tests/lang/floats --no-cache
          target/release/ply test tests/lang/floats --no-cache --profile release
      - name: Upload it to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cp target/release/ply /tmp/ply-macos-arm64
          gh release upload main-latest /tmp/ply-macos-arm64 --clobber --repo "$GITHUB_REPOSITORY"
