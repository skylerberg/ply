# Main's `ply` for macOS, to the rolling release `scripts/stage0.sh` downloads: nothing a Linux runner
# builds serves a Mac, so the commit is bootstrapped here. `ci.yml` starts a run for each commit of
# main it finds green; a run of its own, so main's next run does not wait for this one.
name: publish-macos
run-name: Publish macOS ply of ${{ inputs.sha }}

on:
  workflow_dispatch:
    inputs:
      sha:
        description: the commit of main to bootstrap and publish
        required: true
        type: string

# One at a time and none dropped: each bootstrap starts from the `ply` the commit before it published.
concurrency:
  group: ${{ github.workflow }}
  queue: max

permissions:
  contents: read

env:
  RUST_TOOLCHAIN: "1.93.1"
  RUST_BACKTRACE: "1"
  # Named, so the bootstrap's second `ply` reads where its first kept: each has a default of its own.
  PLY_C_CACHE: /tmp/ply-c-cache
  PLY_C_STAGE: /tmp/ply-c-stage

jobs:
  publish-macos:
    name: Bootstrap and publish main's ply for macOS
    # The stage0 it starts from is built for macOS 15.
    runs-on: macos-15
    timeout-minutes: 90
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.sha }}
          persist-credentials: false
      # The `ply` a run bootstrapped here of this toolchain is the one this run would build.
      - uses: ./.github/actions/toolchain-key
        id: toolchain
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: built
        with:
          path: target/release/ply
          key: ply-built-${{ runner.os }}-${{ runner.arch }}-${{ steps.toolchain.outputs.key }}
      - uses: ./.github/actions/bootstrap
        if: steps.built.outputs.cache-hit != 'true'
        with:
          out: target/release/ply
      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: steps.built.outputs.cache-hit != 'true'
        with:
          path: target/release/ply
          key: ply-built-${{ runner.os }}-${{ runner.arch }}-${{ steps.toolchain.outputs.key }}
      # A `Float` answers the same bits on every target: the float programs Linux checked, here too.
      - name: Hold its floats to the digests the language suite pins
        run: |
          set -euo pipefail
          target/release/ply test tests/lang/floats --no-cache
          target/release/ply test tests/lang/floats --no-cache --profile release
      - name: Upload it to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cp target/release/ply /tmp/ply-macos-arm64
          gh release upload main-latest /tmp/ply-macos-arm64 --clobber --repo "$GITHUB_REPOSITORY"
