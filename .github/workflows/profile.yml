name: profile
on:
  workflow_dispatch:
    inputs:
      test:
        description: the test to profile, by its nextest name
        default: unit::sched::many_concurrent_tasks_all_make_progress
        type: string
      package:
        description: the crate holding the test
        default: ply-host-tests
        type: string
      target:
        description: the test binary holding it
        default: suite
        type: string
      ref:
        description: the branch or commit to profile, so a change is read before it lands
        default: main
        type: string
      env:
        description: "variables for the test's environment, as NAME=VALUE separated by spaces (for instance PLY_C_PHASES=1 PLY_HEAP_DELAY=1000); empty for none"
        default: ""
        type: string
permissions:
  contents: read
env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  RUST_BACKTRACE: "1"
jobs:
  perf:
    name: Profile one test with perf
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # v1
        with:
          toolchain: "1.93.1"
      - name: Install tcc and perf
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq tcc linux-tools-common linux-tools-generic "linux-tools-$(uname -r)" \
            || sudo apt-get install -y -qq tcc linux-tools-common linux-tools-generic
      - name: Build the suite holding the test
        env:
          PACKAGE: ${{ inputs.package }}
          TARGET: ${{ inputs.target }}
        run: cargo test --locked -p "$PACKAGE" --test "$TARGET" --no-run
      - name: Profile the test
        env:
          PACKAGE: ${{ inputs.package }}
          TARGET: ${{ inputs.target }}
          T: ${{ inputs.test }}
          TEST_ENV: ${{ inputs.env }}
        run: |
          set -euo pipefail
          BIN=$(cargo test --locked -p "$PACKAGE" --test "$TARGET" --no-run --message-format=json 2>/dev/null \
            | jq -r --arg t "$TARGET" 'select(.executable != null and .target.name == $t) | .executable')
          # shellcheck disable=SC2012
          PERF=$(command -v perf || ls /usr/lib/linux-tools/*/perf | head -1)
          # shellcheck disable=SC2086,SC2163
          if [ -n "$TEST_ENV" ]; then export $TEST_ENV; echo "with $TEST_ENV"; fi
          echo "=== warm"
          /usr/bin/time -v "$BIN" --exact --nocapture "$T" > /tmp/warm.log 2>&1 || true
          grep -E "Elapsed|Maximum resident|test result|^entry: |^  |this tree reads" /tmp/warm.log || true
          if grep -q "panicked\|FAILED\|Aborted\|SIGSEGV" /tmp/warm.log; then echo "=== the run's last lines"; grep -v "^\s*[0-9]*: \|^\s*at " /tmp/warm.log | tail -40; fi
          echo "=== profile"
          sudo --preserve-env "$PERF" record -e cpu-clock -F 499 -o perf.data -- "$BIN" --exact "$T" >/dev/null 2>&1
          sudo "$PERF" report -i perf.data --no-children --sort dso,sym --stdio --percent-limit 0.4 2>/dev/null \
            | grep -v "^#" | grep -v "^$" | head -80 || true
