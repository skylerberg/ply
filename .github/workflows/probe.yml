name: probe
on:
  push:
    branches: [feat/prelude-macros]
permissions:
  contents: read
env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  RUST_BACKTRACE: "1"
jobs:
  perf:
    name: perf over the differentials
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@stable
      - name: tcc and perf
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq tcc linux-tools-common linux-tools-generic "linux-tools-$(uname -r)" || sudo apt-get install -y -qq tcc linux-tools-common linux-tools-generic
          perf --version || ls /usr/lib/linux-tools/*/perf
      - name: Build the differential suite
        run: cargo test --locked -p ply-compiler-diff --test suite --no-run
      - name: The hash differential under three C compilers
        run: |
          set -euo pipefail
          BIN=$(cargo test --locked -p ply-compiler-diff --test suite --no-run --message-format=json 2>/dev/null | jq -r 'select(.executable != null and .target.name == "suite") | .executable')
          T="hash::the_ply_hasher_agrees_with_ply_hash_on_every_example_with_the_standard_library_part_1_of_2"
          for V in "tcc"; do
            set -- $V
            export PLY_CC="$1"; export PLY_CC_OPT="${2:-}"
            [ -z "$PLY_CC_OPT" ] && unset PLY_CC_OPT
            for pass in first second; do
              echo "=== $V $pass"
              /usr/bin/time -v "$BIN" --exact "$T" 2>&1 | grep -E "Elapsed|Maximum resident|test result" || true
            done
          done
