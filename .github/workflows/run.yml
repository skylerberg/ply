# One command on a runner, with this tree's `ply` and `tcc`: for what a test
# reports only as an abort, or a reading a test does not print. Dispatch it --
#
#   gh workflow run run.yml --ref <branch> -f ref=<branch> \
#     -f command='PLY_TIER_ONLY=1 $PLY test crates/ply-compiler/ply --no-cache --backend c'
#
# -- and read the job log. Only the command's last four hundred lines reach it, so a command
# whose answer is a file prints the part it wants between markers of its own rather than the
# whole file, which the tail silently eats. `$PLY` is the release binary: a pull request's run
# uploaded it by tree, else it is built here.
name: run
on:
  workflow_dispatch:
    inputs:
      ref:
        description: the branch or commit whose tree the command runs in
        default: main
        type: string
      command:
        description: the shell command, with $PLY the release binary and $ENV any variables set inline
        required: true
        type: string
permissions:
  contents: read
  actions: read
env:
  CARGO_TERM_COLOR: always
jobs:
  run:
    name: the command, with this tree's ply
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      - name: The binary a run built for this tree
        id: reuse
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tree=$(git rev-parse 'HEAD^{tree}')
          name="ply-$tree"
          run=$(gh api "repos/$GITHUB_REPOSITORY/actions/artifacts?name=$name&per_page=10" \
            -q '[.artifacts[] | select(.expired == false)] | sort_by(.created_at) | last | .workflow_run.id // empty')
          if [ -z "$run" ]; then echo "no run has built this tree; building"; exit 0; fi
          mkdir -p target/release
          gh run download "$run" -n "$name" -D target/release
          chmod +x target/release/ply
          echo "reused=true" >> "$GITHUB_OUTPUT"
          echo "the binary run $run built for tree $tree"
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # v1
        if: steps.reuse.outputs.reused != 'true'
        with:
          toolchain: "1.93.1"
      - uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
        if: steps.reuse.outputs.reused != 'true'
      # The wrapper belongs to this step alone: the sccache action above is skipped when the
      # binary came back by tree, and a `RUSTC_WRAPPER` naming a program nobody installed makes
      # every command that compiles fail with a missing file.
      - name: cargo build --release -p ply-cli --bin ply
        if: steps.reuse.outputs.reused != 'true'
        env:
          SCCACHE_GHA_ENABLED: "true"
          RUSTC_WRAPPER: sccache
        run: cargo build --locked --release -p ply-cli --bin ply
      - name: tcc
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq tcc
      - name: The command
        env:
          PLY: ${{ github.workspace }}/target/release/ply
        run: |
          set -o pipefail
          echo "=== ${{ inputs.command }}"
          bash -c '${{ inputs.command }}' 2>&1 | tail -400
