# One shell command on a runner, with tcc and this tree's release `ply` as `$PLY`:
#
#   gh workflow run run.yml --ref <branch> -f ref=<branch> -f command='$PLY test <dir> --backend c'
#
# The job log keeps only the command's last 400 lines.
name: run
on:
  workflow_dispatch:
    inputs:
      ref:
        description: the branch or commit whose tree the command runs in
        default: main
        type: string
      command:
        description: the shell command, with $PLY the release binary and $ENV any variables set inline
        required: true
        type: string
permissions:
  contents: read
env:
  RUST_TOOLCHAIN: "1.93.1"
  CARGO_TERM_COLOR: always
  # Where the jobs' cache steps keep the C cache and the stages: a runner's home is not theirs to
  # save from.
  PLY_C_CACHE: /tmp/ply-c-cache
  PLY_C_STAGE: /tmp/ply-c-stage
jobs:
  run:
    name: Run the command with this tree's ply
    # In the checkout `ci.yml`'s runs keep, so the bootstrap compiles only what moved since.
    runs-on: liquid
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
          clean: false
      - name: Clean the checkout of all but cargo's target and the packages' stores
        run: git clean -ffdxq -e target -e .ply-cache
      - uses: ./.github/actions/bootstrap
        with:
          out: target/release/ply
      # Through the environment, not spliced into the script: a quote in the command would end the
      # script's own and run the rest of it outside `bash -c`.
      - name: Run the command
        env:
          PLY: ${{ github.workspace }}/target/release/ply
          COMMAND: ${{ inputs.command }}
        run: |
          set -o pipefail
          printf '=== %s\n' "$COMMAND"
          bash -c "$COMMAND" 2>&1 | tail -400
