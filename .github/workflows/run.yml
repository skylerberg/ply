# One shell command on a runner, with tcc and this tree's release `ply` as `$PLY`:
#
#   gh workflow run run.yml --ref <branch> -f ref=<branch> -f command='$PLY test <dir> --backend c'
#
# The job log keeps only the command's last 400 lines.
name: run
on:
  workflow_dispatch:
    inputs:
      ref:
        description: the branch or commit whose tree the command runs in
        default: main
        type: string
      command:
        description: the shell command, with $PLY the release binary and $ENV any variables set inline
        required: true
        type: string
permissions:
  contents: read
  actions: read
env:
  # The Rust key folds it in; it is `ci.yml`'s, so a runtime CI cached is the one this builds.
  RUST_TOOLCHAIN: "1.93.1"
  CARGO_PROFILE_DEV_DEBUG: line-tables-only
  NEXTEST_VERSION: "0.9.143"
  CARGO_TERM_COLOR: always
  # Where the jobs' cache steps keep the C cache and the stages: a runner's home is not theirs to
  # save from.
  PLY_C_CACHE: /tmp/ply-c-cache
  PLY_C_STAGE: /tmp/ply-c-stage
jobs:
  run:
    name: Run the command with this tree's ply
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      - name: Fetch the last ply main published, which reads `ply.work`
        env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/stage0.sh target/stage0/ply
      - uses: ./.github/actions/toolchain-key
        id: toolchain
      # What `ci.yml` compiled and answered of this toolchain, or of the nearest, so the bootstrap
      # compiles only the parts that moved.
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            /tmp/ply-c-cache
            /tmp/ply-c-stage
          key: ply-c-stage-sources-${{ steps.toolchain.outputs.key }}
          restore-keys: ply-c-stage-
      - uses: ./.github/actions/bootstrap
        with:
          out: target/release/ply-stage1
      - uses: ./.github/actions/bootstrap
        with:
          driver: target/release/ply-stage1
          out: target/release/ply
      - name: Install tcc
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq tcc
      # Through the environment, not spliced into the script: a quote in the command would end the
      # script's own and run the rest of it outside `bash -c`.
      - name: Run the command
        env:
          PLY: ${{ github.workspace }}/target/release/ply
          COMMAND: ${{ inputs.command }}
        run: |
          set -o pipefail
          printf '=== %s\n' "$COMMAND"
          bash -c "$COMMAND" 2>&1 | tail -400
