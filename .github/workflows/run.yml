# One shell command on a runner, with tcc and this tree's release `ply` as `$PLY`:
#
#   gh workflow run run.yml --ref <branch> -f ref=<branch> -f command='$PLY test <dir> --backend c'
#
# The job log keeps only the command's last 400 lines.
name: run
on:
  workflow_dispatch:
    inputs:
      ref:
        description: the branch or commit whose tree the command runs in
        default: main
        type: string
      command:
        description: the shell command, with $PLY the release binary and $ENV any variables set inline
        required: true
        type: string
permissions:
  contents: read
  actions: read
env:
  # The Rust key folds it in; it is `ci.yml`'s, so a runtime CI cached is the one this builds.
  RUST_TOOLCHAIN: "1.93.1"
  CARGO_PROFILE_DEV_DEBUG: line-tables-only
  NEXTEST_VERSION: "0.9.143"
  CARGO_TERM_COLOR: always
jobs:
  run:
    name: the command, with this tree's ply
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      - uses: ./.github/actions/rust-key
        id: rust
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: cached
        with:
          path: |
            target/release/ply
            target/release/ply-pack
          key: ply-runtime-${{ steps.rust.outputs.key }}
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # v1
        if: steps.cached.outputs.cache-hit != 'true'
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
        if: steps.cached.outputs.cache-hit != 'true'
      # Step-scoped: sccache is not installed when the runtime was cached.
      - name: cargo build --release -p ply-launcher --bins
        if: steps.cached.outputs.cache-hit != 'true'
        env:
          SCCACHE_GHA_ENABLED: "true"
          RUSTC_WRAPPER: sccache
        run: cargo build --locked --release -p ply-launcher --bins
      - name: The pack of this tree's Ply sources and runnables
        run: target/release/ply-pack target/release/ply
      - name: tcc
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq tcc
      # Through the environment, not spliced into the script: a quote in the command would end the
      # script's own and run the rest of it outside `bash -c`.
      - name: The command
        env:
          PLY: ${{ github.workspace }}/target/release/ply
          COMMAND: ${{ inputs.command }}
        run: |
          set -o pipefail
          printf '=== %s\n' "$COMMAND"
          bash -c "$COMMAND" 2>&1 | tail -400
