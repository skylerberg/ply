# One shell command on a runner, with tcc and this tree's release `ply` as `$PLY`:
#
#   gh workflow run run.yml --ref <branch> -f ref=<branch> -f command='$PLY test <dir> --backend c'
#
# The job log keeps only the command's last 400 lines.
name: run
on:
  workflow_dispatch:
    inputs:
      ref:
        description: the branch or commit whose tree the command runs in
        default: main
        type: string
      command:
        description: the shell command, with $PLY the release binary and $ENV any variables set inline
        required: true
        type: string
permissions:
  contents: read
  actions: read
env:
  # `RUST_TOOLCHAIN`, `CARGO_PROFILE_DEV_DEBUG` and `NEXTEST_VERSION` are part of the Rust key. They
  # match the values in `ci.yml`, so the runtime that CI cached is the runtime this workflow builds.
  RUST_TOOLCHAIN: "1.93.1"
  CARGO_PROFILE_DEV_DEBUG: line-tables-only
  NEXTEST_VERSION: "0.9.143"
  CARGO_TERM_COLOR: always
  # These paths are where the cache steps save the C cache and the compiled toolchain output (the
  # stage). The defaults are in the runner's home directory, which the cache steps cannot save from,
  # so the paths are set explicitly.
  PLY_C_CACHE: /tmp/ply-c-cache
  PLY_C_STAGE: /tmp/ply-c-stage
jobs:
  run:
    name: Run the command with this tree's ply
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      - name: Fetch the last ply main published, which reads `ply.work`
        env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/stage0.sh target/stage0/ply
      - uses: ./.github/actions/toolchain-key
        id: toolchain
      # Restores the C code that `ci.yml` compiled and cached for this toolchain, or for the nearest
      # toolchain that has a cache, so the bootstrap compiles only the parts that changed.
      - uses: ./.github/actions/c-cache
        with:
          toolchain: ${{ steps.toolchain.outputs.key }}
      - uses: ./.github/actions/bootstrap
        with:
          out: target/release/ply-stage1
      - uses: ./.github/actions/bootstrap
        with:
          driver: target/release/ply-stage1
          out: target/release/ply
      - name: Install tcc
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq tcc
      # The command is passed through the environment instead of being written into the script,
      # because a quote in the command would end the script's own quoted string and run the rest of
      # the command outside `bash -c`.
      - name: Run the command
        env:
          PLY: ${{ github.workspace }}/target/release/ply
          COMMAND: ${{ inputs.command }}
        run: |
          set -o pipefail
          printf '=== %s\n' "$COMMAND"
          bash -c "$COMMAND" 2>&1 | tail -400
