# `build` compiles the workspace into one nextest archive; every test job runs a shard of it, cut
# by `.github/ci-shards.sh` from the durations the last run measured. `ci` is the one
# required check.
# The toolchain pin recurs in every workflow under .github/: raise it everywhere at once.

name: CI

# Pushes only on main: a branch with a pull request is already run by `pull_request`.
on:
  push:
    branches: [main]
  pull_request:

# A newer push to a pull request supersedes its run; a merge to main never cancels the run before
# it, whose `refresh` job is the one that commits the bundle and goldens back.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  # `gh run download` of another run's artifact.
  actions: read

env:
  CARGO_TERM_COLOR: always
  # No job reuses incremental artifacts, and sccache cannot wrap rustc with it on.
  CARGO_INCREMENTAL: "0"
  RUST_BACKTRACE: "1"

jobs:
  plan:
    name: CI tables are total
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      partitions: ${{ steps.tables.outputs.partitions }}
      solo: ${{ steps.tables.outputs.solo }}
      shards: ${{ steps.cut.outputs.shards }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # What the partitions of the last run measured, this branch's own or main's. A first run, an
      # evicted entry or a fork with no access leaves nothing here, and the partitions are cut by
      # test count instead.
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: /tmp/ply-test-timings
          key: test-timings-${{ github.run_id }}
          restore-keys: test-timings-

      - name: Every crate is built, every named test exists, the shards are total
        run: .github/ci-shards.sh verify

      # One job cuts the shards, and every partition runs the cut it left: two that cut their own
      # from tables a run apart could agree on no test at all.
      - name: The shards those durations cut
        id: cut
        run: |
          set -euo pipefail
          rc=0
          .github/ci-shards.sh shard-configs /tmp/ply-shards || rc=$?
          case "$rc" in
            0) echo "shards=true" >> "$GITHUB_OUTPUT" ;;
            3) echo "shards=false" >> "$GITHUB_OUTPUT" ;;
            *) exit "$rc" ;;
          esac
      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: steps.cut.outputs.shards == 'true'
        with:
          path: /tmp/ply-shards
          key: test-shards-${{ github.run_id }}
      # A save that cannot reserve its key only warns; fail here rather than in every partition.
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: steps.cut.outputs.shards == 'true'
        with:
          path: /tmp/ply-shards
          key: test-shards-${{ github.run_id }}
          lookup-only: true
          fail-on-cache-miss: true

      - name: Emit the matrices
        id: tables
        run: |
          echo "partitions=$(.github/ci-shards.sh partitions)" >> "$GITHUB_OUTPUT"
          echo "solo=$(.github/ci-shards.sh solo-matrix)" >> "$GITHUB_OUTPUT"

  fmt:
    name: cargo fmt --all --check
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # v1
        with:
          toolchain: "1.93.1"
          components: rustfmt
      - name: cargo fmt --all --check
        run: cargo fmt --all --check

  clippy:
    name: cargo clippy --workspace --all-targets
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # v1
        with:
          toolchain: "1.93.1"
          components: clippy
      # rust-cache keys only on Cargo.lock; hashing the manifests moves the key when a profile or
      # feature does.
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: clippy-${{ hashFiles('Cargo.toml', 'crates/*/Cargo.toml') }}
          save-if: ${{ github.ref_name == github.event.repository.default_branch }}
      - run: cargo clippy --locked --workspace --all-targets -- -D warnings

  build:
    name: cargo nextest archive
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      SCCACHE_GHA_ENABLED: "true"
      RUSTC_WRAPPER: sccache
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: The tree this run builds
        id: tree
        run: echo "tree=$(git rev-parse 'HEAD^{tree}')" >> "$GITHUB_OUTPUT"
      # main cannot read a pull request's cache, so a pull request's build comes back as an artifact.
      - name: The archive a pull request's run built for this tree
        id: reuse
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          found=$(.github/artifact-for-this-tree.sh nextest-archive "${{ steps.tree.outputs.tree }}")
          if [ -z "$found" ]; then echo "no run has built this tree; building"; exit 0; fi
          run=${found%% *}; name=${found##* }
          gh run download "$run" -n "$name"
          test -f nextest.tar.zst
          echo "reused=true" >> "$GITHUB_OUTPUT"
          echo "$name came back from run $run"
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # v1
        if: steps.reuse.outputs.reused != 'true'
        with:
          toolchain: "1.93.1"
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        if: steps.reuse.outputs.reused != 'true'
        with:
          key: build-${{ hashFiles('Cargo.toml', 'crates/*/Cargo.toml') }}
          save-if: ${{ github.ref_name == github.event.repository.default_branch }}
      - uses: taiki-e/install-action@0758d235715de2f3551eacc980d9ae8fce9342c3 # v2.87.3
        if: steps.reuse.outputs.reused != 'true'
        with:
          tool: cargo-nextest@0.9.143
      - uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
        if: steps.reuse.outputs.reused != 'true'

      - name: cargo test --workspace --no-run
        if: steps.reuse.outputs.reused != 'true'
        run: cargo test --locked --workspace --no-run
      # nextest does not run doctests.
      - name: cargo test --doc
        if: steps.reuse.outputs.reused != 'true'
        run: cargo test --locked --doc --workspace

      # Only ply-corpus reads DWARF, for allocation attribution; the rest is stripped to shrink the archive.
      - name: Strip the debug info no test reads
        if: steps.reuse.outputs.reused != 'true'
        run: |
          set -euo pipefail
          cargo nextest list --locked --workspace --list-type binaries-only --message-format json > /tmp/binaries.json
          python3 - <<'PY'
          import json, os, subprocess
          d = json.load(open("/tmp/binaries.json"))
          target = d["rust-build-meta"]["target-directory"]
          strip = []
          for b in d["rust-binaries"].values():
              if "ply-corpus" not in b["package-id"]:
                  strip.append(b["binary-path"])
          for package, bins in d["rust-build-meta"]["non-test-binaries"].items():
              for b in bins:
                  path = b["path"] if os.path.isabs(b["path"]) else os.path.join(target, b["path"])
                  if b["name"] not in ("w6-alloc", "ply-corpus"):
                      strip.append(path)
          subprocess.run(["strip", "--strip-debug", *strip], check=True)
          PY

      - name: cargo nextest archive --workspace
        if: steps.reuse.outputs.reused != 'true'
        run: cargo nextest archive --locked --workspace --archive-file nextest.tar.zst

      # The window is part of the format: every job that unpacks this must pass `--long=30` too.
      - name: Recompress the archive with a whole-tree window
        if: steps.reuse.outputs.reused != 'true'
        run: |
          set -euo pipefail
          zstd -d -c nextest.tar.zst | zstd -q -T0 -3 --long=30 -o nextest.long.tar.zst
          mv nextest.long.tar.zst nextest.tar.zst

      # Jobs restore the archive from the cache, which is faster than an artifact download; the
      # artifact is for a later push to main to reuse.
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: github.event_name == 'pull_request'
        with:
          name: nextest-archive-${{ steps.tree.outputs.tree }}
          path: nextest.tar.zst
          retention-days: 2
          if-no-files-found: error
      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: nextest.tar.zst
          key: nextest-archive-${{ github.run_id }}
      # A save that cannot reserve its key only warns; fail here rather than in every job below.
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: nextest.tar.zst
          key: nextest-archive-${{ github.run_id }}
          lookup-only: true
          fail-on-cache-miss: true

  build-ply:
    name: cargo build --release -p ply-cli
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      SCCACHE_GHA_ENABLED: "true"
      RUSTC_WRAPPER: sccache
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: The tree this run builds
        id: tree
        run: echo "tree=$(git rev-parse 'HEAD^{tree}')" >> "$GITHUB_OUTPUT"
      - name: The binary a pull request's run built for this tree
        id: reuse
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          found=$(.github/artifact-for-this-tree.sh ply "${{ steps.tree.outputs.tree }}")
          if [ -z "$found" ]; then echo "no run has built this tree; building"; exit 0; fi
          run=${found%% *}; name=${found##* }
          gh run download "$run" -n "$name" -D target/release
          chmod +x target/release/ply
          touch target/release/ply target/release/ply.d
          echo "reused=true" >> "$GITHUB_OUTPUT"
          echo "$name came back from run $run"
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # v1
        if: steps.reuse.outputs.reused != 'true'
        with:
          toolchain: "1.93.1"
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        if: steps.reuse.outputs.reused != 'true'
        with:
          key: ply-${{ hashFiles('Cargo.toml', 'crates/*/Cargo.toml') }}
          save-if: ${{ github.ref_name == github.event.repository.default_branch }}
      - uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
        if: steps.reuse.outputs.reused != 'true'
      - name: cargo build --locked --release -p ply-launcher --bin ply
        if: steps.reuse.outputs.reused != 'true'
        run: cargo build --locked --release -p ply-launcher --bin ply

      # A cache rather than an artifact: every suite job wants these two files, and the artifact
      # service is the one part of a run that fails on its own.
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: tcc
        with:
          path: tcc
          key: tcc-${{ runner.os }}-${{ runner.arch }}
      - name: tcc's packages, for the jobs that run the archive
        if: steps.tcc.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq --download-only tcc
          mkdir -p tcc
          cp /var/cache/apt/archives/*.deb tcc/
          ls tcc
      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: steps.tcc.outputs.cache-hit != 'true'
        with:
          path: tcc
          key: tcc-${{ runner.os }}-${{ runner.arch }}

      # Here rather than in a later job: it compares mtimes, and a later checkout is newer than the binary.
      - name: The freshness check can still go red
        run: .github/binary-is-current.sh --self-test
      - name: The binary is built from this tree
        run: .github/binary-is-current.sh target/release/ply

      # examples/same-tests.sh refuses a binary with no dep-info beside it.
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ply
          path: |
            target/release/ply
            target/release/ply.d
          retention-days: 1
          if-no-files-found: error
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: github.event_name == 'pull_request'
        with:
          name: ply-${{ steps.tree.outputs.tree }}
          path: |
            target/release/ply
            target/release/ply.d
          retention-days: 2
          if-no-files-found: error

  # Emitting the compiler's own unit is the same work whichever slice runs next, and it is minutes
  # of it. One job does it and every suite job restores what it left. It runs the archive's own
  # binary because a compiled body is keyed by the binary that emitted it, so a stage emitted by
  # any other copy of `ply` would be restored and never read.
  stage:
    name: the emitter's stage
    needs: [build, build-ply]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/suite
      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: /tmp/ply-c-cache
          key: ply-c-stage-run-${{ github.run_id }}
      # Across runs as well as within one, so a run whose sources are unchanged emits nothing.
      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: github.ref == 'refs/heads/main'
        with:
          path: /tmp/ply-c-cache
          key: ply-c-stage-${{ hashFiles('crates/*/src/**', 'crates/*/Cargo.toml', 'Cargo.lock', 'crates/ply-compiler/ply/**', 'crates/ply-std/ply/**', 'crates/ply-cli/ply/**') }}

  test:
    name: test ${{ matrix.shard }}/${{ matrix.of }}
    needs: [plan, build, build-ply, stage]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.partitions) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: needs.plan.outputs.shards == 'true'
        with:
          path: /tmp/ply-shards
          key: test-shards-${{ github.run_id }}
          fail-on-cache-miss: true
      - uses: ./.github/actions/suite

      # A shard's profile names the tests it runs, except the catch-all's, which is the negation of
      # every other shard: a test the durations do not name runs there, and only there.
      # The awk strips colour first: nextest colours its summary line. A golden that moved is
      # blessed rather than failed: the diff goes to the job summary, and `refresh` commits it on main.
      - name: cargo nextest run
        id: run
        env:
          SHARD: ${{ matrix.shard }}
          OF: ${{ matrix.of }}
          SHARDS: ${{ needs.plan.outputs.shards }}
          PLY_DIFF_BLESS: "1"
        run: |
          set -euo pipefail
          exclude=$(.github/ci-shards.sh exclude-filter)
          [ -n "$exclude" ] || { echo "the exclude filter is empty" >&2; exit 1; }
          config=/tmp/ply-shards/shard-$SHARD.toml
          if [ "$SHARDS" = true ]; then
            [ -f "$config" ] || { echo "the plan cut the shards and $config did not come back" >&2; exit 1; }
            profile=shard$SHARD
            cut=(--profile "$profile" --tool-config-file "shards:$config")
          else
            profile=default
            cut=(--partition "slice:$SHARD/$OF")
          fi
          cargo-nextest nextest run \
            --binaries-metadata target/nextest/binaries-metadata.json \
            --cargo-metadata target/nextest/cargo-metadata.json \
            --workspace-remap "$GITHUB_WORKSPACE" --target-dir-remap "$GITHUB_WORKSPACE/target" \
            --no-fail-fast "${cut[@]}" \
            -E "not ($exclude)" 2>&1 | tee /tmp/partition.log
          ran=$(awk '
            { gsub(/\033\[[0-9;]*m/, "") }
            /^ *Summary \[/ { for (i = 1; i <= NF; i++) if ($i == "tests" || $i == "test") { n = $(i - 1) } }
            END { print n + 0 }
          ' /tmp/partition.log)
          echo "shard $SHARD ran $ran tests"
          [ "$ran" -gt 0 ] || { echo "the shard ran no tests at all" >&2; exit 1; }
          echo "profile=$profile" >> "$GITHUB_OUTPUT"
          echo "ran=$ran" >> "$GITHUB_OUTPUT"

      # What the next run cuts its shards from.
      - name: The durations this shard measured
        env:
          SHARD: ${{ matrix.shard }}
          PROFILE: ${{ steps.run.outputs.profile }}
          RAN: ${{ steps.run.outputs.ran }}
        run: |
          set -euo pipefail
          .github/ci-shards.sh durations "target/nextest/$PROFILE/junit.xml" > "/tmp/timings-$SHARD.tsv"
          lines=$(grep -c . "/tmp/timings-$SHARD.tsv" || true)
          [ "$lines" -eq "$RAN" ] || {
            echo "the report has $lines durations and the shard ran $RAN tests" >&2
            exit 1
          }
          echo "$lines durations"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: timings-${{ matrix.shard }}
          path: /tmp/timings-${{ matrix.shard }}.tsv
          retention-days: 1
          if-no-files-found: error

      - name: Goldens that moved
        if: always()
        run: |
          set -euo pipefail
          git add -N crates/ply-codegen-tests/fixtures/goldens
          git diff --quiet -- crates/ply-codegen-tests/fixtures/goldens && exit 0
          {
            echo "### Goldens this partition re-blessed"
            echo '```'
            git diff --stat -- crates/ply-codegen-tests/fixtures/goldens
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          git diff --stat -- crates/ply-codegen-tests/fixtures/goldens

  # The table the next run cuts its shards from. It needs every partition, so a run that went red
  # leaves the last whole one in place rather than a table missing whatever did not report. A pull
  # request writes one too, into its own cache: a branch cuts by what its own tree measured, and
  # main is never cut by a branch's.
  timings:
    name: what this run's tests cost
    needs: [test]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: timings-*
          merge-multiple: true
          path: /tmp/ply-timings-parts
      - name: One duration per test
        run: |
          set -euo pipefail
          mkdir -p /tmp/ply-test-timings
          find /tmp/ply-timings-parts -name '*.tsv' -exec cat {} + |
            LC_ALL=C sort -t"$(printf '\t')" -k1,1 -k2,2 -k3,3nr |
            awk -F'\t' '!seen[$1 FS $2]++' > /tmp/ply-test-timings/timings.tsv
          lines=$(grep -c . /tmp/ply-test-timings/timings.tsv || true)
          [ "$lines" -gt 0 ] || { echo "no durations came back from the partitions" >&2; exit 1; }
          echo "$lines test durations"
      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: /tmp/ply-test-timings
          key: test-timings-${{ github.run_id }}

  solo:
    name: test ${{ matrix.id }}
    needs: [plan, build, build-ply, stage]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.solo) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/suite

      - name: cargo nextest run
        env:
          ID: ${{ matrix.id }}
        run: |
          set -euo pipefail
          filter=$(.github/ci-shards.sh solo-filter "$ID")
          cargo-nextest nextest run \
            --binaries-metadata target/nextest/binaries-metadata.json \
            --cargo-metadata target/nextest/cargo-metadata.json \
            --workspace-remap "$GITHUB_WORKSPACE" --target-dir-remap "$GITHUB_WORKSPACE/target" \
            -E "$filter" 2>&1 | tee /tmp/solo.log
          ran=$(awk '
            { gsub(/\033\[[0-9;]*m/, "") }
            /^ *Summary \[/ { for (i = 1; i <= NF; i++) if ($i == "tests" || $i == "test") { n = $(i - 1) } }
            END { print n + 0 }
          ' /tmp/solo.log)
          [ "$ran" -eq 1 ] || { echo "solo test '$ID' selected $ran tests rather than one: the table names a test the binary does not have" >&2; exit 1; }


  # On main only: the bundle the sources are a fixpoint of, the `ply fmt` program they build, and
  # the goldens they produce are committed back, so no pull request carries any of them and two of
  # them never conflict on them.
  # A push by the workflow's own token starts no run, so the commit is the tree the run tested
  # plus what that run emitted.
  refresh:
    name: refresh the bundle, the fmt program and the goldens
    if: github.event_name == 'push'
    needs: [plan, build, build-ply, stage]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: true
      - uses: ./.github/actions/suite
      - name: Emit the bundle and the `ply` program, and bless the goldens
        run: |
          set -euo pipefail
          filter=$(.github/ci-shards.sh solo-filter bootstrap)
          PLY_C_BOOTSTRAP_REFRESH=1 cargo-nextest nextest run \
            --binaries-metadata target/nextest/binaries-metadata.json \
            --cargo-metadata target/nextest/cargo-metadata.json \
            --workspace-remap "$GITHUB_WORKSPACE" --target-dir-remap "$GITHUB_WORKSPACE/target" \
            -E "$filter"
          program=$(.github/ci-shards.sh solo-filter cli-program)
          PLY_C_BOOTSTRAP_REFRESH=1 cargo-nextest nextest run \
            --binaries-metadata target/nextest/binaries-metadata.json \
            --cargo-metadata target/nextest/cargo-metadata.json \
            --workspace-remap "$GITHUB_WORKSPACE" --target-dir-remap "$GITHUB_WORKSPACE/target" \
            -E "$program"
          PLY_DIFF_BLESS=1 cargo-nextest nextest run \
            --binaries-metadata target/nextest/binaries-metadata.json \
            --cargo-metadata target/nextest/cargo-metadata.json \
            --workspace-remap "$GITHUB_WORKSPACE" --target-dir-remap "$GITHUB_WORKSPACE/target" \
            --no-fail-fast -E 'binary_id(ply-codegen-tests::goldens)'
      - name: Commit what moved
        run: |
          set -euo pipefail
          git add crates/ply-compiler/bootstrap crates/ply-launcher/bootstrap crates/ply-codegen-tests/fixtures/goldens
          git diff --cached --quiet && { echo "the bundle, the program and the goldens already match main"; exit 0; }
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m 'The goldens, bundle and ply program CI emitted for these sources'
          # Main may have moved under this run; a later merge's run refreshes for both.
          git pull --rebase origin main || { git rebase --abort; echo "main moved; the next run refreshes"; exit 0; }
          git push origin HEAD:main || echo "main moved; the next run refreshes"

  # Tests that must be seen to run: the `#![cfg(unix)]` shutdown suite and the tree checks by name.
  gates:
    name: test gates
    needs: [plan, build, build-ply, stage]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/suite

      - name: cargo nextest run
        run: |
          set -euo pipefail
          filter=$(.github/ci-shards.sh gate-filter)
          cargo-nextest nextest run \
            --binaries-metadata target/nextest/binaries-metadata.json \
            --cargo-metadata target/nextest/cargo-metadata.json \
            --workspace-remap "$GITHUB_WORKSPACE" --target-dir-remap "$GITHUB_WORKSPACE/target" \
            --no-fail-fast -E "$filter" 2>&1 | tee /tmp/gates.log

      - name: Every tree check and the shutdown suite ran
        run: |
          set -euo pipefail
          ran=0
          while read -r package target test; do
            if [ "$target" = lib ]; then id=$package; else id="$package::$target"; fi
            awk -v id="$id" -v test="$test" '
              { gsub(/\033\[[0-9;]*m/, "") }
              $1 == "PASS" && $NF == test && $(NF - 1) == id { found = 1 }
              END { exit !found }
            ' /tmp/gates.log || {
              echo "'$id $test' did not run: the table names a test the binary does not have" >&2
              exit 1
            }
            ran=$((ran + 1))
          done < <(.github/ci-shards.sh tree-checks)
          echo "$ran tree checks ran"
          [ "$ran" -gt 0 ] || { echo "the table is empty" >&2; exit 1; }
          w5=$(awk '
            { gsub(/\033\[[0-9;]*m/, "") }
            $1 == "PASS" && $(NF - 1) == "ply-cli-tests::suite" && $NF ~ /^w5_shutdown::/ { n++ }
            END { print n + 0 }
          ' /tmp/gates.log)
          [ "$w5" -gt 0 ] || {
            echo "the log names no w5_shutdown test — #![cfg(unix)] compiled it away" >&2
            exit 1
          }
          echo "w5_shutdown: $w5 test(s) ran"

  test-postgres:
    name: test ply-host (postgres)
    needs: [build, build-ply, stage]
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:18.6
        env:
          POSTGRES_USER: ply
          POSTGRES_PASSWORD: ply
          POSTGRES_DB: ply
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ply -d ply"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    # Unset, the tests these gate return early and pass.
    env:
      PLY_PG_URL: postgres://ply:ply@127.0.0.1:5432/ply
      PLY_TEST_DB: postgres://ply:ply@127.0.0.1:5432/ply

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/suite

      # The cluster tests start their own server from these, and skip and pass without them.
      - name: Put initdb, postgres and psql on PATH, or fail
        run: |
          set -euo pipefail
          find_bin() {
            for candidate in /usr/lib/postgresql/*/bin; do
              if [ -x "$candidate/initdb" ] && [ -x "$candidate/postgres" ] && [ -x "$candidate/psql" ]; then
                echo "$candidate"
              fi
            done | tail -n 1
          }
          bin=$(find_bin)
          if [ -z "$bin" ]; then
            sudo apt-get update
            sudo apt-get install --yes --no-install-recommends postgresql postgresql-client
            bin=$(find_bin)
          fi
          if [ -z "$bin" ]; then
            echo "no initdb/postgres/psql on this runner: cluster::available() would be false," >&2
            echo "and six ply-host test binaries would pass without ever starting a server" >&2
            exit 1
          fi
          echo "$bin" >> "$GITHUB_PATH"
          "$bin/initdb" --version
          "$bin/postgres" --version
          "$bin/psql" --version

      - name: The servers named by PLY_PG_URL and PLY_TEST_DB answer
        run: |
          set -euo pipefail
          test -n "$PLY_PG_URL"
          test -n "$PLY_TEST_DB"
          psql "$PLY_PG_URL" -c 'SELECT version()'
          psql "$PLY_TEST_DB" -c 'SELECT 1'

      # The skip notice is stderr from a passing test: both `--success-output immediate` and `2>&1`
      # are needed for the check below to see it.
      - name: cargo nextest run
        run: |
          set -euo pipefail
          filter=$(.github/ci-shards.sh postgres-filter)
          cargo-nextest nextest run \
            --binaries-metadata target/nextest/binaries-metadata.json \
            --cargo-metadata target/nextest/cargo-metadata.json \
            --workspace-remap "$GITHUB_WORKSPACE" --target-dir-remap "$GITHUB_WORKSPACE/target" \
            --no-fail-fast --success-output immediate -E "$filter" 2>&1 | tee /tmp/pg.log

      - name: The live and cluster-gated tests ran against a server
        run: |
          set -euo pipefail
          if grep -Eq 'skipp(ed|ing): (PLY_PG_URL is unset|this machine has no)' /tmp/pg.log; then
            echo "a gated test skipped itself: the server or the cluster binaries did not reach the tests" >&2
            exit 1
          fi
          count() {
            awk -v id="$1" -v prefix="$2" '
              { gsub(/\033\[[0-9;]*m/, "") }
              $1 == "PASS" && $(NF - 1) == id && index($NF, prefix) == 1 { n++ }
              END { print n + 0 }
            ' /tmp/pg.log
          }
          live=$(count ply-host-tests::suite unit::db::scope::live::)
          [ "$live" -eq 10 ] || { echo "expected 10 live tests to pass, saw $live" >&2; exit 1; }
          park=$(count ply-host-tests::suite host_park::)
          [ "$park" -eq 2 ] || { echo "expected 2 host_park tests to pass, saw $park" >&2; exit 1; }
          ran=$(awk '
            { gsub(/\033\[[0-9;]*m/, "") }
            /^ *Summary \[/ { for (i = 1; i <= NF; i++) if ($i == "tests" || $i == "test") { n = $(i - 1) } }
            END { print n + 0 }
          ' /tmp/pg.log)
          echo "the postgres packages ran $ran tests, $live live and $park on a cluster"
          [ "$ran" -gt 0 ] || { echo "the postgres packages ran no tests at all" >&2; exit 1; }
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ply
          path: target/release
      - name: examples/same-tests.sh
        run: |
          set -euo pipefail
          chmod +x target/release/ply
          touch target/release/ply target/release/ply.d
          PLY_BIN="$GITHUB_WORKSPACE/target/release/ply" ./examples/same-tests.sh --db "$PLY_TEST_DB" --reset --no-build

  ucontext-probe:
    name: ./probes/ucontext/run.sh
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: ./probes/ucontext/run.sh
        run: ./probes/ucontext/run.sh

  ci:
    name: CI
    if: always()
    needs:
      [
        plan,
        fmt,
        clippy,
        build,
        build-ply,
        stage,
        test,
        solo,
        gates,
        test-postgres,
        ucontext-probe,
      ]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Every job succeeded
        run: |
          set -euo pipefail
          echo '${{ toJSON(needs) }}' > /tmp/needs.json
          cat /tmp/needs.json
          not_ok=$(jq -r 'to_entries[] | select(.value.result != "success") | "\(.key) = \(.value.result)"' /tmp/needs.json)
          if [ -n "$not_ok" ]; then
            echo "$not_ok" >&2
            exit 1
          fi
          echo "fmt, clippy and the whole test suite are green."
