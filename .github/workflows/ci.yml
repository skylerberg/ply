# `build` compiles the workspace into one nextest archive; each `nextest` job runs a shard of it and
# each `lanes` job a partition of the Ply runs, both cut by `.github/ci-shards.sh` from the
# durations the last run measured. `ci` is the one check that says a run is green.
# The toolchain pin recurs in every workflow under .github/: raise it everywhere at once.

name: CI

# Pushes only on main: a branch with a pull request is already run by `pull_request`.
# A change to prose alone starts no run: sound only while nothing built or tested reads a `.md`
# file, which AGENTS.md's "tests check the program, never a document" already demands. So `CI`
# cannot be a required check: a prose-only pull request would wait on it forever.
on:
  push:
    branches: [main]
    paths-ignore: ["**.md", "docs/**"]
  pull_request:
    paths-ignore: ["**.md", "docs/**"]
  # Nightly, and on demand: every job starts from nothing an earlier run kept (`PLY_CI_COLD`), so no
  # kept answer goes unchecked, and a seventh of the edit sweep runs, the whole of it in a week.
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

# A newer push to a pull request supersedes its run; a merge to main never cancels the run before
# it, whose `refresh` job is the one that commits the builder and the `ply` program back.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  # `gh run download` of another run's artifact.
  actions: read
  # The files a pull request changes, whose modules the edit sweep edits.
  pull-requests: read

env:
  # The Rust key folds both in, so raising either builds afresh.
  RUST_TOOLCHAIN: "1.93.1"
  NEXTEST_VERSION: "0.9.143"
  CARGO_TERM_COLOR: always
  # No job reuses incremental artifacts, and sccache cannot wrap rustc with it on.
  CARGO_INCREMENTAL: "0"
  # Line tables, which a test's backtrace reads. The full DWARF a developer's build keeps is for
  # `ply --count-alloc-sites` naming inlined frames (Cargo.toml), which nothing in CI asks of it.
  CARGO_PROFILE_DEV_DEBUG: line-tables-only
  RUST_BACKTRACE: "1"
  # A cold run restores nothing a Ply run kept: no stage, store, pass, C or Rust test trace. Rust's
  # own build caches are kept, since they decide nothing a test answers.
  PLY_CI_COLD: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}

jobs:
  plan:
    name: CI tables and cache keys are total, and the ucontext probe
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      sweep: ${{ steps.sweep.outputs.sweep }}
      swept: ${{ steps.sweep.outputs.swept }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # What the last run's test jobs measured, which `verify` holds the shards to.
      - name: The durations the last run measured
        env:
          GH_TOKEN: ${{ github.token }}
        run: .github/ci-shards.sh fetch-timings

      - name: Every crate is built, every named test exists, the shards are total, every cache key is restored
        run: .github/ci-shards.sh verify

      # The runner's awk is not the one a developer has. The self-test is what says the timestamps
      # and durations come out the same on both, and it is cheaper than a report someone acts on.
      - name: The timings tool's arithmetic holds
        run: .github/ci-timings.sh --self-test

      - name: ./probes/ucontext/run.sh
        run: ./probes/ucontext/run.sh

      # Nightly, every case of the edit sweep in shards; on a pull request, the case of each module it
      # changes.
      - name: The edit sweep's jobs
        id: sweep
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          if [ "$EVENT" = pull_request ]; then
            gh api "repos/${{ github.repository }}/pulls/$PR/files" --paginate --jq '.[].filename' > /tmp/changed
          else
            : > /tmp/changed
          fi
          sweep=$(.github/ci-shards.sh sweep-matrix "$EVENT" < /tmp/changed)
          echo "sweep=$sweep" >> "$GITHUB_OUTPUT"
          echo "swept=$(jq -r '.include | length > 0' <<< "$sweep")" >> "$GITHUB_OUTPUT"
          jq -r '.include[].name' <<< "$sweep"

  clippy:
    name: cargo fmt --all --check and cargo clippy --workspace --all-targets
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # v1
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: clippy, rustfmt
      # rust-cache keys on every Cargo.toml and Cargo.lock and the job itself, and falls back to the
      # job's last entry when they move. A key of our own would be part of that fallback's prefix,
      # so a changed manifest would find nothing and rebuild every dependency.
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          save-if: ${{ github.ref_name == github.event.repository.default_branch }}
      - run: cargo clippy --locked --workspace --all-targets -- -D warnings
      # Whatever clippy said, so one run reports both.
      - name: cargo fmt --all --check
        if: ${{ !cancelled() }}
        run: cargo fmt --all --check

  # The archive is keyed by the Rust key alone, so a run that changed no Rust builds none: it finds
  # the archive main's run or this pull request's last run cached, or, on main, the one the pull
  # request's run uploaded, since main cannot read a pull request's cache.
  build:
    name: cargo nextest archive
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      SCCACHE_GHA_ENABLED: "true"
      RUSTC_WRAPPER: sccache
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/rust-key
        id: rust
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: cached
        with:
          path: nextest.tar.zst
          key: nextest-archive-${{ steps.rust.outputs.key }}
          lookup-only: true
      - name: The archive a pull request's run built of this Rust
        id: reuse
        if: steps.cached.outputs.cache-hit != 'true' && github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
          NAME: nextest-archive-${{ steps.rust.outputs.key }}
        run: |
          set -euo pipefail
          run=$(.github/artifact-run.sh "$NAME")
          if [ -z "$run" ]; then echo "no run has built this Rust; building"; exit 0; fi
          gh run download "$run" -n "$NAME"
          test -f nextest.tar.zst
          echo "reused=true" >> "$GITHUB_OUTPUT"
          echo "$NAME came back from run $run"
      - name: Whether this run builds the archive
        id: builds
        if: steps.cached.outputs.cache-hit != 'true' && steps.reuse.outputs.reused != 'true'
        run: echo "yes=true" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # v1
        if: steps.builds.outputs.yes == 'true'
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      # rust-cache keys on every Cargo.toml and Cargo.lock and the job itself, and falls back to the
      # job's last entry when they move. A key of our own would be part of that fallback's prefix,
      # so a changed manifest would find nothing and rebuild every dependency.
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        if: steps.builds.outputs.yes == 'true'
        with:
          save-if: ${{ github.ref_name == github.event.repository.default_branch }}
      - uses: taiki-e/install-action@0758d235715de2f3551eacc980d9ae8fce9342c3 # v2.87.3
        if: steps.builds.outputs.yes == 'true'
        with:
          tool: cargo-nextest@${{ env.NEXTEST_VERSION }}
      - uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
        if: steps.builds.outputs.yes == 'true'

      - name: cargo test --workspace --no-run
        if: steps.builds.outputs.yes == 'true'
        run: cargo test --locked --workspace --no-run

      - name: cargo nextest archive --workspace
        if: steps.builds.outputs.yes == 'true'
        run: cargo nextest archive --locked --workspace --archive-file nextest.tar.zst

      # The window is part of the format: every job that unpacks this must pass `--long=30` too.
      - name: Recompress the archive with a whole-tree window
        if: steps.builds.outputs.yes == 'true'
        run: |
          set -euo pipefail
          zstd -d -c nextest.tar.zst | zstd -q -T0 -3 --long=30 -o nextest.long.tar.zst
          mv nextest.long.tar.zst nextest.tar.zst

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: steps.builds.outputs.yes == 'true' && github.event_name == 'pull_request'
        with:
          name: nextest-archive-${{ steps.rust.outputs.key }}
          path: nextest.tar.zst
          retention-days: 2
          if-no-files-found: error
      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: steps.cached.outputs.cache-hit != 'true'
        with:
          path: nextest.tar.zst
          key: nextest-archive-${{ steps.rust.outputs.key }}
      # A save that cannot reserve its key only warns; fail here rather than in every job below.
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: nextest.tar.zst
          key: nextest-archive-${{ steps.rust.outputs.key }}
          lookup-only: true
          fail-on-cache-miss: true

  build-ply:
    name: the ply binary and the ply program it builds
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      SCCACHE_GHA_ENABLED: "true"
      RUSTC_WRAPPER: sccache
    outputs:
      # The artifact holding the stage the run's jobs read, which a pull request whose stage this
      # job did not find under its sources' key hands them; empty otherwise.
      stage: ${{ steps.stage-cache.outputs.cache-hit != 'true' && github.event_name != 'push' && steps.stage-name.outputs.name || '' }}
      shards: ${{ steps.cut.outputs.shards }}
      nextest: ${{ steps.cut.outputs.nextest }}
      partitions: ${{ steps.selected.outputs.partitions }}
      lanes: ${{ steps.selected.outputs.lanes }}
      corpus: ${{ steps.selected.outputs.corpus }}
      solo: ${{ steps.selected.outputs.solo }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # What the last run's test jobs measured, this branch's own or main's. A first run or a fork's
      # leaves nothing here: the shards are then sliced by test count and the corpus runs dealt
      # round robin.
      - name: The durations the last run measured
        env:
          GH_TOKEN: ${{ github.token }}
        run: .github/ci-shards.sh fetch-timings
      # One job cuts the shards, and every partition runs the cut it left: two that cut their own
      # from tables a run apart could agree on no test at all. This one, since it asks what each
      # partition of the cut has left to run before any starts. The table goes with the cut, so
      # `passes` writes the next one over the table this run was cut by.
      - name: The shards those durations cut
        id: cut
        run: |
          set -euo pipefail
          rc=0
          .github/ci-shards.sh shard-configs /tmp/ply-shards || rc=$?
          case "$rc" in
            0)
              cp /tmp/ply-test-timings/timings.tsv /tmp/ply-shards/timings.tsv
              echo "shards=true" >> "$GITHUB_OUTPUT"
              ;;
            3) echo "shards=false" >> "$GITHUB_OUTPUT" ;;
            *) exit "$rc" ;;
          esac
          echo "nextest=$(.github/ci-shards.sh nextest-shards)" >> "$GITHUB_OUTPUT"
      # An artifact and not a cache: every job after reads the cut and fails without it, and the
      # repository's other runs evict a cache while those jobs wait for runners.
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: steps.cut.outputs.shards == 'true'
        with:
          name: test-shards
          path: /tmp/ply-shards
          retention-days: 1
          if-no-files-found: error

      - uses: ./.github/actions/rust-key
        id: rust
      # The runtime alone, before any pack: what the Rust key is a key of.
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: cached
        with:
          path: |
            target/release/ply
            target/release/ply-pack
          key: ply-runtime-${{ steps.rust.outputs.key }}
      - name: The runtime a pull request's run built of this Rust
        id: reuse
        if: steps.cached.outputs.cache-hit != 'true' && github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
          NAME: ply-runtime-${{ steps.rust.outputs.key }}
        run: |
          set -euo pipefail
          run=$(.github/artifact-run.sh "$NAME")
          if [ -z "$run" ]; then echo "no run has built this Rust; building"; exit 0; fi
          gh run download "$run" -n "$NAME" -D target/release
          chmod +x target/release/ply target/release/ply-pack
          echo "reused=true" >> "$GITHUB_OUTPUT"
          echo "$NAME came back from run $run"
      - name: Whether this run builds the runtime
        id: builds
        if: steps.cached.outputs.cache-hit != 'true' && steps.reuse.outputs.reused != 'true'
        run: echo "yes=true" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # v1
        if: steps.builds.outputs.yes == 'true'
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        if: steps.builds.outputs.yes == 'true'
        with:
          save-if: ${{ github.ref_name == github.event.repository.default_branch }}
      - uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
        if: steps.builds.outputs.yes == 'true'
      - name: cargo build --locked --release -p ply-launcher --bins
        if: steps.builds.outputs.yes == 'true'
        run: cargo build --locked --release -p ply-launcher --bins
      # A cached runtime is only as current as the key is whole: an input the key missed would be
      # served stale to every run after.
      - name: Every input the build read is under the Rust key
        if: steps.builds.outputs.yes == 'true'
        run: .github/ci-shards.sh rust-inputs target/release/ply.d
      # Here rather than in a later job: it compares mtimes, and a later checkout is newer than the
      # binary. Only a binary this job built has the mtimes it compares.
      - name: The runtime is built from this tree
        if: steps.builds.outputs.yes == 'true'
        run: .github/binary-is-current.sh --rust target/release/ply
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: steps.builds.outputs.yes == 'true' && github.event_name == 'pull_request'
        with:
          name: ply-runtime-${{ steps.rust.outputs.key }}
          path: |
            target/release/ply
            target/release/ply-pack
          retention-days: 2
          if-no-files-found: error
      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: steps.cached.outputs.cache-hit != 'true'
        with:
          path: |
            target/release/ply
            target/release/ply-pack
          key: ply-runtime-${{ steps.rust.outputs.key }}

      # What this tree holds of Ply, appended to the runtime: the step a change to Ply sources alone
      # costs where it used to cost a Rust build.
      - name: The pack of this tree's Ply sources and runnables
        run: target/release/ply-pack target/release/ply

      # A cache rather than an artifact: every suite job wants these two files, and the artifact
      # service is the one part of a run that fails on its own.
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: tcc
        with:
          path: tcc
          key: tcc-${{ runner.os }}-${{ runner.arch }}
      - name: tcc's packages, for this job's self-test and the jobs that run the archive
        if: steps.tcc.outputs.cache-hit != 'true'
        run: .github/ci-tcc.sh harvest
      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: steps.tcc.outputs.cache-hit != 'true'
        with:
          path: tcc
          key: tcc-${{ runner.os }}-${{ runner.arch }}

      # The run's first `ply` emits the emitter's own unit and compiles it with whatever
      # `Profile::Development` finds — `cc -O0` when tcc is absent. Installed here it is tcc, the
      # compiler every suite job compiles that unit with, so the emitted stage and the objects this
      # job writes are the ones they read.
      - name: tcc, the development profile's C compiler
        run: .github/ci-tcc.sh install

      # The run's first `ply` is minutes of checking and emitting. A tree whose sources have not
      # moved has both from an earlier run; against any other tree the buckets of emitted C that
      # did not move are already built, which is most of them.
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: env.PLY_CI_COLD != 'true'
        id: stage-cache
        with:
          path: |
            /tmp/ply-c-cache
            /tmp/ply-c-stage
          key: ply-c-stage-sources-${{ hashFiles('crates/*/src/**', 'crates/*/Cargo.toml', 'Cargo.lock', 'crates/*/ply/**') }}
          restore-keys: ply-c-stage-
      # Before this job's first `ply`, so what it reads is newer than this and the rest is not.
      - name: The moment this job's `ply`s start
        run: touch /tmp/ply-c-used.mark
      # The builder is in the name: a stage holds what the committed builder made of these sources.
      - name: The name a stage of these sources is packed under
        id: stage-name
        run: echo "name=ply-stage-${{ hashFiles('crates/*/src/**', 'crates/*/Cargo.toml', 'Cargo.lock', 'crates/*/ply/**', 'crates/ply-compiler/bootstrap/build.digest') }}" >> "$GITHUB_OUTPUT"
      # After the mark, so the cut below keeps it.
      - name: The stage a run on another branch built from these sources
        id: shared
        if: steps.stage-cache.outputs.cache-hit != 'true' && env.PLY_CI_COLD != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: .github/ci-warm.sh shared "${{ steps.stage-name.outputs.name }}"

      # A step of its own, so a run says what building it took and where.
      - name: The `ply` program these sources build
        run: .github/ci-warm.sh program target/release/ply
      - name: The freshness check can still go red
        run: .github/binary-is-current.sh --self-test
      # The check above needs the `ply` program but not the emitter, which a restored `ply`
      # program never asks for: without this, every later job's first compiles built it again.
      - name: The emitter, for every job after this one
        run: .github/ci-warm.sh target/release/ply
      # What earlier runs kept of each Ply run: the passes its tests took and the answer it kept.
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: env.PLY_CI_COLD != 'true'
        with:
          path: /tmp/ply-upstream
          key: ply-upstream-${{ github.run_id }}
          restore-keys: ply-upstream-
      # The partitions and corpus jobs to start: those holding a run no kept answer stands for. Each
      # is asked as its job asks it, by the `ply` the suite jobs run at the path their grants name.
      - name: The Ply runs left to run
        id: selected
        env:
          SHARDS: ${{ steps.cut.outputs.shards }}
        run: |
          set -euo pipefail
          mkdir -p target/debug
          cp target/release/ply target/debug/ply
          cut=
          if [ "$SHARDS" = true ]; then cut=/tmp/ply-shards; fi
          .github/ci-corpus.sh select "$cut" | tee -a "$GITHUB_OUTPUT"
      # Every job restores what this one saves, so it saves what this job's `ply`s read and wrote.
      - name: The stage, cut to what this job used
        if: steps.stage-cache.outputs.cache-hit != 'true'
        run: .github/ci-warm.sh used /tmp/ply-c-used.mark
      # What those `ply`s emitted, for the rest of the run: the suite jobs restore it rather than
      # repeat the emission. On main it is saved under the tree's own key, which a later run
      # restores, so main's next pull requests find it as soon as this job ends. A pull request's
      # cache reaches no other run, so it hands the stage over as an artifact, which its own jobs
      # read and which a run of these sources on any branch, main's after the merge most of all,
      # finds too (`ci-warm.sh shared`). Nothing was emitted when the restore above hit the tree's
      # own key, and the suite jobs find that key themselves.
      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: steps.stage-cache.outputs.cache-hit != 'true' && github.event_name == 'push'
        with:
          path: |
            /tmp/ply-c-cache
            /tmp/ply-c-stage
          key: ply-c-stage-sources-${{ hashFiles('crates/*/src/**', 'crates/*/Cargo.toml', 'Cargo.lock', 'crates/*/ply/**') }}
      # Never a reason for a red run: a job that finds no stage builds what it needs.
      - name: The stage, packed for the run's jobs
        if: steps.stage-cache.outputs.cache-hit != 'true' && github.event_name != 'push'
        continue-on-error: true
        run: .github/ci-warm.sh pack /tmp/stage.tar.zst
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: steps.stage-cache.outputs.cache-hit != 'true' && github.event_name != 'push'
        continue-on-error: true
        with:
          name: ${{ steps.stage-name.outputs.name }}
          path: /tmp/stage.tar.zst
          retention-days: 2
          compression-level: 0
          if-no-files-found: error

      # For `refresh`, the one job that runs this binary, and repacks it with what it emits.
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: github.event_name == 'push'
        with:
          name: ply
          path: |
            target/release/ply
            target/release/ply-pack
          retention-days: 1
          if-no-files-found: error

  # On runners of its own, so the corpus lanes have theirs to themselves. After `build-ply`, whose
  # stage it restores: a run that changed the compiler would otherwise have each shard emit the
  # emitter's stage itself, minutes of a runner the lanes are queued for. The builder its tests ask
  # this tree's compiler through is each shard's own to build, once.
  nextest:
    name: nextest ${{ matrix.shard }}/${{ matrix.of }}
    needs: [plan, build, build-ply]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.build-ply.outputs.nextest) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        if: needs.build-ply.outputs.shards == 'true'
        with:
          name: test-shards
          path: /tmp/ply-shards
      - uses: ./.github/actions/suite
        with:
          stage: ${{ needs.build-ply.outputs.stage }}
      # What this shard's tests compiled and asked of the compiler on its last run: bodies and
      # answers are each kept under what decides them, so one still current is read back.
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: env.PLY_CI_COLD != 'true'
        with:
          path: /tmp/ply-c-nextest
          key: ply-c-nextest-${{ matrix.shard }}-${{ github.run_id }}
          restore-keys: |
            ply-c-nextest-${{ matrix.shard }}-
            ply-c-nextest-
      - name: What this shard's last run compiled and asked
        run: |
          set -euo pipefail
          .github/ci-corpus.sh restore /tmp/ply-c-nextest
          .github/ci-corpus.sh mark
      - uses: ./.github/actions/rust-traces

      # A shard's profile names the tests it runs, except the catch-all's, which is the negation of
      # every other shard: a test the durations do not name runs there, and only there. A test whose
      # trace still stands is answered by it and not run: the config written beside the shard's
      # narrows its profile's filter.
      # The awk strips colour first: nextest colours its summary line.
      - name: cargo nextest run
        id: run
        env:
          SHARD: ${{ matrix.shard }}
          OF: ${{ matrix.of }}
          SHARDS: ${{ needs.build-ply.outputs.shards }}
          PLY_TEST_TRACES: /tmp/ply-rust-traces-new
        run: |
          set -euo pipefail
          mkdir -p "$PLY_TEST_TRACES"
          exclude=$(.github/ci-shards.sh exclude-filter)
          [ -n "$exclude" ] || { echo "the exclude filter is empty" >&2; exit 1; }
          config=/tmp/ply-shards/shard-$SHARD.toml
          if [ "$SHARDS" = true ]; then
            [ -f "$config" ] || { echo "the plan cut the shards and $config did not come back" >&2; exit 1; }
            said=$(.github/ci-shards.sh rust-answered /tmp/ply-rust-traces /tmp/answered.toml "$config")
            read -r profile answered <<< "$said"
            cut=(--profile "$profile" --tool-config-file "answered:/tmp/answered.toml" --tool-config-file "shards:$config")
          else
            said=$(.github/ci-shards.sh rust-answered /tmp/ply-rust-traces /tmp/answered.toml)
            read -r profile answered <<< "$said"
            cut=(--profile "$profile" --tool-config-file "answered:/tmp/answered.toml" --partition "slice:$SHARD/$OF")
          fi
          echo "profile=$profile" >> "$GITHUB_OUTPUT"
          echo "$answered Rust tests answered by their traces"
          cargo-nextest nextest run \
            --binaries-metadata target/nextest/binaries-metadata.json \
            --cargo-metadata target/nextest/cargo-metadata.json \
            --workspace-remap "$GITHUB_WORKSPACE" --target-dir-remap "$GITHUB_WORKSPACE/target" \
            --no-fail-fast --no-tests=pass "${cut[@]}" \
            -E "not ($exclude)" 2>&1 | tee /tmp/shard.log || nextest=$?
          [ "${nextest:-0}" -eq 0 ] || exit "$nextest"
          ran=$(awk '
            { gsub(/\033\[[0-9;]*m/, "") }
            /^ *Summary \[/ { for (i = 1; i <= NF; i++) if ($i == "tests" || $i == "test") { n = $(i - 1) } }
            END { print n + 0 }
          ' /tmp/shard.log)
          echo "shard $SHARD ran $ran tests"
          [ "$ran" -gt 0 ] || [ "$answered" -gt 0 ] || { echo "the shard ran no tests at all" >&2; exit 1; }
          echo "ran=$ran" >> "$GITHUB_OUTPUT"

      # What the next run cuts its shards from.
      - name: The durations this shard measured
        env:
          SHARD: ${{ matrix.shard }}
          PROFILE: ${{ steps.run.outputs.profile }}
          RAN: ${{ steps.run.outputs.ran }}
        run: |
          set -euo pipefail
          .github/ci-shards.sh durations "target/nextest/$PROFILE/junit.xml" > "/tmp/timings-nextest-$SHARD.tsv"
          lines=$(grep -c . "/tmp/timings-nextest-$SHARD.tsv" || true)
          [ "$lines" -eq "$RAN" ] || {
            echo "the report has $lines durations and the shard ran $RAN tests" >&2
            exit 1
          }
          echo "$lines durations"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: timings-nextest-${{ matrix.shard }}
          path: /tmp/timings-nextest-${{ matrix.shard }}.tsv
          retention-days: 1
          if-no-files-found: error
      # Even from a red shard: a pass is a fact about its test.
      - name: The traces of the tests this shard passed
        if: ${{ !cancelled() }}
        env:
          PROFILE: ${{ steps.run.outputs.profile }}
        run: .github/ci-shards.sh rust-kept /tmp/ply-rust-traces-new "target/nextest/${PROFILE:-default}/junit.xml" /tmp/rust-traces-out
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ !cancelled() }}
        with:
          name: rust-traces-nextest-${{ matrix.shard }}
          path: /tmp/rust-traces-out
          retention-days: 1
          if-no-files-found: ignore

      - name: What this shard compiled and asked
        if: ${{ !cancelled() }}
        run: .github/ci-corpus.sh keep /tmp/ply-c-nextest
      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: ${{ !cancelled() }}
        with:
          path: /tmp/ply-c-nextest
          key: ply-c-nextest-${{ matrix.shard }}-${{ github.run_id }}

  # The corpus runs a partition takes, each lane a process beside the others: only a partition
  # `build-ply` found a run no kept answer stands for.
  lanes:
    name: lanes ${{ matrix.shard }}/${{ matrix.of }}
    # After `build-ply`, whose stage it restores: a run that changed the compiler would otherwise
    # have each lane emit the emitter's stage itself. On a pull request, where `refresh` does not
    # run, this is the run's critical path.
    needs: [plan, build, build-ply]
    if: needs.build-ply.outputs.lanes == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.build-ply.outputs.partitions) }}
    steps:
      # The partition stops its runs four minutes before the job's limit, which leaves the steps
      # after it the time to keep what the runs wrote: a job the limit cancels keeps nothing, and its
      # re-run is as cold as it was.
      - name: The moment the partition's runs end by
        run: echo "PLY_CI_DEADLINE=$(($(date +%s) + 26 * 60))" >> "$GITHUB_ENV"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        if: needs.build-ply.outputs.shards == 'true'
        with:
          name: test-shards
          path: /tmp/ply-shards
      - uses: ./.github/actions/suite
        with:
          stage: ${{ needs.build-ply.outputs.stage }}
      # The C every partition compiled and read last run, which `passes` made one: without it a
      # lane's first `ply test` emits its package's whole unit before its first test.
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: env.PLY_CI_COLD != 'true'
        id: lanes-c
        with:
          path: /tmp/ply-c-lanes
          key: ply-c-lanes-${{ github.run_id }}
          restore-keys: ply-c-lanes-
      # A partition no run has kept C for starts from what main's corpus jobs kept.
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: ${{ (steps.lanes-c.outputs.cache-matched-key == '') && env.PLY_CI_COLD != 'true' }}
        with:
          path: /tmp/ply-c-corpus
          key: ply-c-corpus-
          restore-keys: ply-c-corpus-
      - name: The lanes' compiled C, merged under the stage
        run: |
          .github/ci-corpus.sh restore /tmp/ply-c-lanes
          .github/ci-corpus.sh restore /tmp/ply-c-corpus
          .github/ci-corpus.sh mark
      # Passes earlier runs published, each filed under the runtime stamp that earned it.
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: env.PLY_CI_COLD != 'true'
        with:
          path: /tmp/ply-upstream
          key: ply-upstream-${{ github.run_id }}
          restore-keys: ply-upstream-
      - name: The passes this partition starts from
        run: .github/ci-corpus.sh upstream-mark
      # Each package's front-end store as the last partition to load it left it.
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: env.PLY_CI_COLD != 'true'
        with:
          path: |
            crates/ply-cli/ply/.ply-cache
            crates/ply-compiler/ply/.ply-cache
            crates/ply-corpus/checks/.ply-cache
            crates/ply-corpus/ply/.ply-cache
            crates/ply-corpus/stdlib/.ply-cache
            crates/ply-cli-tests/ply/.ply-cache
            crates/ply-prove/ply/.ply-cache
            crates/ply-registry/ply/.ply-cache
            crates/ply-sim/ply/.ply-cache
            crates/ply-std/ply/.ply-cache
            crates/ply-store/ply/.ply-cache
            crates/ply-test/ply/.ply-cache
          key: ply-stores-lanes-${{ github.run_id }}
          restore-keys: |
            ply-stores-lanes-
            ply-stores-

      - name: The corpus runs this partition takes
        env:
          SHARD: ${{ matrix.shard }}
          SHARDS: ${{ needs.build-ply.outputs.shards }}
        run: |
          set -euo pipefail
          plan=()
          if [ "$SHARDS" = true ]; then plan=(/tmp/ply-shards); fi
          .github/ci-corpus.sh partition "$SHARD" "/tmp/timings-lanes-$SHARD.tsv" "${plan[@]}"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ !cancelled() }}
        with:
          name: timings-lanes-${{ matrix.shard }}
          path: /tmp/timings-lanes-${{ matrix.shard }}.tsv
          retention-days: 1
          if-no-files-found: error
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ !cancelled() }}
        with:
          name: durations-lanes-${{ matrix.shard }}
          path: /tmp/ply-test-durations.tsv
          retention-days: 1
          if-no-files-found: error

      # Even from a red job: a pass is a fact about its test.
      - name: The passes this partition published
        if: ${{ !cancelled() }}
        run: .github/ci-corpus.sh upstream-new "/tmp/upstream-${{ matrix.shard }}.tar"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ !cancelled() }}
        with:
          name: upstream-${{ matrix.shard }}
          path: /tmp/upstream-${{ matrix.shard }}.tar
          retention-days: 1
          if-no-files-found: error
      # What the lanes compiled or read and the stores they wrote, which `passes` makes one with
      # every other partition's for the next run.
      - name: What the lanes compiled, and the stores they wrote
        if: ${{ !cancelled() }}
        run: .github/ci-corpus.sh pack "/tmp/kept-lanes-${{ matrix.shard }}.tar"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ !cancelled() }}
        with:
          name: kept-lanes-${{ matrix.shard }}
          path: /tmp/kept-lanes-${{ matrix.shard }}.tar
          retention-days: 1
          if-no-files-found: error

  # Not part of `ci`: a cache that could not be saved makes no run wrong.
  passes:
    name: the passes this run published, and what its tests cost
    if: ${{ !cancelled() }}
    needs: [build-ply, nextest, gates, lanes, corpus]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      actions: write
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: env.PLY_CI_COLD != 'true'
        with:
          path: /tmp/ply-upstream
          key: ply-upstream-${{ github.run_id }}
          restore-keys: ply-upstream-
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: upstream-*
          merge-multiple: true
          path: /tmp/upstream-parts
      - name: Every job's passes in one upstream
        run: .github/ci-corpus.sh upstream-merge /tmp/upstream-parts
      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: /tmp/ply-upstream
          key: ply-upstream-${{ github.run_id }}

      # Every Rust test's last passing trace, the ones this run filed over the ones it read.
      - uses: ./.github/actions/rust-traces
        id: traces
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: rust-traces-*
          merge-multiple: true
          path: /tmp/rust-traces-parts
      - name: Every job's Rust traces in one store
        id: rust-traces
        run: |
          set -euo pipefail
          mkdir -p /tmp/ply-rust-traces
          if [ -d /tmp/rust-traces-parts ]; then cp -R /tmp/rust-traces-parts/. /tmp/ply-rust-traces/; fi
          if [ -n "$(find /tmp/ply-rust-traces -type f -print -quit)" ]; then echo "any=true" >> "$GITHUB_OUTPUT"; fi
          echo "$(find /tmp/ply-rust-traces -type f | wc -l) Rust tests answered by a trace"
      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: steps.rust-traces.outputs.any == 'true'
        with:
          path: /tmp/ply-rust-traces
          key: rust-traces-${{ steps.traces.outputs.digest }}-${{ github.run_id }}

      # Every partition's C and the stores it wrote, as one entry each that every partition of the
      # next run restores: the cut moves runs between partitions as the durations move, and a
      # partition holding only its own last run's would load and emit a package it was just given
      # from nothing. A store no partition wrote this run stays as the last run left it.
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: env.PLY_CI_COLD != 'true'
        with:
          path: |
            crates/ply-cli/ply/.ply-cache
            crates/ply-compiler/ply/.ply-cache
            crates/ply-corpus/checks/.ply-cache
            crates/ply-corpus/ply/.ply-cache
            crates/ply-corpus/stdlib/.ply-cache
            crates/ply-cli-tests/ply/.ply-cache
            crates/ply-prove/ply/.ply-cache
            crates/ply-registry/ply/.ply-cache
            crates/ply-sim/ply/.ply-cache
            crates/ply-std/ply/.ply-cache
            crates/ply-store/ply/.ply-cache
            crates/ply-test/ply/.ply-cache
          key: ply-stores-lanes-${{ github.run_id }}
          restore-keys: ply-stores-lanes-
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: kept-lanes-*
          path: /tmp/kept-lanes
      - name: Every partition's C and stores as one
        id: kept
        run: |
          set -euo pipefail
          .github/ci-corpus.sh unpack /tmp/kept-lanes /tmp/ply-c-lanes
          if [ -n "$(find /tmp/ply-c-lanes -type f -print -quit)" ]; then echo "c=true" >> "$GITHUB_OUTPUT"; fi
          if [ -n "$(find crates -path '*/.ply-cache/*' -type f -print -quit)" ]; then echo "stores=true" >> "$GITHUB_OUTPUT"; fi
      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: steps.kept.outputs.c == 'true'
        with:
          path: /tmp/ply-c-lanes
          key: ply-c-lanes-${{ github.run_id }}
      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: steps.kept.outputs.stores == 'true'
        with:
          path: |
            crates/ply-cli/ply/.ply-cache
            crates/ply-compiler/ply/.ply-cache
            crates/ply-corpus/checks/.ply-cache
            crates/ply-corpus/ply/.ply-cache
            crates/ply-corpus/stdlib/.ply-cache
            crates/ply-cli-tests/ply/.ply-cache
            crates/ply-prove/ply/.ply-cache
            crates/ply-registry/ply/.ply-cache
            crates/ply-sim/ply/.ply-cache
            crates/ply-std/ply/.ply-cache
            crates/ply-store/ply/.ply-cache
            crates/ply-test/ply/.ply-cache
          key: ply-stores-lanes-${{ github.run_id }}

      # The table the next run cuts its shards from, from every shard, partition and desk runner, so a
      # run that went red leaves the last whole one in place rather than a table missing whatever did
      # not report. Written over the table this run was cut by, which came with the cut, and carried
      # to the next run in the `test-durations` artifact below. A pull request writes one too: a
      # branch cuts by what its own tree measured, and main is never cut by a branch's
      # (`ci-shards.sh fetch-timings`). An artifact and not a cache: a run whose table the
      # repository's other runs evicted deals its corpus runs round robin, and overruns a lane.
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        if: needs.build-ply.outputs.shards == 'true' && needs.nextest.result == 'success' && contains(fromJSON('["success", "skipped"]'), needs.lanes.result) && contains(fromJSON('["success", "skipped"]'), needs.corpus.result)
        with:
          name: test-shards
          path: /tmp/ply-shards
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        if: needs.nextest.result == 'success' && contains(fromJSON('["success", "skipped"]'), needs.lanes.result) && contains(fromJSON('["success", "skipped"]'), needs.corpus.result)
        with:
          pattern: timings-*
          merge-multiple: true
          path: /tmp/ply-timings-parts
      - name: One duration per test
        id: timings
        if: needs.nextest.result == 'success' && contains(fromJSON('["success", "skipped"]'), needs.lanes.result) && contains(fromJSON('["success", "skipped"]'), needs.corpus.result)
        run: |
          set -euo pipefail
          mkdir -p /tmp/ply-test-timings
          find /tmp/ply-timings-parts -name '*.tsv' -exec cat {} + |
            .github/ci-shards.sh timings /tmp/ply-shards/timings.tsv > /tmp/ply-test-timings/timings.tsv
          lines=$(grep -c . /tmp/ply-test-timings/timings.tsv || true)
          [ "$lines" -gt 0 ] || { echo "no durations came back from the partitions" >&2; exit 1; }
          echo "$lines test durations"

      # What each test cost, slowest first, whichever jobs went red: the Ply tests' own durations and
      # nextest's, with the table the next run is cut by when this run wrote one.
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        if: ${{ !cancelled() }}
        with:
          pattern: durations-*
          path: /tmp/durations-parts
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        if: ${{ !cancelled() }}
        with:
          pattern: timings-nextest-*
          merge-multiple: true
          path: /tmp/nextest-parts
      - name: What each test cost
        if: ${{ !cancelled() }}
        run: |
          set -euo pipefail
          out=/tmp/test-durations
          mkdir -p "$out" /tmp/durations-parts /tmp/nextest-parts
          {
            find /tmp/durations-parts -name '*.tsv' -exec cat {} +
            find /tmp/nextest-parts -name '*.tsv' -exec awk -F'\t' -v OFS='\t' '{ print $3, "nextest " $1, $2 }' {} +
          } | LC_ALL=C sort -t$'\t' -k1,1nr -k2,2 -k3,3 > "$out/tests.tsv"
          if [ -f /tmp/ply-test-timings/timings.tsv ]; then cp /tmp/ply-test-timings/timings.tsv "$out/"; fi
          tests=$(grep -c . "$out/tests.tsv" || true)
          [ "$tests" -gt 0 ] || { echo "no job reported what its tests cost" >&2; exit 1; }
          {
            echo "### The slowest tests"
            echo
            echo "| seconds | suite | test |"
            echo "| ---: | --- | --- |"
            head -30 "$out/tests.tsv" | awk -F'\t' '{ gsub(/\|/, "\\|", $3); printf "| %.1f | %s | %s |\n", $1 / 1000, $2, $3 }'
            echo
            awk -F'\t' -v n="$tests" '{ t += $1 } END { printf "%d tests, %.0f s in all; every row is in the `test-durations` artifact.\n", n, t / 1000 }' "$out/tests.tsv"
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ !cancelled() }}
        with:
          name: test-durations
          path: /tmp/test-durations
          retention-days: 14
          if-no-files-found: error

      # Whatever the table came to: a family keeps its entries unless this run saved one.
      - name: The entries this run's replaced
        if: ${{ !cancelled() }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = pull_request ] &&
             [ "${{ github.event.pull_request.head.repo.full_name }}" != "${{ github.repository }}" ]; then
            echo "a fork's pull request cannot write this repository's caches"
            exit 0
          fi
          .github/ci-shards.sh supersede "${{ github.run_id }}" "${{ github.ref }}"

  # On main only: the builder and the `ply` program the sources build are committed back, so no
  # pull request carries either and two of them never conflict on them.
  # A push by the workflow's own token starts no run, so the commit is the tree the run tested
  # plus what that run emitted.
  refresh:
    name: refresh the builder and the ply program
    if: github.event_name == 'push'
    needs: [plan, build, build-ply]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: true
      - uses: ./.github/actions/suite
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ply
          path: target/release
      - name: Emit the builder and the `ply` program
        run: |
          set -euo pipefail
          chmod +x target/release/ply target/release/ply-pack
          target/release/ply bootstrap crates/ply-compiler/ply --out crates/ply-compiler/bootstrap
          target/release/ply bootstrap crates/ply-cli/ply --out crates/ply-cli/bootstrap
      # The pack refuses a bootstrap directory holding anything `ply bootstrap` does not write, and a
      # binary carrying what was emitted must still start, so neither is committed for every checkout.
      - name: A binary packed with what it emitted runs
        run: |
          set -euo pipefail
          target/release/ply-pack target/release/ply
          target/release/ply --version
      # The digest covers everything the build reads, so bytes that moved under it are a build that
      # is not a function of its sources, which committing them would hide.
      - name: The programs moved only with their digests
        run: |
          set -euo pipefail
          for program in crates/ply-compiler/bootstrap/build crates/ply-cli/bootstrap/ply; do
            git diff --quiet -- "$program.digest" || continue
            git diff --quiet -- "$program.run" || {
              echo "$program.run changed while $program.digest did not: the build is not a function of its sources" >&2
              exit 1
            }
          done
      - name: Commit what moved
        run: |
          set -euo pipefail
          git add crates/ply-compiler/bootstrap crates/ply-cli/bootstrap
          git diff --cached --quiet && { echo "the builder and the program already match main"; exit 0; }
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m 'The builder and ply program CI emitted for these sources'
          # Main may have moved under this run; the next run on main refreshes for both, and a
          # prose-only merge starts none.
          git pull --rebase origin main || { git rebase --abort; echo "main moved; the next run refreshes"; exit 0; }
          git push origin HEAD:main || echo "main moved; the next run refreshes"

  # Tests that must be seen to run: the tree checks, by name.
  # The gate tests, then the host packages, whose tests bind sockets and processes: one runner after
  # another rather than a runner each, beside the lanes that wait for runners.
  gates:
    name: test gates and the host packages
    needs: [plan, build, build-ply]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/suite
        with:
          stage: ${{ needs.build-ply.outputs.stage }}

      - uses: ./.github/actions/rust-traces
      - name: cargo nextest run
        env:
          PLY_TEST_TRACES: /tmp/ply-rust-traces-new
        run: |
          set -euo pipefail
          mkdir -p "$PLY_TEST_TRACES"
          filter=$(.github/ci-shards.sh gate-filter)
          .github/ci-shards.sh rust-answered /tmp/ply-rust-traces /tmp/answered-gates.toml
          { [ -d /tmp/ply-rust-traces ] && target/debug/ply-pack --answered /tmp/ply-rust-traces; } > /tmp/answered.tsv || true
          cargo-nextest nextest run \
            --binaries-metadata target/nextest/binaries-metadata.json \
            --cargo-metadata target/nextest/cargo-metadata.json \
            --workspace-remap "$GITHUB_WORKSPACE" --target-dir-remap "$GITHUB_WORKSPACE/target" \
            --profile answered --tool-config-file "answered:/tmp/answered-gates.toml" \
            --no-fail-fast --no-tests=pass -E "$filter" 2>&1 | tee /tmp/gates.log
      - name: The traces of the gates the job passed
        if: ${{ !cancelled() }}
        run: .github/ci-shards.sh rust-kept /tmp/ply-rust-traces-new target/nextest/answered/junit.xml /tmp/rust-traces-out

      # A tree check ran here, or its trace answered for it: either way the binary has it.
      - name: Every tree check ran
        run: |
          set -euo pipefail
          ran=0
          while read -r package target test; do
            if [ "$target" = lib ]; then id=$package; else id="$package::$target"; fi
            awk -v id="$id" -v test="$test" '
              { gsub(/\033\[[0-9;]*m/, "") }
              $1 == "PASS" && $NF == test && $(NF - 1) == id { found = 1 }
              END { exit !found }
            ' /tmp/gates.log || grep -qxF "$id"$'\t'"$test" /tmp/answered.tsv || {
              echo "'$id $test' did not run: the table names a test the binary does not have" >&2
              exit 1
            }
            ran=$((ran + 1))
          done < <(.github/ci-shards.sh tree-checks)
          echo "$ran tree checks ran or were answered"
          [ "$ran" -gt 0 ] || { echo "the table is empty" >&2; exit 1; }
      # The tree check that builds the `ply` program with this tree's own builder filed that build's
      # rows and bodies under the compiler `refresh` is about to commit as main's builder. Kept, a
      # pull request's first `ply` after that commit reads them back.
      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: github.event_name == 'push'
        with:
          path: |
            /tmp/ply-c-cache
            /tmp/ply-c-stage
          key: ply-c-stage-own-${{ hashFiles('crates/*/src/**', 'crates/*/Cargo.toml', 'Cargo.lock', 'crates/*/ply/**') }}

      # A lock pins the closure's names and versions; a path dependency in this checkout carries no
      # digest, so an edit to one moves no lock. On the merge with main, not only the branch: two
      # changes that each moved a lock leave main's stale, and main's refresh is the first build that
      # verifies it. Here, beside the partitions, rather than in `build-ply`, whose end every
      # partition waits on.
      - name: Every lockfile pins this tree
        if: ${{ !cancelled() }}
        run: |
          set -euo pipefail
          locks=$(git ls-files '*ply.lock')
          for lock in $locks; do target/debug/ply resolve "$(dirname "$lock")" >/dev/null; done
          git diff --exit-code -- $locks || { echo "a ply.lock does not pin these sources: run 'ply resolve' on it" >&2; exit 1; }

      - name: cargo nextest run, the host packages
        if: ${{ !cancelled() }}
        env:
          PLY_TEST_TRACES: /tmp/ply-rust-traces-host
        run: |
          set -euo pipefail
          mkdir -p "$PLY_TEST_TRACES"
          filter=$(.github/ci-shards.sh host-filter)
          .github/ci-shards.sh rust-answered /tmp/ply-rust-traces /tmp/answered-host.toml
          cargo-nextest nextest run \
            --binaries-metadata target/nextest/binaries-metadata.json \
            --cargo-metadata target/nextest/cargo-metadata.json \
            --workspace-remap "$GITHUB_WORKSPACE" --target-dir-remap "$GITHUB_WORKSPACE/target" \
            --profile answered --tool-config-file "answered:/tmp/answered-host.toml" \
            --no-fail-fast --no-tests=pass --success-output immediate -E "$filter"
      - name: The traces of the host packages' tests the job passed
        if: ${{ !cancelled() }}
        run: .github/ci-shards.sh rust-kept /tmp/ply-rust-traces-host target/nextest/answered/junit.xml /tmp/rust-traces-out
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ !cancelled() }}
        with:
          name: rust-traces-gates
          path: /tmp/rust-traces-out
          retention-days: 1
          if-no-files-found: ignore

  # The Ply runs that would starve a partition, on runners of their own (`ci-shards.sh corpus-matrix`):
  # the corpus's checks that start desks under load, cut by duration over the `desks-<k>` runners,
  # which spawn this run's `ply` over desks and floors with the grants `benches/corpus.sh` gives the
  # program, and the CLI suite's `cli-` runs that take every core, a runner each. Postgres beside them
  # holds the desk's schema, and the database checks are handed its URL as `CORPUS_DB`. Only the ones
  # `build-ply` found a run no kept answer stands for start.
  corpus:
    name: test corpus ${{ matrix.id }}
    needs: [plan, build, build-ply]
    if: needs.build-ply.outputs.solo == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.build-ply.outputs.corpus) }}
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: desk
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30
    steps:
      # As a partition's: the steps after the runs keep what they wrote.
      - name: The moment the job's runs end by
        run: echo "PLY_CI_DEADLINE=$(($(date +%s) + 26 * 60))" >> "$GITHUB_ENV"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        if: needs.build-ply.outputs.shards == 'true' && startsWith(matrix.id, 'desks-')
        with:
          name: test-shards
          path: /tmp/ply-shards
      - uses: ./.github/actions/suite
        with:
          stage: ${{ needs.build-ply.outputs.stage }}
      # The C main's corpus runs compiled (`ci-corpus.sh keep`): without it a lane's first `ply test`
      # emits the checks package's whole closure, the compiler's included, before its first check.
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: env.PLY_CI_COLD != 'true'
        with:
          path: /tmp/ply-c-corpus
          key: ply-c-corpus-${{ matrix.id }}-${{ hashFiles('crates/*/src/**', 'crates/*/Cargo.toml', 'Cargo.lock', 'crates/*/ply/**') }}
          restore-keys: |
            ply-c-corpus-${{ matrix.id }}-
            ply-c-corpus-
      - name: The corpus's compiled C, merged under the stage
        run: .github/ci-corpus.sh restore /tmp/ply-c-corpus
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: env.PLY_CI_COLD != 'true'
        with:
          path: /tmp/ply-upstream
          key: ply-upstream-${{ github.run_id }}
          restore-keys: ply-upstream-
      - name: The passes this job starts from
        run: .github/ci-corpus.sh upstream-mark
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: env.PLY_CI_COLD != 'true'
        with:
          path: |
            crates/ply-cli/ply/.ply-cache
            crates/ply-compiler/ply/.ply-cache
            crates/ply-corpus/checks/.ply-cache
            crates/ply-corpus/ply/.ply-cache
            crates/ply-corpus/stdlib/.ply-cache
            crates/ply-cli-tests/ply/.ply-cache
            crates/ply-prove/ply/.ply-cache
            crates/ply-registry/ply/.ply-cache
            crates/ply-sim/ply/.ply-cache
            crates/ply-std/ply/.ply-cache
            crates/ply-store/ply/.ply-cache
            crates/ply-test/ply/.ply-cache
          key: ply-stores-corpus-${{ matrix.id }}-${{ github.run_id }}
          restore-keys: |
            ply-stores-corpus-${{ matrix.id }}-
            ply-stores-
      - name: The moment this job's compiling starts
        run: .github/ci-corpus.sh mark
      - name: psql, and the libpq the floor links
        if: ${{ !startsWith(matrix.id, 'cli-') }}
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client libpq-dev
      - name: The desk's schema
        if: ${{ !startsWith(matrix.id, 'cli-') }}
        run: psql -v ON_ERROR_STOP=1 -q -h 127.0.0.1 -U postgres -d desk -f examples/desk.sql
      # Built as `benches/corpus.sh` builds them; the checks ask `process.bound` for each.
      - name: The floors the served tables are compared with
        if: ${{ !startsWith(matrix.id, 'cli-') }}
        run: |
          set -euo pipefail
          cc -O2 -o target/http-floor benches/http-floor/floor.c -lpthread
          cc -O2 -o target/pg-floor benches/pg-floor/pg.c -I"$(pg_config --includedir)" -L"$(pg_config --libdir)" -lpq
      # A check may take minutes and make any number of calls; a quarter of an hour abandons one.
      - name: ply test
        env:
          ID: ${{ matrix.id }}
          SHARDS: ${{ needs.build-ply.outputs.shards }}
        run: |
          set -euo pipefail
          case "$ID" in
            cli-*) .github/ci-corpus.sh run "$ID" ;;
            desks-*)
              cut=
              if [ "$SHARDS" = true ]; then cut=/tmp/ply-shards; fi
              .github/ci-corpus.sh desks "${ID#desks-}" "/tmp/timings-$ID.tsv" "$cut" ;;
            *) echo "no corpus job runs '$ID'" >&2; exit 1 ;;
          esac
      # What the next run cuts the desk runners from.
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ !cancelled() && startsWith(matrix.id, 'desks-') }}
        with:
          name: timings-${{ matrix.id }}
          path: /tmp/timings-${{ matrix.id }}.tsv
          retention-days: 1
          if-no-files-found: error
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ !cancelled() }}
        with:
          name: durations-corpus-${{ matrix.id }}
          path: /tmp/ply-test-durations.tsv
          retention-days: 1
          if-no-files-found: error
      - name: The passes this job published
        if: ${{ !cancelled() }}
        run: .github/ci-corpus.sh upstream-new "/tmp/upstream-corpus-${{ matrix.id }}.tar"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ !cancelled() }}
        with:
          name: upstream-corpus-${{ matrix.id }}
          path: /tmp/upstream-corpus-${{ matrix.id }}.tar
          retention-days: 1
          if-no-files-found: error
      - name: The stores, compacted
        if: ${{ !cancelled() }}
        run: .github/ci-corpus.sh compact
      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: ${{ !cancelled() }}
        with:
          path: |
            crates/ply-cli/ply/.ply-cache
            crates/ply-compiler/ply/.ply-cache
            crates/ply-corpus/checks/.ply-cache
            crates/ply-corpus/ply/.ply-cache
            crates/ply-corpus/stdlib/.ply-cache
            crates/ply-cli-tests/ply/.ply-cache
            crates/ply-prove/ply/.ply-cache
            crates/ply-registry/ply/.ply-cache
            crates/ply-sim/ply/.ply-cache
            crates/ply-std/ply/.ply-cache
            crates/ply-store/ply/.ply-cache
            crates/ply-test/ply/.ply-cache
          key: ply-stores-corpus-${{ matrix.id }}-${{ github.run_id }}
      # From main, what this run compiled, for every later run's corpus lanes.
      - name: What this run compiled
        if: github.event_name == 'push'
        run: .github/ci-corpus.sh keep /tmp/ply-c-corpus
      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: github.event_name == 'push'
        with:
          path: /tmp/ply-c-corpus
          key: ply-c-corpus-${{ matrix.id }}-${{ hashFiles('crates/*/src/**', 'crates/*/Cargo.toml', 'Cargo.lock', 'crates/*/ply/**') }}

  # The one check that says a run is green.
  # Every module of the tree edited the ways `edit_gate` edits its fixtures, and checked warm and cold
  # after each (`edit_sweep`): nightly a seventh of the cases in shards, and on a pull request the
  # modules it changes.
  edit-sweep:
    name: edit sweep ${{ matrix.name }}
    needs: [plan, build, build-ply]
    if: needs.plan.outputs.swept == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.sweep) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/suite
        with:
          stage: ${{ needs.build-ply.outputs.stage }}
      - name: The sweep's cases this job takes
        env:
          SHARD: ${{ matrix.shard }}
          FILTER: ${{ matrix.filter }}
        run: |
          set -euo pipefail
          if [ -n "$FILTER" ]; then
            .github/ci-corpus.sh sweep --filter "$FILTER" --shard "$SHARD"
          else
            .github/ci-corpus.sh sweep --shard "$SHARD"
          fi

  ci:
    name: CI
    if: always()
    needs: [plan, clippy, build, build-ply, nextest, lanes, gates, corpus, refresh, edit-sweep]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Every job succeeded
        env:
          EVENT: ${{ github.event_name }}
        run: |
          set -euo pipefail
          echo '${{ toJSON(needs) }}' > /tmp/needs.json
          cat /tmp/needs.json
          # `refresh` runs on a push to main only, `build-ply` starts no partition or corpus job whose
          # runs what earlier runs kept answers, and the edit sweep runs only where it has cases.
          not_ok=$(jq -r --arg event "$EVENT" '
            to_entries[]
            | select(.value.result != "success")
            | select(($event != "push" and .value.result == "skipped"
                and .key == "refresh") | not)
            | select((.value.result == "skipped"
                and (.key == "lanes" or .key == "corpus" or .key == "edit-sweep")) | not)
            | "\(.key) = \(.value.result)"
          ' /tmp/needs.json)
          if [ -n "$not_ok" ]; then
            echo "$not_ok" >&2
            exit 1
          fi
          echo "fmt, clippy and the whole test suite are green."
