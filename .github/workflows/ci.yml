# `build` compiles the workspace into one nextest archive; each `nextest` job runs a shard of it and
# each `lanes` job a partition of the Ply runs, both cut by `.github/ci-shards.sh` from the
# durations the last run measured. `ci` is the one check that says a run is green.
# The toolchain pin recurs in every workflow under .github/: raise it everywhere at once.

name: CI

# Pushes only on main: a branch with a pull request is already run by `pull_request`.
# A change to prose alone starts no run: sound only while nothing built or tested reads a `.md`
# file, which AGENTS.md's "tests check the program, never a document" already demands. So `CI`
# cannot be a required check: a prose-only pull request would wait on it forever.
on:
  push:
    branches: [main]
    paths-ignore: ["**.md", "docs/**"]
  pull_request:
    paths-ignore: ["**.md", "docs/**"]

# A newer push to a pull request supersedes its run; a merge to main never cancels the run before
# it, whose `refresh` job is the one that commits the bundle and goldens back.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  # `gh run download` of another run's artifact.
  actions: read

env:
  CARGO_TERM_COLOR: always
  # No job reuses incremental artifacts, and sccache cannot wrap rustc with it on.
  CARGO_INCREMENTAL: "0"
  # Line tables, which a test's backtrace reads. The full DWARF a developer's build keeps is for
  # `ply --count-alloc-sites` naming inlined frames (Cargo.toml), which nothing in CI asks of it.
  CARGO_PROFILE_DEV_DEBUG: line-tables-only
  RUST_BACKTRACE: "1"

jobs:
  plan:
    name: CI tables and cache keys are total, and the ucontext probe
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      partitions: ${{ steps.tables.outputs.partitions }}
      nextest: ${{ steps.tables.outputs.nextest }}
      corpus: ${{ steps.tables.outputs.corpus }}
      shards: ${{ steps.cut.outputs.shards }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # What the partitions of the last run measured, this branch's own or main's. A first run, an
      # evicted entry or a fork with no access leaves nothing here, and the partitions are cut by
      # test count instead.
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: /tmp/ply-test-timings
          key: test-timings-${{ github.run_id }}
          restore-keys: test-timings-

      - name: Every crate is built, every named test exists, the shards are total, every cache key is restored
        run: .github/ci-shards.sh verify

      # The runner's awk is not the one a developer has. The self-test is what says the timestamps
      # and durations come out the same on both, and it is cheaper than a report someone acts on.
      - name: The timings tool's arithmetic holds
        run: .github/ci-timings.sh --self-test

      - name: ./probes/ucontext/run.sh
        run: ./probes/ucontext/run.sh

      # One job cuts the shards, and every partition runs the cut it left: two that cut their own
      # from tables a run apart could agree on no test at all.
      - name: The shards those durations cut
        id: cut
        run: |
          set -euo pipefail
          rc=0
          .github/ci-shards.sh shard-configs /tmp/ply-shards || rc=$?
          case "$rc" in
            0) echo "shards=true" >> "$GITHUB_OUTPUT" ;;
            3) echo "shards=false" >> "$GITHUB_OUTPUT" ;;
            *) exit "$rc" ;;
          esac
      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: steps.cut.outputs.shards == 'true'
        with:
          path: /tmp/ply-shards
          key: test-shards-${{ github.run_id }}
      # A save that cannot reserve its key only warns; fail here rather than in every partition.
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: steps.cut.outputs.shards == 'true'
        with:
          path: /tmp/ply-shards
          key: test-shards-${{ github.run_id }}
          lookup-only: true
          fail-on-cache-miss: true

      - name: Emit the matrices
        id: tables
        run: |
          echo "partitions=$(.github/ci-shards.sh partitions)" >> "$GITHUB_OUTPUT"
          echo "nextest=$(.github/ci-shards.sh nextest-shards)" >> "$GITHUB_OUTPUT"
          echo "corpus=$(.github/ci-shards.sh corpus-matrix)" >> "$GITHUB_OUTPUT"

  clippy:
    name: cargo fmt --all --check and cargo clippy --workspace --all-targets
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # v1
        with:
          toolchain: "1.93.1"
          components: clippy, rustfmt
      # rust-cache keys on every Cargo.toml and Cargo.lock and the job itself, and falls back to the
      # job's last entry when they move. A key of our own would be part of that fallback's prefix,
      # so a changed manifest would find nothing and rebuild every dependency.
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          save-if: ${{ github.ref_name == github.event.repository.default_branch }}
      - run: cargo clippy --locked --workspace --all-targets -- -D warnings
      # Whatever clippy said, so one run reports both.
      - name: cargo fmt --all --check
        if: ${{ !cancelled() }}
        run: cargo fmt --all --check

  build:
    name: cargo nextest archive
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      SCCACHE_GHA_ENABLED: "true"
      RUSTC_WRAPPER: sccache
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: The tree this run builds
        id: tree
        run: echo "tree=$(git rev-parse 'HEAD^{tree}')" >> "$GITHUB_OUTPUT"
      # main cannot read a pull request's cache, so a pull request's build comes back as an artifact.
      - name: The archive a pull request's run built for this tree
        id: reuse
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          found=$(.github/artifact-for-this-tree.sh nextest-archive "${{ steps.tree.outputs.tree }}")
          if [ -z "$found" ]; then echo "no run has built this tree; building"; exit 0; fi
          run=${found%% *}; name=${found##* }
          gh run download "$run" -n "$name"
          test -f nextest.tar.zst
          echo "reused=true" >> "$GITHUB_OUTPUT"
          echo "$name came back from run $run"
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # v1
        if: steps.reuse.outputs.reused != 'true'
        with:
          toolchain: "1.93.1"
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        if: steps.reuse.outputs.reused != 'true'
        with:
          save-if: ${{ github.ref_name == github.event.repository.default_branch }}
      - uses: taiki-e/install-action@0758d235715de2f3551eacc980d9ae8fce9342c3 # v2.87.3
        if: steps.reuse.outputs.reused != 'true'
        with:
          tool: cargo-nextest@0.9.143
      - uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
        if: steps.reuse.outputs.reused != 'true'

      - name: cargo test --workspace --no-run
        if: steps.reuse.outputs.reused != 'true'
        run: cargo test --locked --workspace --no-run

      - name: cargo nextest archive --workspace
        if: steps.reuse.outputs.reused != 'true'
        run: cargo nextest archive --locked --workspace --archive-file nextest.tar.zst

      # The window is part of the format: every job that unpacks this must pass `--long=30` too.
      - name: Recompress the archive with a whole-tree window
        if: steps.reuse.outputs.reused != 'true'
        run: |
          set -euo pipefail
          zstd -d -c nextest.tar.zst | zstd -q -T0 -3 --long=30 -o nextest.long.tar.zst
          mv nextest.long.tar.zst nextest.tar.zst

      # Jobs restore the archive from the cache, which is faster than an artifact download; the
      # artifact is for a later push to main to reuse.
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: github.event_name == 'pull_request'
        with:
          name: nextest-archive-${{ steps.tree.outputs.tree }}
          path: nextest.tar.zst
          retention-days: 2
          if-no-files-found: error
      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: nextest.tar.zst
          key: nextest-archive-${{ github.run_id }}
      # A save that cannot reserve its key only warns; fail here rather than in every job below.
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: nextest.tar.zst
          key: nextest-archive-${{ github.run_id }}
          lookup-only: true
          fail-on-cache-miss: true

  build-ply:
    name: cargo build --release -p ply-launcher
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      SCCACHE_GHA_ENABLED: "true"
      RUSTC_WRAPPER: sccache
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: The tree this run builds
        id: tree
        run: echo "tree=$(git rev-parse 'HEAD^{tree}')" >> "$GITHUB_OUTPUT"
      - name: The binary a pull request's run built for this tree
        id: reuse
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          found=$(.github/artifact-for-this-tree.sh ply "${{ steps.tree.outputs.tree }}")
          if [ -z "$found" ]; then echo "no run has built this tree; building"; exit 0; fi
          run=${found%% *}; name=${found##* }
          gh run download "$run" -n "$name" -D target/release
          chmod +x target/release/ply
          touch target/release/ply target/release/ply.d
          echo "reused=true" >> "$GITHUB_OUTPUT"
          echo "$name came back from run $run"
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # v1
        if: steps.reuse.outputs.reused != 'true'
        with:
          toolchain: "1.93.1"
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        if: steps.reuse.outputs.reused != 'true'
        with:
          save-if: ${{ github.ref_name == github.event.repository.default_branch }}
      - uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
        if: steps.reuse.outputs.reused != 'true'
      - name: cargo build --locked --release -p ply-launcher --bin ply
        if: steps.reuse.outputs.reused != 'true'
        run: cargo build --locked --release -p ply-launcher --bin ply

      # A cache rather than an artifact: every suite job wants these two files, and the artifact
      # service is the one part of a run that fails on its own.
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: tcc
        with:
          path: tcc
          key: tcc-${{ runner.os }}-${{ runner.arch }}
      - name: tcc's packages, for this job's self-test and the jobs that run the archive
        if: steps.tcc.outputs.cache-hit != 'true'
        run: .github/ci-tcc.sh harvest
      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: steps.tcc.outputs.cache-hit != 'true'
        with:
          path: tcc
          key: tcc-${{ runner.os }}-${{ runner.arch }}

      # The self-test below is the run's first `ply`, and a first `ply` emits the emitter's own
      # unit and compiles it with whatever `Profile::Development` finds — `cc -O0` when tcc is
      # absent. Installed here it is tcc, the compiler every suite job compiles that unit with, so
      # the emitted stage and the objects this job writes are the ones they read.
      - name: tcc, the development profile's C compiler
        run: .github/ci-tcc.sh install

      # The self-test's first `ply` is minutes of emitting and compiling. A tree whose sources
      # have not moved has both from an earlier run; against any other tree the buckets of emitted
      # C that did not move are already built, which is most of them.
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: stage-cache
        with:
          path: |
            /tmp/ply-c-cache
            /tmp/ply-c-stage
          key: ply-c-stage-sources-${{ hashFiles('crates/*/src/**', 'crates/*/Cargo.toml', 'Cargo.lock', 'crates/*/ply/**') }}
          restore-keys: ply-c-stage-
      # Before this job's first `ply`, so what it reads is newer than this and the rest is not.
      - name: The moment this job's `ply`s start
        run: touch /tmp/ply-c-used.mark

      # Here rather than in a later job: it compares mtimes, and a later checkout is newer than the binary.
      - name: The freshness check can still go red
        run: .github/binary-is-current.sh --self-test
      - name: The binary is built from this tree
        run: .github/binary-is-current.sh target/release/ply
      # The check above needs the `ply` program but not the emitter, which a restored `ply`
      # program never asks for: without this, every later job's first compiles built it again.
      - name: The emitter, for every job after this one
        run: .github/ci-warm.sh target/release/ply
      # Every job restores what this one saves, so it saves what this job's `ply`s read and wrote.
      - name: The stage, cut to what this job used
        if: steps.stage-cache.outputs.cache-hit != 'true'
        run: .github/ci-warm.sh used /tmp/ply-c-used.mark
      # What those `ply`s emitted, for the rest of the run: the suite jobs restore it rather than
      # repeat the emission. On main it is saved under the tree's own key, which a later run
      # restores, so main's next pull requests find it as soon as this job ends; a pull request's
      # entries reach no other run, so it saves under the run's. Nothing was emitted when the
      # restore above hit the tree's own key, and the suite jobs find that key themselves.
      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: steps.stage-cache.outputs.cache-hit != 'true' && github.event_name == 'push'
        with:
          path: |
            /tmp/ply-c-cache
            /tmp/ply-c-stage
          key: ply-c-stage-sources-${{ hashFiles('crates/*/src/**', 'crates/*/Cargo.toml', 'Cargo.lock', 'crates/*/ply/**') }}
      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: steps.stage-cache.outputs.cache-hit != 'true' && github.event_name != 'push'
        with:
          path: |
            /tmp/ply-c-cache
            /tmp/ply-c-stage
          key: ply-c-stage-emitter-${{ github.run_id }}

      # For `refresh`, the one job that runs this binary.
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: github.event_name == 'push'
        with:
          name: ply
          path: target/release/ply
          retention-days: 1
          if-no-files-found: error
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: github.event_name == 'pull_request'
        with:
          name: ply-${{ steps.tree.outputs.tree }}
          path: |
            target/release/ply
            target/release/ply.d
          retention-days: 2
          if-no-files-found: error

  # Nextest needs the archive and nothing `build-ply` makes, so it starts once `build` ends, on
  # runners of its own: the corpus lanes have theirs to themselves.
  # After `build-ply`, whose stage it restores: a run that changed the compiler would otherwise have
  # each shard emit the emitter's stage itself, minutes of a runner the lanes are queued for.
  nextest:
    name: nextest ${{ matrix.shard }}/${{ matrix.of }}
    needs: [plan, build, build-ply]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.nextest) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: needs.plan.outputs.shards == 'true'
        with:
          path: /tmp/ply-shards
          key: test-shards-${{ github.run_id }}
          fail-on-cache-miss: true
      - uses: ./.github/actions/suite
      # What this shard's tests compiled and asked of the compiler on its last run: bodies, objects
      # and answers are each kept under what decides them, so one still current is read back.
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: /tmp/ply-c-nextest
          key: ply-c-nextest-${{ matrix.shard }}-${{ github.run_id }}
          restore-keys: |
            ply-c-nextest-${{ matrix.shard }}-
            ply-c-nextest-
      - name: What this shard's last run compiled and asked
        run: |
          set -euo pipefail
          .github/ci-corpus.sh restore /tmp/ply-c-nextest
          .github/ci-corpus.sh mark

      # A shard's profile names the tests it runs, except the catch-all's, which is the negation of
      # every other shard: a test the durations do not name runs there, and only there.
      # The awk strips colour first: nextest colours its summary line. A golden that moved is
      # blessed rather than failed: the diff goes to the job summary, and `refresh` commits it on main.
      - name: cargo nextest run
        id: run
        env:
          SHARD: ${{ matrix.shard }}
          OF: ${{ matrix.of }}
          SHARDS: ${{ needs.plan.outputs.shards }}
          PLY_DIFF_BLESS: "1"
        run: |
          set -euo pipefail
          exclude=$(.github/ci-shards.sh exclude-filter)
          [ -n "$exclude" ] || { echo "the exclude filter is empty" >&2; exit 1; }
          config=/tmp/ply-shards/shard-$SHARD.toml
          if [ "$SHARDS" = true ]; then
            [ -f "$config" ] || { echo "the plan cut the shards and $config did not come back" >&2; exit 1; }
            profile=shard$SHARD
            cut=(--profile "$profile" --tool-config-file "shards:$config")
          else
            profile=default
            cut=(--partition "slice:$SHARD/$OF")
          fi
          cargo-nextest nextest run \
            --binaries-metadata target/nextest/binaries-metadata.json \
            --cargo-metadata target/nextest/cargo-metadata.json \
            --workspace-remap "$GITHUB_WORKSPACE" --target-dir-remap "$GITHUB_WORKSPACE/target" \
            --no-fail-fast "${cut[@]}" \
            -E "not ($exclude)" 2>&1 | tee /tmp/shard.log || nextest=$?
          [ "${nextest:-0}" -eq 0 ] || exit "$nextest"
          ran=$(awk '
            { gsub(/\033\[[0-9;]*m/, "") }
            /^ *Summary \[/ { for (i = 1; i <= NF; i++) if ($i == "tests" || $i == "test") { n = $(i - 1) } }
            END { print n + 0 }
          ' /tmp/shard.log)
          echo "shard $SHARD ran $ran tests"
          [ "$ran" -gt 0 ] || { echo "the shard ran no tests at all" >&2; exit 1; }
          echo "profile=$profile" >> "$GITHUB_OUTPUT"
          echo "ran=$ran" >> "$GITHUB_OUTPUT"

      # What the next run cuts its shards from.
      - name: The durations this shard measured
        env:
          SHARD: ${{ matrix.shard }}
          PROFILE: ${{ steps.run.outputs.profile }}
          RAN: ${{ steps.run.outputs.ran }}
        run: |
          set -euo pipefail
          .github/ci-shards.sh durations "target/nextest/$PROFILE/junit.xml" > "/tmp/timings-nextest-$SHARD.tsv"
          lines=$(grep -c . "/tmp/timings-nextest-$SHARD.tsv" || true)
          [ "$lines" -eq "$RAN" ] || {
            echo "the report has $lines durations and the shard ran $RAN tests" >&2
            exit 1
          }
          echo "$lines durations"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: timings-nextest-${{ matrix.shard }}
          path: /tmp/timings-nextest-${{ matrix.shard }}.tsv
          retention-days: 1
          if-no-files-found: error

      - name: What this shard compiled and asked
        if: ${{ !cancelled() }}
        run: .github/ci-corpus.sh keep /tmp/ply-c-nextest
      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: ${{ !cancelled() }}
        with:
          path: /tmp/ply-c-nextest
          key: ply-c-nextest-${{ matrix.shard }}-${{ github.run_id }}

      - name: Goldens that moved
        if: always()
        run: |
          set -euo pipefail
          git add -N crates/ply-codegen-tests/fixtures/goldens
          git diff --quiet -- crates/ply-codegen-tests/fixtures/goldens && exit 0
          {
            echo "### Goldens this partition re-blessed"
            echo '```'
            git diff --stat -- crates/ply-codegen-tests/fixtures/goldens
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          git diff --stat -- crates/ply-codegen-tests/fixtures/goldens

  # The corpus runs a partition takes, each lane a process beside the others.
  lanes:
    name: lanes ${{ matrix.shard }}/${{ matrix.of }}
    # The stage is a cache, not an input: a partition restores the emitter's own key from
    # `build-ply`, so it does not wait the emitter's whole stage out. On a pull request, where
    # `refresh` does not run, this is the run's critical path.
    needs: [plan, build, build-ply]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.partitions) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: needs.plan.outputs.shards == 'true'
        with:
          path: /tmp/ply-shards
          key: test-shards-${{ github.run_id }}
          fail-on-cache-miss: true
      - uses: ./.github/actions/suite
      # The C every partition compiled and read last run, which `passes` made one: without it a
      # lane's first `ply test` emits its package's whole unit before its first test.
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: lanes-c
        with:
          path: /tmp/ply-c-lanes
          key: ply-c-lanes-${{ github.run_id }}
          restore-keys: ply-c-lanes-
      # A partition no run has kept C for starts from what main's corpus jobs kept.
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: steps.lanes-c.outputs.cache-matched-key == ''
        with:
          path: /tmp/ply-c-corpus
          key: ply-c-corpus-
          restore-keys: ply-c-corpus-
      - name: The lanes' compiled C, merged under the stage
        run: |
          .github/ci-corpus.sh restore /tmp/ply-c-lanes
          .github/ci-corpus.sh restore /tmp/ply-c-corpus
          .github/ci-corpus.sh mark
      # Passes earlier runs published, each filed under the runtime stamp that earned it.
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: /tmp/ply-upstream
          key: ply-upstream-${{ github.run_id }}
          restore-keys: ply-upstream-
      - name: The passes this partition starts from
        run: .github/ci-corpus.sh upstream-mark
      # Each package's front-end store as the last partition to load it left it.
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            crates/ply-cli/ply/.ply-cache
            crates/ply-corpus/checks/.ply-cache
            crates/ply-corpus/ply/.ply-cache
            crates/ply-cli-tests/ply/.ply-cache
            crates/ply-prove/ply/.ply-cache
            crates/ply-sim/ply/.ply-cache
            crates/ply-store/ply/.ply-cache
            crates/ply-test/ply/.ply-cache
          key: ply-stores-lanes-${{ github.run_id }}
          restore-keys: |
            ply-stores-lanes-
            ply-stores-

      - name: The corpus runs this partition takes
        env:
          SHARD: ${{ matrix.shard }}
          SHARDS: ${{ needs.plan.outputs.shards }}
        run: |
          set -euo pipefail
          plan=()
          if [ "$SHARDS" = true ]; then plan=(/tmp/ply-shards); fi
          .github/ci-corpus.sh partition "$SHARD" "/tmp/timings-lanes-$SHARD.tsv" "${plan[@]}"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ !cancelled() }}
        with:
          name: timings-lanes-${{ matrix.shard }}
          path: /tmp/timings-lanes-${{ matrix.shard }}.tsv
          retention-days: 1
          if-no-files-found: error

      # Even from a red job: a pass is a fact about its test.
      - name: The passes this partition published
        if: ${{ !cancelled() }}
        run: .github/ci-corpus.sh upstream-new "/tmp/upstream-${{ matrix.shard }}.tar"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ !cancelled() }}
        with:
          name: upstream-${{ matrix.shard }}
          path: /tmp/upstream-${{ matrix.shard }}.tar
          retention-days: 1
          if-no-files-found: error
      # What the lanes compiled or read and the stores they wrote, which `passes` makes one with
      # every other partition's for the next run.
      - name: What the lanes compiled, and the stores they wrote
        if: ${{ !cancelled() }}
        run: .github/ci-corpus.sh pack "/tmp/kept-lanes-${{ matrix.shard }}.tar"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ !cancelled() }}
        with:
          name: kept-lanes-${{ matrix.shard }}
          path: /tmp/kept-lanes-${{ matrix.shard }}.tar
          retention-days: 1
          if-no-files-found: error

  # Not part of `ci`: a cache that could not be saved makes no run wrong.
  passes:
    name: the passes this run published, and what its tests cost
    if: ${{ !cancelled() }}
    needs: [nextest, lanes, corpus]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      actions: write
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: /tmp/ply-upstream
          key: ply-upstream-${{ github.run_id }}
          restore-keys: ply-upstream-
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: upstream-*
          merge-multiple: true
          path: /tmp/upstream-parts
      - name: Every job's passes in one upstream
        run: .github/ci-corpus.sh upstream-merge /tmp/upstream-parts
      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: /tmp/ply-upstream
          key: ply-upstream-${{ github.run_id }}

      # Every partition's C and the stores it wrote, as one entry each that every partition of the
      # next run restores: the cut moves runs between partitions as the durations move, and a
      # partition holding only its own last run's would load and emit a package it was just given
      # from nothing. A store no partition wrote this run stays as the last run left it.
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            crates/ply-cli/ply/.ply-cache
            crates/ply-corpus/checks/.ply-cache
            crates/ply-corpus/ply/.ply-cache
            crates/ply-cli-tests/ply/.ply-cache
            crates/ply-prove/ply/.ply-cache
            crates/ply-sim/ply/.ply-cache
            crates/ply-store/ply/.ply-cache
            crates/ply-test/ply/.ply-cache
          key: ply-stores-lanes-${{ github.run_id }}
          restore-keys: ply-stores-lanes-
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: kept-lanes-*
          path: /tmp/kept-lanes
      - name: Every partition's C and stores as one
        id: kept
        run: |
          set -euo pipefail
          .github/ci-corpus.sh unpack /tmp/kept-lanes /tmp/ply-c-lanes
          if [ -n "$(find /tmp/ply-c-lanes -type f -print -quit)" ]; then echo "c=true" >> "$GITHUB_OUTPUT"; fi
          if [ -n "$(find crates -path '*/.ply-cache/*' -type f -print -quit)" ]; then echo "stores=true" >> "$GITHUB_OUTPUT"; fi
      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: steps.kept.outputs.c == 'true'
        with:
          path: /tmp/ply-c-lanes
          key: ply-c-lanes-${{ github.run_id }}
      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: steps.kept.outputs.stores == 'true'
        with:
          path: |
            crates/ply-cli/ply/.ply-cache
            crates/ply-corpus/checks/.ply-cache
            crates/ply-corpus/ply/.ply-cache
            crates/ply-cli-tests/ply/.ply-cache
            crates/ply-prove/ply/.ply-cache
            crates/ply-sim/ply/.ply-cache
            crates/ply-store/ply/.ply-cache
            crates/ply-test/ply/.ply-cache
          key: ply-stores-lanes-${{ github.run_id }}

      # The table the next run cuts its shards from, from every shard, partition and desk runner, so a
      # run that went red leaves the last whole one in place rather than a table missing whatever did
      # not report. A pull request writes one too, into its own cache: a branch cuts by what its own
      # tree measured, and main is never cut by a branch's.
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: needs.nextest.result == 'success' && needs.lanes.result == 'success' && needs.corpus.result == 'success'
        with:
          path: /tmp/ply-test-timings
          key: test-timings-${{ github.run_id }}
          restore-keys: test-timings-
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        if: needs.nextest.result == 'success' && needs.lanes.result == 'success' && needs.corpus.result == 'success'
        with:
          pattern: timings-*
          merge-multiple: true
          path: /tmp/ply-timings-parts
      - name: One duration per test
        id: timings
        if: needs.nextest.result == 'success' && needs.lanes.result == 'success' && needs.corpus.result == 'success'
        run: |
          set -euo pipefail
          before=/tmp/ply-timings-before.tsv
          rm -f "$before"
          if [ -f /tmp/ply-test-timings/timings.tsv ]; then mv /tmp/ply-test-timings/timings.tsv "$before"; fi
          mkdir -p /tmp/ply-test-timings
          find /tmp/ply-timings-parts -name '*.tsv' -exec cat {} + |
            .github/ci-shards.sh timings "$before" > /tmp/ply-test-timings/timings.tsv
          lines=$(grep -c . /tmp/ply-test-timings/timings.tsv || true)
          [ "$lines" -gt 0 ] || { echo "no durations came back from the partitions" >&2; exit 1; }
          echo "$lines test durations"
      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: steps.timings.outcome == 'success'
        with:
          path: /tmp/ply-test-timings
          key: test-timings-${{ github.run_id }}

      # Whatever the table came to: a family keeps its entries unless this run saved one.
      - name: The entries this run's replaced
        if: ${{ !cancelled() }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = pull_request ] &&
             [ "${{ github.event.pull_request.head.repo.full_name }}" != "${{ github.repository }}" ]; then
            echo "a fork's pull request cannot write this repository's caches"
            exit 0
          fi
          .github/ci-shards.sh supersede "${{ github.run_id }}" "${{ github.ref }}"

  # On main only: the bundle the sources are a fixpoint of, the `ply fmt` program they build, and
  # the goldens they produce are committed back, so no pull request carries any of them and two of
  # them never conflict on them.
  # A push by the workflow's own token starts no run, so the commit is the tree the run tested
  # plus what that run emitted.
  refresh:
    name: refresh the bundle, the fmt program and the goldens
    if: github.event_name == 'push'
    needs: [plan, build, build-ply]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: true
      - uses: ./.github/actions/suite
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ply
          path: target/release
      - name: Emit the bundle and the `ply` program, and bless the goldens
        run: |
          set -euo pipefail
          chmod +x target/release/ply
          target/release/ply bootstrap crates/ply-compiler/ply --out crates/ply-compiler/bootstrap
          target/release/ply build crates/ply-cli/ply --entry ply.main \
            -o crates/ply-cli/bootstrap/ply.plyx --stamp crates/ply-cli/bootstrap/ply.digest
          PLY_DIFF_BLESS=1 cargo-nextest nextest run \
            --binaries-metadata target/nextest/binaries-metadata.json \
            --cargo-metadata target/nextest/cargo-metadata.json \
            --workspace-remap "$GITHUB_WORKSPACE" --target-dir-remap "$GITHUB_WORKSPACE/target" \
            --no-fail-fast -E 'binary_id(ply-codegen-tests::goldens)'
      # The digest covers everything the build reads, so bytes that moved under it are a build that
      # is not a function of its sources, which committing them would hide.
      - name: The program moved only with its digest
        run: |
          set -euo pipefail
          git diff --quiet -- crates/ply-cli/bootstrap/ply.digest || exit 0
          git diff --quiet -- crates/ply-cli/bootstrap/ply.plyx || {
            echo "ply.plyx changed while ply.digest did not: the build is not a function of its sources" >&2
            exit 1
          }
      - name: Commit what moved
        run: |
          set -euo pipefail
          git add crates/ply-compiler/bootstrap crates/ply-cli/bootstrap crates/ply-codegen-tests/fixtures/goldens
          git diff --cached --quiet && { echo "the bundle, the program and the goldens already match main"; exit 0; }
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m 'The goldens, bundle and ply program CI emitted for these sources'
          # Main may have moved under this run; the next run on main refreshes for both, and a
          # prose-only merge starts none.
          git pull --rebase origin main || { git rebase --abort; echo "main moved; the next run refreshes"; exit 0; }
          git push origin HEAD:main || echo "main moved; the next run refreshes"

  # Tests that must be seen to run: the tree checks, by name.
  # The gate tests, then the host packages, whose tests bind sockets and processes, then each solo
  # test, which takes every test thread: one runner after another rather than a runner each, beside
  # the lanes that wait for runners.
  gates:
    name: test gates, the host packages and the solo tests
    needs: [plan, build, build-ply]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/suite

      - name: cargo nextest run
        run: |
          set -euo pipefail
          filter=$(.github/ci-shards.sh gate-filter)
          cargo-nextest nextest run \
            --binaries-metadata target/nextest/binaries-metadata.json \
            --cargo-metadata target/nextest/cargo-metadata.json \
            --workspace-remap "$GITHUB_WORKSPACE" --target-dir-remap "$GITHUB_WORKSPACE/target" \
            --no-fail-fast -E "$filter" 2>&1 | tee /tmp/gates.log

      - name: Every tree check ran
        run: |
          set -euo pipefail
          ran=0
          while read -r package target test; do
            if [ "$target" = lib ]; then id=$package; else id="$package::$target"; fi
            awk -v id="$id" -v test="$test" '
              { gsub(/\033\[[0-9;]*m/, "") }
              $1 == "PASS" && $NF == test && $(NF - 1) == id { found = 1 }
              END { exit !found }
            ' /tmp/gates.log || {
              echo "'$id $test' did not run: the table names a test the binary does not have" >&2
              exit 1
            }
            ran=$((ran + 1))
          done < <(.github/ci-shards.sh tree-checks)
          echo "$ran tree checks ran"
          [ "$ran" -gt 0 ] || { echo "the table is empty" >&2; exit 1; }

      # On the merge with main, not only the branch: two changes that each re-pinned their own tree
      # leave main's lock stale, and main's refresh is the first build that verifies it. Here, beside
      # the partitions, rather than in `build-ply`, whose end every partition waits on.
      - name: Every lockfile pins this tree
        if: ${{ !cancelled() }}
        run: |
          set -euo pipefail
          locks=$(git ls-files '*ply.lock')
          for lock in $locks; do target/debug/ply resolve "$(dirname "$lock")" >/dev/null; done
          git diff --exit-code -- $locks || { echo "a ply.lock does not pin these sources: run 'ply resolve' on it" >&2; exit 1; }

      - name: cargo nextest run, the host packages
        if: ${{ !cancelled() }}
        run: |
          set -euo pipefail
          filter=$(.github/ci-shards.sh host-filter)
          cargo-nextest nextest run \
            --binaries-metadata target/nextest/binaries-metadata.json \
            --cargo-metadata target/nextest/cargo-metadata.json \
            --workspace-remap "$GITHUB_WORKSPACE" --target-dir-remap "$GITHUB_WORKSPACE/target" \
            --no-fail-fast --success-output immediate -E "$filter"

      - name: cargo nextest run, each solo test alone
        if: ${{ !cancelled() }}
        run: |
          set -euo pipefail
          for id in $(.github/ci-shards.sh solo-matrix | jq -r '.include[].id'); do
            filter=$(.github/ci-shards.sh solo-filter "$id")
            cargo-nextest nextest run \
              --binaries-metadata target/nextest/binaries-metadata.json \
              --cargo-metadata target/nextest/cargo-metadata.json \
              --workspace-remap "$GITHUB_WORKSPACE" --target-dir-remap "$GITHUB_WORKSPACE/target" \
              -E "$filter" 2>&1 | tee /tmp/solo.log
            ran=$(awk '
              { gsub(/\033\[[0-9;]*m/, "") }
              /^ *Summary \[/ { for (i = 1; i <= NF; i++) if ($i == "tests" || $i == "test") { n = $(i - 1) } }
              END { print n + 0 }
            ' /tmp/solo.log)
            [ "$ran" -eq 1 ] || { echo "solo test '$id' selected $ran tests rather than one: the table names a test the binary does not have" >&2; exit 1; }
          done

  # The Ply runs that would starve a partition, on runners of their own (`ci-shards.sh corpus-matrix`):
  # the corpus's checks that start desks under load, cut by duration over the `desks-<k>` runners,
  # which spawn this run's `ply` over desks and floors with the grants `benches/corpus.sh` gives the
  # program, and the CLI suite's `cli-` runs that take every core, a runner each. Postgres beside them
  # holds the desk's schema, and the database checks are handed its URL as `CORPUS_DB`.
  corpus:
    name: test corpus ${{ matrix.id }}
    needs: [plan, build, build-ply]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.corpus) }}
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: desk
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: needs.plan.outputs.shards == 'true' && startsWith(matrix.id, 'desks-')
        with:
          path: /tmp/ply-shards
          key: test-shards-${{ github.run_id }}
          fail-on-cache-miss: true
      - uses: ./.github/actions/suite
      # The C main's corpus runs compiled (`ci-corpus.sh keep`): without it a lane's first `ply test`
      # emits the checks package's whole closure, the compiler's included, before its first check.
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: /tmp/ply-c-corpus
          key: ply-c-corpus-${{ matrix.id }}-${{ hashFiles('crates/*/src/**', 'crates/*/Cargo.toml', 'Cargo.lock', 'crates/*/ply/**') }}
          restore-keys: |
            ply-c-corpus-${{ matrix.id }}-
            ply-c-corpus-
      - name: The corpus's compiled C, merged under the stage
        run: .github/ci-corpus.sh restore /tmp/ply-c-corpus
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: /tmp/ply-upstream
          key: ply-upstream-${{ github.run_id }}
          restore-keys: ply-upstream-
      - name: The passes this job starts from
        run: .github/ci-corpus.sh upstream-mark
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            crates/ply-cli/ply/.ply-cache
            crates/ply-corpus/checks/.ply-cache
            crates/ply-corpus/ply/.ply-cache
            crates/ply-cli-tests/ply/.ply-cache
            crates/ply-prove/ply/.ply-cache
            crates/ply-sim/ply/.ply-cache
            crates/ply-store/ply/.ply-cache
            crates/ply-test/ply/.ply-cache
          key: ply-stores-corpus-${{ matrix.id }}-${{ github.run_id }}
          restore-keys: |
            ply-stores-corpus-${{ matrix.id }}-
            ply-stores-
      - name: The moment this job's compiling starts
        run: .github/ci-corpus.sh mark
      - name: psql, and the libpq the floor links
        if: ${{ !startsWith(matrix.id, 'cli-') }}
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client libpq-dev
      - name: The desk's schema
        if: ${{ !startsWith(matrix.id, 'cli-') }}
        run: psql -v ON_ERROR_STOP=1 -q -h 127.0.0.1 -U postgres -d desk -f examples/desk.sql
      # Built as `benches/corpus.sh` builds them; the checks ask `process.bound` for each.
      - name: The floors the served tables are compared with
        if: ${{ !startsWith(matrix.id, 'cli-') }}
        run: |
          set -euo pipefail
          cc -O2 -o target/http-floor benches/http-floor/floor.c -lpthread
          cc -O2 -o target/pg-floor benches/pg-floor/pg.c -I"$(pg_config --includedir)" -L"$(pg_config --libdir)" -lpq
      # A check may take minutes and make any number of calls; a quarter of an hour abandons one.
      - name: ply test
        env:
          ID: ${{ matrix.id }}
          SHARDS: ${{ needs.plan.outputs.shards }}
        run: |
          set -euo pipefail
          case "$ID" in
            cli-*) .github/ci-corpus.sh run "$ID" ;;
            desks-*)
              cut=
              if [ "$SHARDS" = true ]; then cut=/tmp/ply-shards; fi
              .github/ci-corpus.sh desks "${ID#desks-}" "/tmp/timings-$ID.tsv" "$cut" \
                --exec "http_floor=$PWD/target/http-floor" --exec "pg_floor=$PWD/target/pg-floor" \
                --set CORPUS_DB=postgres://postgres@127.0.0.1:5432/desk ;;
            *) echo "no corpus job runs '$ID'" >&2; exit 1 ;;
          esac
      # What the next run cuts the desk runners from.
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ !cancelled() && startsWith(matrix.id, 'desks-') }}
        with:
          name: timings-${{ matrix.id }}
          path: /tmp/timings-${{ matrix.id }}.tsv
          retention-days: 1
          if-no-files-found: error
      - name: The passes this job published
        if: ${{ !cancelled() }}
        run: .github/ci-corpus.sh upstream-new "/tmp/upstream-corpus-${{ matrix.id }}.tar"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ !cancelled() }}
        with:
          name: upstream-corpus-${{ matrix.id }}
          path: /tmp/upstream-corpus-${{ matrix.id }}.tar
          retention-days: 1
          if-no-files-found: error
      - name: The stores, compacted
        if: ${{ !cancelled() }}
        run: .github/ci-corpus.sh compact
      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: ${{ !cancelled() }}
        with:
          path: |
            crates/ply-cli/ply/.ply-cache
            crates/ply-corpus/checks/.ply-cache
            crates/ply-corpus/ply/.ply-cache
            crates/ply-cli-tests/ply/.ply-cache
            crates/ply-prove/ply/.ply-cache
            crates/ply-sim/ply/.ply-cache
            crates/ply-store/ply/.ply-cache
            crates/ply-test/ply/.ply-cache
          key: ply-stores-corpus-${{ matrix.id }}-${{ github.run_id }}
      # From main, what this run compiled, for every later run's corpus lanes.
      - name: What this run compiled
        if: github.event_name == 'push'
        run: .github/ci-corpus.sh keep /tmp/ply-c-corpus
      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: github.event_name == 'push'
        with:
          path: /tmp/ply-c-corpus
          key: ply-c-corpus-${{ matrix.id }}-${{ hashFiles('crates/*/src/**', 'crates/*/Cargo.toml', 'Cargo.lock', 'crates/*/ply/**') }}

  # The one check that says a run is green. What a run parks in the cache for its own jobs -- the archive every
  # partition unpacks, the emitter's stage, the shard cut -- is keyed by the run id, so no later run
  # can read it, and left behind it evicts the object cache that does outlive a run. A green run
  # gives them back here, after every job that reads them; a red one keeps them, because the next
  # thing that happens to it is a re-run, and a job re-run on its own cannot rebuild the archive.
  ci:
    name: CI
    if: always()
    needs: [plan, clippy, build, build-ply, nextest, lanes, gates, corpus, refresh]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: write
      contents: read
    steps:
      - name: Every job succeeded
        env:
          EVENT: ${{ github.event_name }}
        run: |
          set -euo pipefail
          echo '${{ toJSON(needs) }}' > /tmp/needs.json
          cat /tmp/needs.json
          # `refresh` runs on main only.
          not_ok=$(jq -r --arg event "$EVENT" '
            to_entries[]
            | select(.value.result != "success")
            | select(($event == "pull_request" and .value.result == "skipped"
                and .key == "refresh") | not)
            | "\(.key) = \(.value.result)"
          ' /tmp/needs.json)
          if [ -n "$not_ok" ]; then
            echo "$not_ok" >&2
            exit 1
          fi
          echo "fmt, clippy and the whole test suite are green."

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Give back the entries this run wrote for its own jobs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # A fork's pull request holds no `actions: write` here: it cannot give back what it wrote.
          if [ "${{ github.event_name }}" = pull_request ] &&
             [ "${{ github.event.pull_request.head.repo.full_name }}" != "${{ github.repository }}" ]; then
            echo "a fork's pull request cannot write this repository's caches"
            exit 0
          fi
          .github/ci-shards.sh give-back "${{ github.run_id }}"
