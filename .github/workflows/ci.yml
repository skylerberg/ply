# The three commands in CONTRIBUTING.md §"The loop", run on every pull request
# and every push to `main`, with the gates that skip silently forced open.
#
# **The suite is built once and run by many jobs at once.** A run's wall clock
# used to be one shard's compile plus ten minutes of that shard's tests, because
# each shard compiled its own packages and then ran every test it had, and the
# two longest held twenty tests of a minute or more each. Now `build` compiles
# every workspace member into a nextest archive and the test binary, and every
# other job downloads that: `test` runs a slice of the suite, `solo` runs one
# test that has to run alone on a runner of its own, `gates` runs the checks
# that have to be seen to run, and `test-postgres` runs what needs a server,
# `examples/same-tests.sh` among it. The binary that script drives is a
# release `ply`, built beside the archive
# by `build-ply` (argued there). A green run is the build
# plus the slowest of those, and the tables that cut them are in
# `.github/ci-shards.sh`, where `verify` keeps them total.
#
# Each decision here is argued where it is made:
#
#   * `fmt` and `clippy` do NOT gate the expensive jobs; everything starts at
#     once and the `ci` aggregate is where lint is required. `gh pr checks
#     --watch --fail-fast` exits at the first failed check, so a formatting
#     slip surfaces when `fmt` finishes, and the doomed run costs runner minutes
#     rather than anyone's time until the fix is pushed and the concurrency
#     group cancels it. Rejected: a cancel-on-lint-failure step, which needs
#     `actions: write`, a permission this file deliberately withholds.
#
#     Lint stays required either way: the `ci` job compares every `needs`
#     result against `success` under `if: always()`, so a red or skipped `fmt`
#     or `clippy` is a red check and never a green tick over nothing run.
#   * `push` filtered to the default branch, so a commit on a PR branch runs CI
#     once rather than twice. Argued at the `on:` block.
#   * `[profile.dev] opt-level = 2`, which is set in the root `Cargo.toml` and
#     not here, is the single largest thing deciding what the build costs. That
#     manifest's profile block carries the measurement and what was rejected.
#   * every `rust-cache` key hashes the manifests, and that is a repair rather
#     than a precaution. `rust-cache` keys on `Cargo.lock`, which records
#     dependency *versions* and not the `[profile]` blocks or the features a
#     member asks for -- both inputs to every dependency's fingerprint. Change
#     one and the key does not move: the restore hands back artifacts cargo
#     rejects as stale, and the post step sees a key that already exists and
#     saves nothing. `df32f9b` added `[profile.dev.package."*"] debug = false`
#     and every job on `main` paid a cold dependency build for hours. Hashing
#     the manifests mints a new key when a profile or a feature moves; a
#     stale-but-related cache is still restored by prefix.
#   * `ubuntu-24.04`, and only that. A Linux runner is what compiles
#     `crates/ply-cli-tests/tests/suite/w5_shutdown.rs` at all — it is `#![cfg(unix)]` —
#     and service containers are Linux-only. See the `test-postgres` job.
#   * a postgres service container *and* postgres binaries on `PATH`. Two
#     different gates want two different things and one does not satisfy the
#     other. See the `test-postgres` job.
#   * the self-hosted compiler and its differentials are workspace members --
#     `crates/ply-compiler` and `crates/ply-compiler-diff` -- so the archive
#     holds them like any other. They sat outside the workspace once, in no
#     job at all, and the differential went red for two days with nothing
#     saying so.
#
#     **What this workflow deliberately does NOT run:
#     `crates/ply-compiler-diff/tools/arm.sh --arm`**, the twenty-two mutations
#     that are the evidence the differential can go red at all. Each mutation
#     re-runs the whole comparison, for a property that changes only when the
#     parser's shape or the mutation table does, so it stays a by-hand
#     obligation listed in CONTRIBUTING.md §"The suite proves less than it
#     looks like it proves". If a mutation is ever found to have silently
#     stopped applying, that is the evidence this trade was wrong.
#   * the suite runs under `cargo nextest`, one process per test over every
#     binary, rather than under `cargo test`, which runs the binaries one after
#     another and lets one long test hold a whole binary's tail while the
#     runner idles. `.config/nextest.toml` is the configuration and
#     CONTRIBUTING.md §"The loop" names the same command for a developer.
#     Doctests are the one thing nextest does not run, so `clippy` runs
#     `cargo test --doc` over the workspace as well.
#   * no test asserts on a wall clock. A timing claim is asserted as a count
#     (allocations, copies, frames, entries) or not at all, because a count
#     does not depend on what else the runner is doing; the one bound that is
#     on a process rather than on the code, a simulated sleep that must not be
#     waited out, is a `slow-timeout` on that test in `.config/nextest.toml`.
#   * seven tree checks run a second time, by name, in `gates`. They already
#     ran in a partition; running them again by exact name is how "this check
#     still exists" becomes an exit code, because a check that stops running
#     reports nothing and reporting nothing looks like passing. "Tree check"
#     rather than "gate": a gate in the sense used below is a dependency that
#     makes a suite skip silently, which is a different thing.
#   * `toolchain: "1.93.1"`, pinned. `main` went red on 2026-08-25 on a clippy
#     lint a newer stable had added, with no change to the tree, while the
#     developer running the outer loop on 1.93.1 saw zero warnings. Pinning is
#     what makes CI and the outer loop see the same thing. The cost is that new
#     lints no longer arrive on their own: raise this pin deliberately, and fix
#     what the new toolchain reports in the same change. Only `build`, `clippy`
#     and `fmt` install a toolchain; the jobs that run the archive need none.
#
# What this workflow does NOT prove, stated here so nobody has to infer it from
# a green check:
#
#   * Nothing about macOS or Windows. A Windows leg would be green over an
#     empty binary, since the shutdown suite compiles to nothing there — the
#     exact failure this project is worst at. A macOS leg would be honest and
#     is not here.
#   * Nothing about the `ply-corpus w6` ladder. That is re-measurement rather
#     than verification, and `w6_report_integrity` already fails inside the
#     suite if the shipped ladder stops describing the tree.
#   * Nothing about the prose. One sentence of `README.md` is read by a test;
#     the rest is not, here or anywhere.
#   * Nothing about whether a diagnostic the armed check calls "armed" can fire.
#     `crates/ply-span-tests/tests/armed.rs` is lexical: it proves a construction
#     site exists in production source, never that the site is reachable. Its
#     header lists what that leaves out.

name: CI

# `push` is filtered to the default branch, and that is a fix rather than a
# narrowing. Unfiltered, a push to a branch with a PR open fired **both**
# triggers, and the `concurrency` group below could not collapse them: it keys
# on `github.ref`, which is `refs/heads/<branch>` for the push and
# `refs/pull/<n>/merge` for the pull_request, so the two runs are in different
# groups and neither cancels the other. Every branch commit ran the identical
# jobs twice. What a branch push checked, the pull_request run checks over the
# same commits; what this gives up is CI on a branch with no PR open yet.
on:
  push:
    branches: [main]
  pull_request:

# A superseded push has nothing left to prove.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # Incremental artifacts are per-machine scratch that no later job reuses, and
  # they are the largest thing a cache would otherwise carry. The root manifest
  # leaves incremental on for local builds; this is the one place it is off --
  # which is also what lets sccache stand in front of rustc.
  CARGO_INCREMENTAL: "0"
  RUST_BACKTRACE: "1"

jobs:
  plan:
    name: CI tables are total
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      partitions: ${{ steps.tables.outputs.partitions }}
      solo: ${{ steps.tables.outputs.solo }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The things a cut test suite can get wrong without anyone noticing: a
      # crate no member reaches, a test named in a table that nothing defines,
      # a probe with no required job. Each was watched to exit 1.
      - name: Every crate is built and every named test exists
        run: .github/ci-shards.sh verify

      - name: Emit the matrices
        id: tables
        run: |
          echo "partitions=$(.github/ci-shards.sh partitions)" >> "$GITHUB_OUTPUT"
          echo "solo=$(.github/ci-shards.sh solo-matrix)" >> "$GITHUB_OUTPUT"

  fmt:
    name: cargo fmt --all --check
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # v1
        with:
          toolchain: "1.93.1"
          components: rustfmt
      # No cache: this compiles nothing.
      - name: cargo fmt --all --check
        run: cargo fmt --all --check

  clippy:
    name: cargo clippy --workspace --all-targets
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # v1
        with:
          toolchain: "1.93.1"
          components: clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: clippy-${{ hashFiles('Cargo.toml', 'crates/*/Cargo.toml') }}
          save-if: ${{ github.ref_name == github.event.repository.default_branch }}
      # `-D warnings` is how "must be 0 warnings" becomes an exit code. Without
      # it clippy exits 0 with the warnings on stdout, and CONTRIBUTING.md's
      # requirement would be enforced by whoever happened to read the log.
      - run: cargo clippy --locked --workspace --all-targets -- -D warnings

      # nextest does not run doctests. There are none today, and this is what
      # says so if one appears and would otherwise never run. Here rather than
      # beside the archive because it is a second build of the libraries, and
      # this job is off the critical path.
      - name: cargo test --doc
        run: cargo test --locked --doc --workspace

  # The one compile. Everything below `test-postgres` inclusive runs what this
  # built, so the run's wall clock is this job plus the slowest of them.
  build:
    name: cargo nextest archive
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    # sccache, keyed on the content of every input to a rustc invocation, is
    # what makes a library that a change did not touch cost nothing to compile
    # again. `rust-cache` keeps the dependency artifacts by manifest hash; this
    # keeps the workspace's own libraries by content, which the mtime-based
    # freshness cargo applies to path dependencies cannot do across a fresh
    # checkout. Test and binary targets are compiled every time -- sccache does
    # not cache a crate that links -- and the profile keeps those at opt-level
    # 0, where they are cheap. Job-level, since only the jobs that install
    # sccache can name it as the wrapper.
    env:
      SCCACHE_GHA_ENABLED: "true"
      RUSTC_WRAPPER: sccache
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # v1
        with:
          toolchain: "1.93.1"
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: build-${{ hashFiles('Cargo.toml', 'crates/*/Cargo.toml') }}
          save-if: ${{ github.ref_name == github.event.repository.default_branch }}
      - uses: taiki-e/install-action@0758d235715de2f3551eacc980d9ae8fce9342c3 # v2.87.3
        with:
          tool: cargo-nextest@0.9.143
      - uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11

      # The same build the archive packages, with cargo's own account of where
      # its time went: `target/cargo-timings/cargo-timing.html`, one row per
      # unit, comes back as the `build-timings` artifact. This job is the run's
      # long pole, and a lever on it is worth taking only where the time is.
      - name: cargo test --workspace --no-run --timings
        run: cargo test --locked --workspace --no-run --timings
      # What sccache answered from the cache and what it compiled: the reading
      # that says whether a change to a leaf crate paid for the whole workspace.
      - name: sccache --show-stats
        run: sccache --show-stats
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: build-timings
          path: target/cargo-timings/cargo-timing.html
          retention-days: 7
          if-no-files-found: error

      # The workspace keeps full DWARF because `crates/ply-corpus`'s allocation
      # attribution reads inlined frames out of it (the root manifest's profile
      # block has the measurement), and every test binary links the workspace
      # -- so every binary carries a copy of debug information that only the
      # corpus's binaries read. Stripped from the rest, before the archive is
      # made: what a panic prints, the assertion's own file and line, is in
      # the message and not the DWARF, and a backtrace keeps its symbol names.
      - name: Strip the debug info no test reads
        run: |
          set -euo pipefail
          cargo nextest list --locked --workspace --list-type binaries-only --message-format json > /tmp/binaries.json
          python3 - <<'PY'
          import json, os, subprocess
          d = json.load(open("/tmp/binaries.json"))
          target = d["rust-build-meta"]["target-directory"]
          keep, strip = [], []
          for b in d["rust-binaries"].values():
              (keep if "ply-corpus" in b["package-id"] else strip).append(b["binary-path"])
          for package, bins in d["rust-build-meta"]["non-test-binaries"].items():
              for b in bins:
                  path = b["path"] if os.path.isabs(b["path"]) else os.path.join(target, b["path"])
                  (keep if b["name"] in ("w6-alloc", "ply-corpus") else strip).append(path)
          before = sum(os.path.getsize(p) for p in strip + keep)
          subprocess.run(["strip", "--strip-debug", *strip], check=True)
          after = sum(os.path.getsize(p) for p in strip + keep)
          print(f"{len(strip)} binaries stripped, {len(keep)} kept whole: {before} -> {after} bytes")
          PY

      # Every test binary of every member, the debug `ply` the CLI suite runs,
      # and the build-script outputs, in one file. Everything is fresh from
      # the step above, so this packages rather than compiles. The jobs below
      # extract it to the same path it was built at, so a path compiled into a
      # test binary is still the path it names.
      - name: cargo nextest archive --workspace
        run: cargo nextest archive --locked --workspace --archive-file nextest.tar.zst

      # The archive is forty-odd binaries that each carry the same libraries'
      # code and DWARF, and nextest's zstd sees a few megabytes at a time, so
      # it compresses every copy again. Recompressed with a window the size of
      # the whole tree, the copies deduplicate. Every job that unpacks it has to
      # say `--long=30` too: the window is part of the format.
      - name: Recompress the archive with a whole-tree window
        run: |
          set -euo pipefail
          before=$(stat -c %s nextest.tar.zst)
          zstd -d -c nextest.tar.zst | zstd -q -T0 -3 --long=30 -o nextest.long.tar.zst
          mv nextest.long.tar.zst nextest.tar.zst
          echo "archive: $before -> $(stat -c %s nextest.tar.zst) bytes"

      # Through the cache rather than as an artifact: an artifact downloads as
      # one stream, and one runner in a run was seen to take eighty seconds
      # over what the others took five for, while the cache restores in
      # parallel chunks. Keyed by run, so a job restores exactly this build;
      # an old run's archive is never asked for again and is the first thing
      # the cache's eviction takes.
      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: nextest.tar.zst
          key: nextest-archive-${{ github.run_id }}

  # The release `ply` the corpus scripts drive. Not the archive's debug one, on
  # purpose: the scripts time what they run, and a debug build's numbers say
  # nothing about the binary that ships.
  build-ply:
    name: cargo build --release -p ply-cli
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      SCCACHE_GHA_ENABLED: "true"
      RUSTC_WRAPPER: sccache
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # v1
        with:
          toolchain: "1.93.1"
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: ply-${{ hashFiles('Cargo.toml', 'crates/*/Cargo.toml') }}
          save-if: ${{ github.ref_name == github.event.repository.default_branch }}
      - uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
      - name: cargo build --locked --release -p ply-cli --bin ply
        run: cargo build --locked --release -p ply-cli --bin ply
      - name: sccache --show-stats
        run: sccache --show-stats

      # tcc, the development profile's C compiler, fetched once for every job
      # that runs the archive: `apt-get update` plus an install is a quarter
      # of a minute on each of them, and `dpkg -i` of the downloaded packages
      # is two seconds. `--download-only` leaves in the archives directory
      # exactly the packages this image does not already have.
      - name: tcc's packages, for the jobs that run the archive
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq --download-only tcc
          mkdir tcc
          cp /var/cache/apt/archives/*.deb tcc/
          ls tcc
      - name: tcc, for the measurement below
        run: sudo dpkg -i tcc/*.deb
      - name: What compiling a fresh trivial program costs, with the binary just built
        run: |
          set -euo pipefail
          d=$(mktemp -d)
          printf 'fn one() -> Int = 1\ntest "one" { assert_eq(one(), 1) }\n' > "$d/m.ply"
          "$GITHUB_WORKSPACE/target/release/ply" test "$d" --no-cache --json > /dev/null
          for n in 11 12 13; do
            printf 'fn one() -> Int = %s\ntest "one" { assert_eq(one(), %s) }\n' "$n" "$n" > "$d/m.ply"
            /usr/bin/time -f "%es wall, %MkB peak" "$GITHUB_WORKSPACE/target/release/ply" test "$d" --no-cache --json > /tmp/one.json
          done
          python3 -c 'import json; r = json.load(open("/tmp/one.json")); print(json.dumps(r.get("backend"), indent=1))'
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: tcc
          path: tcc/*.deb
          retention-days: 1
          if-no-files-found: error

      # `examples/same-tests.sh` refuses a binary that is not built from the
      # tree, and a freshness check nobody has watched fail is the same defect
      # one level up — so the check is driven red and green here, beside the
      # binary it is about, before it is relied on. `--self-test` touches no
      # tracked file. The check is here and not in `test-postgres` because it
      # compares clocks: a checkout made after this build would be newer than
      # the binary everywhere.
      - name: The freshness check can still go red
        run: .github/binary-is-current.sh --self-test
      - name: The binary is built from this tree
        run: .github/binary-is-current.sh target/release/ply

      # The dep-info goes with it: `examples/same-tests.sh` checks the binary
      # against its own sources and refuses one with no `.d` beside it.
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ply
          path: |
            target/release/ply
            target/release/ply.d
          retention-days: 1
          if-no-files-found: error

  # A slice of the suite. nextest deals the tests after the filter round-robin
  # across the partitions, so the long tests of one binary land in different
  # jobs rather than the same one. What the filter leaves out runs in the jobs
  # below, and `.github/ci-shards.sh exclude-filter` is the one statement of
  # that.
  test:
    name: test ${{ matrix.slice }}
    needs: [plan, build, build-ply]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.partitions) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/suite
        with:
          slot: part-${{ strategy.job-index }}

      # Two guards, both against a command that runs nothing and exits 0: the
      # filter is assigned before use so an empty one fails the step rather
      # than selecting everything, and the run has to have executed at least
      # one test, read out of nextest's own summary line. **`gsub` first: cargo
      # and nextest colour these lines**, and a pattern wanting a word followed
      # by a space matches nothing when the next byte is an escape.
      - name: cargo nextest run
        env:
          SLICE: ${{ matrix.slice }}
        run: |
          set -euo pipefail
          exclude=$(.github/ci-shards.sh exclude-filter)
          [ -n "$exclude" ] || { echo "the exclude filter is empty" >&2; exit 1; }
          cargo-nextest nextest run \
            --binaries-metadata target/nextest/binaries-metadata.json \
            --cargo-metadata target/nextest/cargo-metadata.json \
            --workspace-remap "$GITHUB_WORKSPACE" --target-dir-remap "$GITHUB_WORKSPACE/target" \
            --no-fail-fast --partition "slice:$SLICE" \
            -E "not ($exclude)" 2>&1 | tee /tmp/partition.log
          ran=$(awk '
            { gsub(/\033\[[0-9;]*m/, "") }
            /^ *Summary \[/ { for (i = 1; i <= NF; i++) if ($i == "tests" || $i == "test") { n = $(i - 1) } }
            END { print n + 0 }
          ' /tmp/partition.log)
          echo "partition $SLICE ran $ran tests"
          [ "$ran" -gt 0 ] || { echo "the partition ran no tests at all" >&2; exit 1; }
      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: github.ref == 'refs/heads/main'
        with:
          path: /tmp/ply-c-cache
          key: ply-c-cache-part-${{ strategy.job-index }}-${{ github.run_id }}

  # One test on one runner. Each of these is the longest test of a binary that
  # `.config/nextest.toml` runs with every thread and nothing beside it, so in
  # a partition they would run one after another and the partition would be
  # their sum.
  solo:
    name: test ${{ matrix.id }}
    needs: [plan, build, build-ply]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.solo) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/suite
        with:
          slot: solo-${{ matrix.id }}

      - name: cargo nextest run
        env:
          ID: ${{ matrix.id }}
        run: |
          set -euo pipefail
          filter=$(.github/ci-shards.sh solo-filter "$ID")
          cargo-nextest nextest run \
            --binaries-metadata target/nextest/binaries-metadata.json \
            --cargo-metadata target/nextest/cargo-metadata.json \
            --workspace-remap "$GITHUB_WORKSPACE" --target-dir-remap "$GITHUB_WORKSPACE/target" \
            -E "$filter" 2>&1 | tee /tmp/solo.log
          ran=$(awk '
            { gsub(/\033\[[0-9;]*m/, "") }
            /^ *Summary \[/ { for (i = 1; i <= NF; i++) if ($i == "tests" || $i == "test") { n = $(i - 1) } }
            END { print n + 0 }
          ' /tmp/solo.log)
          [ "$ran" -eq 1 ] || { echo "solo test '$ID' selected $ran tests rather than one: the table names a test the binary does not have" >&2; exit 1; }
      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: github.ref == 'refs/heads/main'
        with:
          path: /tmp/ply-c-cache
          key: ply-c-cache-solo-${{ matrix.id }}-${{ github.run_id }}

      # The bootstrap fixpoint went red: an emitter source changed and the
      # bundle is the old emitter's. The refresh is the fixpoint test itself,
      # run again from the unpacked archive, and the bundle it writes comes
      # back as an artifact so no local build is needed:
      #
      #   gh run download <run-id> -n bootstrap-bundle -D crates/ply-compiler/bootstrap
      - name: Refresh the bootstrap bundle
        id: refresh
        if: failure() && matrix.id == 'bootstrap'
        run: |
          set -euo pipefail
          filter=$(.github/ci-shards.sh solo-filter bootstrap)
          PLY_C_BOOTSTRAP_REFRESH=1 cargo-nextest nextest run \
            --binaries-metadata target/nextest/binaries-metadata.json \
            --cargo-metadata target/nextest/cargo-metadata.json \
            --workspace-remap "$GITHUB_WORKSPACE" --target-dir-remap "$GITHUB_WORKSPACE/target" \
            -E "$filter"
          echo "refreshed=true" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure() && steps.refresh.outputs.refreshed == 'true'
        with:
          name: bootstrap-bundle
          path: crates/ply-compiler/bootstrap
          retention-days: 7
          if-no-files-found: error

  # The tests that have to be *seen* to run: the unix-only shutdown suite,
  # which on any other host compiles to nothing and says nothing; and the tree
  # checks, by exact name. Each is asserted against nextest's own status lines,
  # so a name nothing defines any more turns this job red rather than quietly
  # reducing what CI checks.
  gates:
    name: test gates
    needs: [plan, build, build-ply]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/suite
        with:
          slot: gates

      - name: cargo nextest run
        run: |
          set -euo pipefail
          filter=$(.github/ci-shards.sh gate-filter)
          cargo-nextest nextest run \
            --binaries-metadata target/nextest/binaries-metadata.json \
            --cargo-metadata target/nextest/cargo-metadata.json \
            --workspace-remap "$GITHUB_WORKSPACE" --target-dir-remap "$GITHUB_WORKSPACE/target" \
            --no-fail-fast -E "$filter" 2>&1 | tee /tmp/gates.log

      # nextest prints one status line per test, `PASS [ … ] <binary id>
      # <module path>`; the module prefix is the file the test came from, so
      # `w5_shutdown::` is what a compiled-in `#![cfg(unix)]` module looks like
      # in the log.
      - name: Every tree check and the shutdown suite ran
        run: |
          set -euo pipefail
          ran=0
          while read -r package target test; do
            if [ "$target" = lib ]; then id=$package; else id="$package::$target"; fi
            awk -v id="$id" -v test="$test" '
              { gsub(/\033\[[0-9;]*m/, "") }
              $1 == "PASS" && $NF == test && $(NF - 1) == id { found = 1 }
              END { exit !found }
            ' /tmp/gates.log || {
              echo "'$id $test' did not run: the table names a test the binary does not have" >&2
              exit 1
            }
            ran=$((ran + 1))
          done < <(.github/ci-shards.sh tree-checks)
          echo "$ran tree checks ran"
          [ "$ran" -gt 0 ] || { echo "the table is empty" >&2; exit 1; }
          w5=$(awk '
            { gsub(/\033\[[0-9;]*m/, "") }
            $1 == "PASS" && $(NF - 1) == "ply-cli-tests::suite" && $NF ~ /^w5_shutdown::/ { n++ }
            END { print n + 0 }
          ' /tmp/gates.log)
          [ "$w5" -gt 0 ] || {
            echo "the log names no w5_shutdown test — #![cfg(unix)] compiled it away" >&2
            exit 1
          }
          echo "w5_shutdown: $w5 test(s) ran"
      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: github.ref == 'refs/heads/main'
        with:
          path: /tmp/ply-c-cache
          key: ply-c-cache-gates-${{ github.run_id }}

  test-postgres:
    name: test ply-host (postgres)
    needs: [build, build-ply]
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    # Gate two of ROADMAP.md's table. Ten tests in
    # `crates/ply-host-tests/tests/suite/unit/db/scope/live.rs` return early unless
    # `PLY_PG_URL` is set, and they return *passing*: cargo captures the skip
    # notice, so `skipped:` occurs zero times in a whole workspace run. Without
    # this container CI would report ten green tests that never opened a
    # connection.
    services:
      postgres:
        image: postgres:18.6
        env:
          POSTGRES_USER: ply
          POSTGRES_PASSWORD: ply
          POSTGRES_DB: ply
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ply -d ply"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      PLY_PG_URL: postgres://ply:ply@127.0.0.1:5432/ply
      # A fifth gate, which ROADMAP.md's table of four did not list:
      # `crates/ply-host-tests/tests/suite/unit/db/pool.rs` hides 26 pool tests behind
      # `PLY_TEST_DB` and, unlike every other gate here, prints *nothing at all*
      # when it is unset. Set but unreachable, the harness's
      # `Reactor::start(config).expect(..)` fails loudly, so the only silent
      # failure left is the variable going missing entirely, and the pre-flight
      # below fails the job on exactly that with `test -n`.
      PLY_TEST_DB: postgres://ply:ply@127.0.0.1:5432/ply

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/suite
        with:
          slot: postgres

      # Gate one of ROADMAP.md's table is a *different* dependency and the
      # service container does not satisfy it: `cluster::available()` in
      # `crates/ply-host-tests/tests/suite/support/cluster.rs` wants `initdb` and
      # `postgres` as executables on this machine, because six test binaries
      # there start a cluster of their own rather than touching a shared server.
      # `available()` searches `PATH` first, so putting the runner's versioned
      # bin directory on `PATH` and failing when it is not there is the same
      # statement as "`available()` is true". `psql` is checked too: it is not
      # in `available()`, but `Cluster::psql` calls it and the tests panic
      # rather than skip without it.
      - name: Put initdb, postgres and psql on PATH, or fail
        run: |
          set -euo pipefail
          find_bin() {
            for candidate in /usr/lib/postgresql/*/bin; do
              if [ -x "$candidate/initdb" ] && [ -x "$candidate/postgres" ] && [ -x "$candidate/psql" ]; then
                echo "$candidate"
              fi
            done | tail -n 1
          }
          bin=$(find_bin)
          if [ -z "$bin" ]; then
            sudo apt-get update
            sudo apt-get install --yes --no-install-recommends postgresql postgresql-client
            bin=$(find_bin)
          fi
          if [ -z "$bin" ]; then
            echo "no initdb/postgres/psql on this runner: cluster::available() would be false," >&2
            echo "and six ply-host test binaries would pass without ever starting a server" >&2
            exit 1
          fi
          echo "$bin" >> "$GITHUB_PATH"
          "$bin/initdb" --version
          "$bin/postgres" --version
          "$bin/psql" --version

      - name: The servers named by PLY_PG_URL and PLY_TEST_DB answer
        run: |
          set -euo pipefail
          test -n "$PLY_PG_URL"
          test -n "$PLY_TEST_DB"
          psql "$PLY_PG_URL" -c 'SELECT version()'
          psql "$PLY_TEST_DB" -c 'SELECT 1'

      # `--success-output immediate` is load-bearing, and so is `2>&1`. The
      # proof that a gate is open is the *absence* of the notice a skipped test
      # prints, and the notice is an `eprintln!` in a test that passes: nextest
      # shows a passing test's output only when asked, and a bare pipe carries
      # only stdout. Piping stdout alone was measured to put **0** notices in
      # the log with `PLY_PG_URL` unset, where `2>&1` put ten. The count of
      # tests passed does not cover the difference — the ten return early and
      # *pass*.
      - name: cargo nextest run
        run: |
          set -euo pipefail
          filter=$(.github/ci-shards.sh postgres-filter)
          cargo-nextest nextest run \
            --binaries-metadata target/nextest/binaries-metadata.json \
            --cargo-metadata target/nextest/cargo-metadata.json \
            --workspace-remap "$GITHUB_WORKSPACE" --target-dir-remap "$GITHUB_WORKSPACE/target" \
            --no-fail-fast --success-output immediate -E "$filter" 2>&1 | tee /tmp/pg.log

      # Gate two: the ten live tests ran against the server. Gate one: a
      # cluster-gated module really started a cluster — `host_park` is the
      # cheapest of the six and it runs a real `initdb`, so its two tests
      # passing without the notice is evidence about all six rather than about
      # `PATH`.
      - name: The live and cluster-gated tests ran against a server
        run: |
          set -euo pipefail
          if grep -Eq 'skipp(ed|ing): (PLY_PG_URL is unset|this machine has no)' /tmp/pg.log; then
            echo "a gated test skipped itself: the server or the cluster binaries did not reach the tests" >&2
            exit 1
          fi
          count() {
            awk -v id="$1" -v prefix="$2" '
              { gsub(/\033\[[0-9;]*m/, "") }
              $1 == "PASS" && $(NF - 1) == id && index($NF, prefix) == 1 { n++ }
              END { print n + 0 }
            ' /tmp/pg.log
          }
          live=$(count ply-host-tests::suite unit::db::scope::live::)
          [ "$live" -eq 10 ] || { echo "expected 10 live tests to pass, saw $live" >&2; exit 1; }
          park=$(count ply-host-tests::suite host_park::)
          [ "$park" -eq 2 ] || { echo "expected 2 host_park tests to pass, saw $park" >&2; exit 1; }
          ran=$(awk '
            { gsub(/\033\[[0-9;]*m/, "") }
            /^ *Summary \[/ { for (i = 1; i <= NF; i++) if ($i == "tests" || $i == "test") { n = $(i - 1) } }
            END { print n + 0 }
          ' /tmp/pg.log)
          echo "the postgres packages ran $ran tests, $live live and $park on a cluster"
          [ "$ran" -gt 0 ] || { echo "the postgres packages ran no tests at all" >&2; exit 1; }
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ply
          path: target/release
      # W4's exit criterion, against the job's server: the same source on the twin
      # and on postgres, byte for byte. It manages its own tables and needs the
      # cluster binaries this job already put on PATH.
      - name: examples/same-tests.sh
        run: |
          set -euo pipefail
          chmod +x target/release/ply
          touch target/release/ply target/release/ply.d
          PLY_BIN="$GITHUB_WORKSPACE/target/release/ply" ./examples/same-tests.sh --db "$PLY_TEST_DB" --reset --no-build
      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: github.ref == 'refs/heads/main'
        with:
          path: /tmp/ply-c-cache
          key: ply-c-cache-postgres-${{ github.run_id }}

  ucontext-probe:
    name: ./probes/ucontext/run.sh
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: ./probes/ucontext/run.sh
        run: ./probes/ucontext/run.sh


  ci:
    name: CI
    if: always()
    needs:
      [
        plan,
        fmt,
        clippy,
        build,
        build-ply,
        test,
        solo,
        gates,
        test-postgres,
        ucontext-probe,
      ]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Every job succeeded
        run: |
          set -euo pipefail
          echo '${{ toJSON(needs) }}' > /tmp/needs.json
          cat /tmp/needs.json
          not_ok=$(jq -r 'to_entries[] | select(.value.result != "success") | "\(.key) = \(.value.result)"' /tmp/needs.json)
          if [ -n "$not_ok" ]; then
            echo "$not_ok" >&2
            exit 1
          fi
          echo "fmt, clippy and the whole test suite are green."
