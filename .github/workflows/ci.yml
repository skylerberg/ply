# The three commands in CONTRIBUTING.md §"The loop", run on every pull request
# and every push to `main`, with the gates that skip silently forced open.
#
# Each decision here is argued where it is made:
#
#   * `fmt` and `clippy` do NOT gate the expensive jobs; everything starts at
#     once and the `ci` aggregate is where lint is required.  They used to
#     gate, so that a lint-red run *completed* in under a minute for a watcher
#     that waits on the whole run, and the price was the whole of `fmt` and
#     `clippy` on the critical path of every green run — about forty-five
#     seconds warm, a fifth of a run now that a shard is a few minutes rather
#     than the eleven the gate was priced against.  The same fast red comes
#     from the watcher instead: `gh pr checks --watch --fail-fast` exits at the
#     first failed check, so a formatting slip surfaces when `fmt` finishes,
#     and the doomed run costs runner minutes rather than anyone's time until
#     the fix is pushed and the concurrency group cancels it.  Rejected: a
#     cancel-on-lint-failure step, which needs `actions: write`, a permission
#     this file deliberately withholds, and buys nothing over `--fail-fast`.
#
#     Lint stays required either way: the `ci` job compares every `needs`
#     result against `success` under `if: always()`, so a red or skipped `fmt`
#     or `clippy` is a red check and never a green tick over nothing run.
#   * `push` filtered to the default branch, so a commit on a PR branch runs CI
#     once rather than twice.  Argued at the `on:` block, which is the only
#     place the `concurrency` group below can be seen not to collapse the pair.
#
#   * `[profile.dev] opt-level = 2`, which is set in the root `Cargo.toml` and
#     not here, but is the single largest thing deciding what this workflow
#     costs.  That manifest's profile block carries the measurement, its
#     provenance and what is still unmeasured about it; do not restate the
#     figure here, where it would go stale on its own.
#
#   * every `rust-cache` key hashes the manifests, and that is a repair rather
#     than a precaution.  `rust-cache` keys on `Cargo.lock`, which records
#     dependency *versions* and not the `[profile]` blocks or the features a
#     member asks for -- both of which are inputs to every dependency's
#     fingerprint.  Change one and the key does not move, so the restore
#     reports `full match: true`, hands back artifacts cargo then rejects as
#     stale, and the post step sees a key that already exists and says `Cache
#     up-to-date` without saving what was just rebuilt.  Nothing is left that
#     can heal it: the cache stays poisoned until `Cargo.lock` happens to
#     change for an unrelated reason.
#
#     **This had happened and had been running for hours.** `df32f9b` added
#     `[profile.dev.package."*"] debug = false` -- a change whose whole purpose
#     was to make builds cheaper -- and left `Cargo.lock` alone.  `test cli`
#     went from compiling **14** crates to compiling **204**, on the identical
#     cache key, `full match: true` in both.  Every job on `main` paid a cold
#     dependency build from that commit until this one.
#
#     Hashing the manifests mints a new key when a profile or a feature moves,
#     which costs one cold build and then saves it.  A stale-but-related cache
#     is still restored by prefix, so the registry survives.
#
#   * `ubuntu-24.04`, and only that.  A Linux runner is what compiles
#     `crates/ply-cli/tests/suite/w5_shutdown.rs` at all — it is `#![cfg(unix)]` — and
#     service containers are Linux-only.  See the `test-postgres` job.
#   * a postgres service container *and* postgres binaries on `PATH`.  Two
#     different gates want two different things and one does not satisfy the
#     other.  See the `test-postgres` job.
#   * the self-hosted compiler is a workspace member, so it needs no job of its
#     own.  It had one for as long as it sat outside the workspace with its own
#     `[workspace]` in `harness/Cargo.toml`, where `cargo build --workspace`,
#     `cargo test --workspace` and `cargo clippy --workspace` reached not one
#     line of it -- and it bit-rotted exactly as its own `README.md` had
#     predicted in writing: four language features landed, its differential
#     harness stopped compiling, and 28 of 763 corpus inputs disagreed with the
#     reference for two days with nothing saying so.  That happened twice, to
#     two directories, for the same reason.
#
#     `crates/ply-compiler` now ships the Ply sources and the bootstrap bundle
#     the way `ply-std` ships the standard library, and
#     `crates/ply-compiler-diff` holds the differentials.  Both are in
#     `.github/ci-shards.sh`'s table like any other member, which is what makes
#     a differential that stops running a red run rather than a quiet one.
#
#     **What this workflow deliberately does NOT run:
#     `crates/ply-compiler-diff/tools/arm.sh --arm`**, the twenty-two mutations
#     that are the evidence the differential can go red at all.  Measured at
#     **299s**, because each mutation re-runs the whole 766-input comparison and
#     there are twenty-two of them: 5 minutes on a developer's machine and
#     plausibly 15-25 on a two-core runner, for a property that changes only
#     when the parser's shape or the mutation table does.  So it stays a by-hand
#     obligation, listed in CONTRIBUTING.md §"The suite proves less than it
#     looks like it proves" beside the others, and this comment is where the
#     trade is written down.  If a mutation is ever found to have silently
#     stopped applying, that is the evidence this trade was wrong.
#   * the suite runs under `cargo nextest`, one process per test over every
#     binary in the shard, rather than under `cargo test`, which runs the
#     binaries one after another and lets one long test hold a whole binary's
#     tail while the runner idles.  `.config/nextest.toml` is the configuration
#     and CONTRIBUTING.md §"The loop" names the same command for a developer.
#     Doctests are the one thing nextest does not run, so each shard runs
#     `cargo test --doc` over its packages as well.
#   * fourteen tests run last and alone inside their shard, because their
#     assertion is a wall clock.  `.github/ci-shards.sh` names them,
#     `.config/nextest.toml` gives them every test thread and the lowest
#     priority, and the `test` job asserts that each one in the shard's
#     packages appears in the log as run — an exact name nothing defines any
#     more selects nothing and says nothing.  Six of the fourteen were found by
#     running a shard's own command on a loaded machine and watching it fail —
#     twice, after two separate surveys had each declared the list complete.
#   * seven tree checks run a second time, by name, in the `test` job.  They
#     already ran inside `cargo nextest run -p ply-span`; running them again by
#     exact name is how "this check still exists" becomes an exit code,
#     because a check that stops running reports nothing and reporting nothing
#     looks like passing.  See the `test` job's last step and
#     `.github/ci-shards.sh`'s `TREE_CHECKS`.  "Tree check" rather than "gate":
#     a gate in the sense used below is a dependency that makes a suite skip
#     silently, which is a different thing.
#   * `toolchain: "1.93.1"`, pinned.  The other side of the trade this block
#     used to take, taken on 2026-08-28 after the predicted failure happened.
#
#     Withdrawn: "`toolchain: stable`, unpinned.  A new Rust release can add a
#     clippy lint and turn the `clippy` job red with no change to the tree.
#     That is deliberate: CONTRIBUTING.md §"The loop" says zero warnings is the
#     gate and "if you introduce the first warning, that is a regression, not a
#     baseline", so inheriting new lints is the behaviour the project asked for,
#     and a developer running the outer loop on their own stable sees the same
#     thing.  To take the other side of that trade, change `toolchain: stable`
#     to an exact version — `toolchain: 1.94.0`, say — in the `fmt`, `clippy`,
#     `test`, `test-postgres` and `same-tests` jobs."
#
#     What happened: `main` went red on 2026-08-25 at d88aae5 on
#     `cargo clippy --locked --workspace --all-targets -- -D warnings`, with no
#     change to the tree.  The identical command on the machine in
#     docs/ONBOARDING.md §Provenance, rustc 1.93.1, exits 0 with zero warnings
#     — so CI had moved to a newer stable and the developer running the outer
#     loop did NOT see the same thing, which is the half of the rationale above
#     that failed.  Pinning restores it.
#
#     The cost is the one the withdrawn text names and it is real: new lints no
#     longer arrive on their own.  Raise this pin deliberately, and fix what the
#     new toolchain reports in the same change.
#
#     Every job in this file is on "1.93.1" and this workflow installs exactly
#     one toolchain.
#
# What this workflow does NOT prove, stated here so nobody has to infer it from
# a green check:
#
#   * Nothing about macOS or Windows.  A Windows leg would be green over an
#     empty binary, since the shutdown suite compiles to nothing there — the
#     exact failure this project is worst at.  A macOS leg would be honest and
#     is not here.
#   * Nothing about the `ply-corpus w6` ladder.  That is re-measurement rather
#     than verification, and `w6_report_integrity` already fails inside
#     `cargo test` if the shipped ladder stops describing the tree.
#   * Nothing about the prose.  One sentence of `README.md` is read by a test;
#     the other ~24,500 lines are not, here or anywhere.
#   * Nothing about whether a diagnostic the armed check calls "armed" can fire.
#     `crates/ply-span-tests/tests/armed.rs` is lexical: it proves a construction site
#     exists in production source, never that the site is reachable.  Its header
#     lists what that leaves out.

name: CI

# `push` is filtered to the default branch, and that is a fix rather than a
# narrowing. Unfiltered, a push to a branch with a PR open fired **both**
# triggers, and the `concurrency` group below could not collapse them: it keys
# on `github.ref`, which is `refs/heads/<branch>` for the push and
# `refs/pull/<n>/merge` for the pull_request, so the two runs are in different
# groups and neither cancels the other. Measured over the 20 runs before this
# change: every branch commit had a matched pair — 21:55:33 push and 21:55:35
# pull_request on `feat/try-operator`, 22:10:21 and 22:10:36 on
# `fix/adr-0027-collision`, and so on down the list — each a full ~31
# runner-minute run of the identical jobs over the identical tree.
#
# So this halves the compute per commit and loses no signal: what a branch push
# checked, the pull_request run checks over the same commits. What it does give
# up is CI on a branch with no PR open yet, which is the case the `pull_request`
# trigger does not cover.
on:
  push:
    branches: [main]
  pull_request:

# A superseded push has nothing left to prove.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # Incremental artifacts are per-machine scratch that no later job reuses, and
  # they are the largest thing a cache would otherwise carry. The root manifest
  # leaves incremental on for local builds; this is the one place it is off.
  CARGO_INCREMENTAL: "0"
  RUST_BACKTRACE: "1"

jobs:
  plan:
    name: shard table is total
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      shards: ${{ steps.table.outputs.matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The one thing a split test suite can get wrong without anyone noticing.
      # Five corruptions were each watched to make it exit 1 -- a member in no
      # shard, a member in two, a deferred test nothing defines, a tree check
      # renamed, and a member named here and absent from the tree.
      #
      # It used to check `spikes/` as well, because two directories there held
      # code no shard reached. There is no `spikes/`: the compiler written in
      # Ply is `crates/ply-compiler`, its differentials are
      # `crates/ply-compiler-diff`, and both are members like any other.
      - name: Every workspace member is in exactly one shard
        run: .github/ci-shards.sh verify

      - name: Emit the matrix
        id: table
        run: echo "matrix=$(.github/ci-shards.sh matrix)" >> "$GITHUB_OUTPUT"

  fmt:
    name: cargo fmt --all --check
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # v1
        with:
          toolchain: "1.93.1"
          components: rustfmt
      # No cache: this compiles nothing.
      #
      # One workspace. There were three -- `crates/ply-codegen-spike` and the
      # two spike harnesses each declared their own `[workspace]`, so
      # `cargo fmt --all` at the root reached none of them, and a one-line
      # formatting slip in one cost a full round trip to discover. All three
      # are gone: the code that mattered is in the workspace, and the rest with
      # it.
      - name: cargo fmt --all --check
        run: cargo fmt --all --check

  clippy:
    name: cargo clippy --workspace --all-targets
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # v1
        with:
          toolchain: "1.93.1"
          components: clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: clippy-${{ hashFiles('Cargo.toml', 'crates/*/Cargo.toml') }}
          save-if: ${{ github.ref_name == github.event.repository.default_branch }}
      # `-D warnings` is how "must be 0 warnings" becomes an exit code. Without
      # it clippy exits 0 with the warnings on stdout, and CONTRIBUTING.md's
      # requirement would be enforced by whoever happened to read the log.
      - run: cargo clippy --locked --workspace --all-targets -- -D warnings

  test:
    name: test ${{ matrix.shard }}
    needs: [plan]
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.shards) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: tcc, the development profile's C compiler
        run: sudo apt-get update -qq && sudo apt-get install -y -qq tcc
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # v1
        with:
          toolchain: "1.93.1"
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: test-${{ matrix.shard }}-${{ hashFiles('Cargo.toml', 'crates/*/Cargo.toml') }}
          save-if: ${{ github.ref_name == github.event.repository.default_branch }}
      - uses: taiki-e/install-action@0758d235715de2f3551eacc980d9ae8fce9342c3 # v2.87.3
        with:
          tool: cargo-nextest@0.9.143

      # Three things here are guards rather than plumbing, and all three are
      # the same failure: a command that runs nothing and exits 0.
      #
      #   1. `packages` is assigned before use, not interpolated. An unknown
      #      shard id has to fail the step rather than produce an empty list,
      #      which cargo reads as "every default member".
      #   2. The run has to have executed at least one test, read out of
      #      nextest's own summary line. That is the backstop for anything that
      #      silently filters the suite away.
      #   3. Every deferred test in this shard's packages has to appear in the
      #      log as run. `.config/nextest.toml` selects them by exact name so
      #      they run last and alone, and an exact name that nothing defines any
      #      more selects nothing and says nothing.
      #
      # **`gsub` first: cargo and nextest colour these lines**, and a pattern
      # wanting a word followed by a space matches nothing when the next byte is
      # an escape. Do not verify this against a log captured from a pipe — no
      # colour is emitted there, so the fixture cannot contain the defect and
      # cannot fail on it.
      - name: cargo nextest run
        env:
          SHARD: ${{ matrix.shard }}
        run: |
          set -euo pipefail
          packages_raw=$(.github/ci-shards.sh packages "$SHARD")
          read -r -a packages <<<"$packages_raw"
          [ "${#packages[@]}" -gt 0 ] || { echo "shard '$SHARD' names no packages" >&2; exit 1; }
          cargo nextest run --locked --no-fail-fast "${packages[@]}" 2>&1 | tee /tmp/shard.log
          ran=$(awk '
            { gsub(/\033\[[0-9;]*m/, "") }
            /^ *Summary \[/ { for (i = 1; i <= NF; i++) if ($i == "tests" || $i == "test") { n = $(i - 1) } }
            END { print n + 0 }
          ' /tmp/shard.log)
          echo "shard '$SHARD' ran $ran tests"
          [ "$ran" -gt 0 ] || { echo "the shard ran no tests at all" >&2; exit 1; }
          while read -r package target test; do
            case " $packages_raw " in
              *" -p $package "*) ;;
              *) continue ;;
            esac
            if [ "$target" = lib ]; then id=$package; else id="$package::$target"; fi
            awk -v id="$id" -v test="$test" '
              { gsub(/\033\[[0-9;]*m/, "") }
              $1 == "PASS" && $NF == test && $(NF - 1) == id { found = 1 }
              END { exit !found }
            ' /tmp/shard.log || {
              echo "deferred test '$id $test' did not run in shard '$SHARD': the table names a test the binary does not have" >&2
              exit 1
            }
            echo "deferred: $id $test ran"
          done < <(.github/ci-shards.sh deferred)

      # nextest does not run doctests. There are none today, and this is what
      # says so if one appears and would otherwise never run.
      - name: cargo test --doc
        env:
          SHARD: ${{ matrix.shard }}
        run: |
          set -euo pipefail
          packages_raw=$(.github/ci-shards.sh packages "$SHARD")
          read -r -a packages <<<"$packages_raw"
          [ "${#packages[@]}" -gt 0 ] || { echo "shard '$SHARD' names no packages" >&2; exit 1; }
          cargo test --locked --doc "${packages[@]}"

      # ROADMAP.md's preamble table, gate three: this file is `#![cfg(unix)]`,
      # and on a non-Unix host it is not compiled and prints nothing at all —
      # the only one of the gates that gives no notice whatsoever. The runner is
      # Linux, so it must have run; this is what says so if a future edit makes
      # the binary vanish again.
      #
      # Keyed on which shard holds `ply-cli` rather than on a shard *name*: the
      # names in `.github/ci-shards.sh` are a balance decision and they have
      # already moved once, and an `if:` naming a shard that no longer exists is
      # a check that silently never runs.
      #
      # Read out of the shard's own log rather than by running the binary a
      # second time, which is what this step used to do.
      #
      # Two reasons, and the second is the one that matters. It is **cheaper**:
      # the shard already ran this binary a moment ago. And it is **safer**,
      # because the binary it re-ran is the one this repository's only known
      # flake lives in: `free_port` hands `ply run --host` a port it has
      # already released, and losing that race cost the full 60-second bind
      # budget and a red run. Observed on `main` at 54a568d — one workspace
      # run failed here after 60.02s and the same binary passed in 2.07s on
      # the next. Running it twice per CI run doubled the exposure to that for
      # no extra assurance whatsoever.
      #
      # `crates/ply-cli/tests/suite/w5_shutdown.rs` now retries the race rather than
      # waiting it out, so the flake should be gone either way. This step not
      # rolling the dice a second time is independent of that and stands on
      # its own.
      #
      # The guarantee is unchanged and is in fact slightly stronger: what the
      # comment above wants to know is that a `#![cfg(unix)]` target was
      # compiled and executed, and asserting it against the shard's log says
      # it ran **in the shard** rather than that it runs when invoked on its
      # own.
      - name: The unix-only shutdown suite really ran
        env:
          SHARD: ${{ matrix.shard }}
        run: |
          set -euo pipefail
          packages_raw=$(.github/ci-shards.sh packages "$SHARD")
          case " $packages_raw " in
            *" ply-cli "*) ;;
            *) echo "ply-cli is not in shard '$SHARD'; the shard that has it runs this"; exit 0 ;;
          esac
          # nextest prints one status line per test, `PASS [ … ] <binary id>
          # <module path>`, and the module prefix is the file the test came
          # from, so `w5_shutdown::` is what a compiled-in `#![cfg(unix)]`
          # module looks like in the log. `gsub` first, for the reason given on
          # the step above.
          ran=$(awk '
            { gsub(/\033\[[0-9;]*m/, "") }
            $1 == "PASS" && $(NF - 1) == "ply-cli::suite" && $NF ~ /^w5_shutdown::/ { n++ }
            END { print n + 0 }
          ' /tmp/shard.log)
          [ "$ran" -gt 0 ] || {
            echo "the shard log names no w5_shutdown test — #![cfg(unix)] compiled it away" >&2
            exit 1
          }
          echo "w5_shutdown: $ran test(s) ran"

      # The checks in `.github/ci-shards.sh`'s TREE_CHECKS table, by name.
      #
      # They already ran a moment ago inside `cargo nextest run -p ply-span`, so
      # this step is not about executing them. It is about the one thing such a
      # check cannot report for itself: a check that stops running says
      # nothing, and saying nothing is indistinguishable from passing. An exact
      # name plus `1 test run: 1 passed` turns "this named test ran and passed"
      # into an exit code, so a rename, a deletion, or a stray filter fails the
      # job. The colour codes are stripped first, for the reason given on the
      # run step: the summary line is coloured on a runner and not in a pipe,
      # and this grep was watched to miss it on a runner before the strip was
      # added.
      # `ci-shards.sh verify` in the `plan` job catches a rename earlier and
      # more cheaply; this is the backstop for everything it cannot see.
      #
      # Keyed on which shard holds `ply-span` rather than on a shard *name*,
      # for the reason given in the step above: the names are a balance
      # decision and they have already moved once.
      - name: The declared-but-never-constructed checks really ran
        env:
          SHARD: ${{ matrix.shard }}
        run: |
          set -euo pipefail
          packages_raw=$(.github/ci-shards.sh packages "$SHARD")
          case " $packages_raw " in
            *" ply-span "*) ;;
            *) echo "ply-span is not in shard '$SHARD'; the shard that has it runs this"; exit 0 ;;
          esac
          ran=0
          while read -r package target test; do
            [ -n "$test" ] || { echo "the tree-check table produced an empty name" >&2; exit 1; }
            cargo nextest run --locked -p "$package" --test "$target" \
              -E "binary_id(=$package::$target) & test(=$test)" 2>&1 | tee /tmp/gate.log
            sed -E 's/\x1b\[[0-9;]*m//g' /tmp/gate.log | grep -Eq ' 1 test run: 1 passed' || {
              echo "check '$test' did not run: cargo found no such test in $target" >&2
              exit 1
            }
            ran=$((ran + 1))
          done < <(.github/ci-shards.sh tree-checks)
          echo "$ran tree check(s) ran"
          [ "$ran" -gt 0 ] || { echo "the tree-check table is empty" >&2; exit 1; }

  test-postgres:
    name: test ply-host (postgres)
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    # Gate two of ROADMAP.md's table. Ten tests in
    # `crates/ply-host/src/db/scope/tests/live.rs` return early unless
    # `PLY_PG_URL` is set, and they return *passing*: cargo captures the skip
    # notice, so `skipped:` occurs zero times in a whole `cargo test
    # --workspace` log. Without this container CI would report ten green tests
    # that never opened a connection.
    services:
      postgres:
        image: postgres:18.6
        env:
          POSTGRES_USER: ply
          POSTGRES_PASSWORD: ply
          POSTGRES_DB: ply
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ply -d ply"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      PLY_PG_URL: postgres://ply:ply@127.0.0.1:5432/ply
      # A fifth gate, which ROADMAP.md's table of four did not list:
      # `crates/ply-host/src/db/pool/tests.rs` hides 26 pool tests behind
      # `PLY_TEST_DB` and, unlike every other gate here, prints *nothing at all*
      # when it is unset. Measured on the machine in docs/ONBOARDING.md
      # §Provenance, 2026-08-24, against a local postgres 18.3:
      #
      #   unset                    26 passed, 0.00s   <- silent, and green
      #   set, server reachable    26 passed, 0.94s
      #   set, server unreachable  20 FAILED, 0.02s   <- E0431, loudly
      #
      # That third row is the one worth knowing, and it is why this job is
      # better guarded than "there is no notice to grep for" suggests. The
      # harness does `Reactor::start(config).expect("the test database is
      # reachable")` at tests.rs:41, so a set-but-wrong `PLY_TEST_DB` is a red
      # build rather than a quiet skip. The only silent failure left is the
      # variable going missing entirely, and the pre-flight below fails the job
      # on exactly that with `test -n`.
      PLY_TEST_DB: postgres://ply:ply@127.0.0.1:5432/ply

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # v1
        with:
          toolchain: "1.93.1"
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: test-postgres-${{ hashFiles('Cargo.toml', 'crates/*/Cargo.toml') }}
          save-if: ${{ github.ref_name == github.event.repository.default_branch }}
      - uses: taiki-e/install-action@0758d235715de2f3551eacc980d9ae8fce9342c3 # v2.87.3
        with:
          tool: cargo-nextest@0.9.143

      # Gate one of ROADMAP.md's table is a *different* dependency and the
      # service container does not satisfy it: `cluster::available()` in
      # `crates/ply-host-tests/tests/suite/support/cluster.rs` wants `initdb` and
      # `postgres` as executables on this machine, because six test binaries
      # there start a cluster of their own rather than touching a shared server.
      # `available()` searches `PATH` first, so putting the runner's versioned
      # bin directory on `PATH` and failing when it is not there is the same
      # statement as "`available()` is true". `psql` is checked too: it is not
      # in `available()`, but `Cluster::psql` calls it and the tests panic
      # rather than skip without it.
      - name: Put initdb, postgres and psql on PATH, or fail
        run: |
          set -euo pipefail
          find_bin() {
            for candidate in /usr/lib/postgresql/*/bin; do
              if [ -x "$candidate/initdb" ] && [ -x "$candidate/postgres" ] && [ -x "$candidate/psql" ]; then
                echo "$candidate"
              fi
            done | tail -n 1
          }
          bin=$(find_bin)
          if [ -z "$bin" ]; then
            sudo apt-get update
            sudo apt-get install --yes --no-install-recommends postgresql postgresql-client
            bin=$(find_bin)
          fi
          if [ -z "$bin" ]; then
            echo "no initdb/postgres/psql on this runner: cluster::available() would be false," >&2
            echo "and six ply-host test binaries would pass without ever starting a server" >&2
            exit 1
          fi
          echo "$bin" >> "$GITHUB_PATH"
          "$bin/initdb" --version
          "$bin/postgres" --version
          "$bin/psql" --version

      - name: The servers named by PLY_PG_URL and PLY_TEST_DB answer
        run: |
          set -euo pipefail
          test -n "$PLY_PG_URL"
          test -n "$PLY_TEST_DB"
          psql "$PLY_PG_URL" -c 'SELECT version()'
          psql "$PLY_TEST_DB" -c 'SELECT 1'

      # The proof that gate two is open, run before the suite so a
      # misconfiguration is one fast red step rather than a green 40-second run.
      #
      # `--no-capture` is load-bearing, and so is `2>&1`.
      #
      # The notice is an `eprintln!`, so it goes to **stderr**. `cargo nextest
      # run | tee log` redirects only stdout, so the notice never reaches the
      # file the grep reads, and the grep cannot fire whatever pattern it uses.
      # Measured on the machine in docs/ONBOARDING.md §Provenance, with
      # `PLY_PG_URL` unset: piping stdout alone puts **0** notices in the log,
      # and `2>&1 | tee` puts **10** there. The `10 tests run: 10 passed`
      # assertion below does not cover the difference — the ten tests return
      # early and *pass*, so that line reads `10 passed` with no server
      # anywhere.
      #
      # Both halves were wrong here once, in opposite directions, which is why
      # this comment is long: an anchored `^skipped:` was written first and the
      # stream was never captured. Either bug alone is a guard that cannot fire
      # over a gate whose entire defect is that it silently never runs.
      - name: The ten live postgres tests ran against the server
        run: |
          set -euo pipefail
          cargo nextest run --locked -p ply-host --lib \
            -E 'test(db::scope::tests::live::)' --no-capture 2>&1 | tee /tmp/live.log
          if grep -Eq 'skipp(ed|ing): (PLY_PG_URL is unset|this machine has no)' /tmp/live.log; then
            echo "a live test skipped itself: PLY_PG_URL did not reach the tests" >&2
            exit 1
          fi
          sed -E 's/\x1b\[[0-9;]*m//g' /tmp/live.log | grep -Eq ' 10 tests run: 10 passed' || {
            echo "expected 10 live tests; see the log above for what ran" >&2
            exit 1
          }

      # The proof that gate one is open, by the same method. `host_park` is the
      # cheapest cluster-gated module and it starts a real `initdb` cluster, so
      # a pass here is evidence about all six of them rather than about `PATH`.
      # The suite is `ply-host-tests`'s; `ply-host` keeps only its unit tests.
      - name: A cluster-gated suite really started a cluster
        run: |
          set -euo pipefail
          # 2>&1 for the same reason as the step above: the skip notice is an
          # eprintln! and a bare pipe would not carry it.
          cargo nextest run --locked -p ply-host-tests --test suite \
            -E 'test(host_park::)' --no-capture 2>&1 | tee /tmp/park.log
          if grep -Eq 'skipp(ed|ing): (PLY_PG_URL is unset|this machine has no)' /tmp/park.log; then
            echo "cluster::available() was false: initdb/postgres are not where the tests look" >&2
            exit 1
          fi
          sed -E 's/\x1b\[[0-9;]*m//g' /tmp/park.log | grep -Eq ' 2 tests run: 2 passed' || {
            echo "expected 2 tests in host_park; see the log above" >&2
            exit 1
          }

      # The same guards as the `test` job's run step, for the same reasons.
      - name: cargo nextest run
        run: |
          set -euo pipefail
          packages_raw=$(.github/ci-shards.sh packages postgres)
          read -r -a packages <<<"$packages_raw"
          [ "${#packages[@]}" -gt 0 ] || { echo "the postgres shard names no packages" >&2; exit 1; }
          cargo nextest run --locked --no-fail-fast "${packages[@]}" 2>&1 | tee /tmp/pg.log
          ran=$(awk '
            { gsub(/\033\[[0-9;]*m/, "") }
            /^ *Summary \[/ { for (i = 1; i <= NF; i++) if ($i == "tests" || $i == "test") { n = $(i - 1) } }
            END { print n + 0 }
          ' /tmp/pg.log)
          echo "the postgres shard ran $ran tests"
          [ "$ran" -gt 0 ] || { echo "the postgres shard ran no tests at all" >&2; exit 1; }
          while read -r package target test; do
            case " $packages_raw " in
              *" -p $package "*) ;;
              *) continue ;;
            esac
            if [ "$target" = lib ]; then id=$package; else id="$package::$target"; fi
            awk -v id="$id" -v test="$test" '
              { gsub(/\033\[[0-9;]*m/, "") }
              $1 == "PASS" && $NF == test && $(NF - 1) == id { found = 1 }
              END { exit !found }
            ' /tmp/pg.log || {
              echo "deferred test '$id $test' did not run in the postgres shard: the table names a test the binary does not have" >&2
              exit 1
            }
            echo "deferred: $id $test ran"
          done < <(.github/ci-shards.sh deferred)

      - name: cargo test --doc
        run: |
          set -euo pipefail
          packages_raw=$(.github/ci-shards.sh packages postgres)
          read -r -a packages <<<"$packages_raw"
          cargo test --locked --doc "${packages[@]}"

  ucontext-probe:
    name: ./probes/ucontext/run.sh
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: ./probes/ucontext/run.sh
        run: ./probes/ucontext/run.sh

  same-tests:
    name: examples/same-tests.sh
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: tcc, the development profile's C compiler
        run: sudo apt-get update -qq && sudo apt-get install -y -qq tcc
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # v1
        with:
          toolchain: "1.93.1"
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: same-tests-${{ hashFiles('Cargo.toml', 'crates/*/Cargo.toml') }}
          save-if: ${{ github.ref_name == github.event.repository.default_branch }}

      # The script manages its own cluster with `initdb`/`pg_ctl` when it is not
      # given a `--db`, so this job needs the binaries and not a service.
      - name: Put initdb, pg_ctl and psql on PATH, or fail
        run: |
          set -euo pipefail
          find_bin() {
            for candidate in /usr/lib/postgresql/*/bin; do
              if [ -x "$candidate/initdb" ] && [ -x "$candidate/pg_ctl" ] && [ -x "$candidate/psql" ]; then
                echo "$candidate"
              fi
            done | tail -n 1
          }
          bin=$(find_bin)
          if [ -z "$bin" ]; then
            sudo apt-get update
            sudo apt-get install --yes --no-install-recommends postgresql postgresql-client
            bin=$(find_bin)
          fi
          if [ -z "$bin" ]; then
            echo "same-tests.sh needs initdb, pg_ctl and psql and this runner has none" >&2
            exit 1
          fi
          echo "$bin" >> "$GITHUB_PATH"

      # W4's exit criterion: the same `examples/desk.ply` endpoints answered by
      # the in-memory twin and by real postgres, compared byte for byte. Nothing
      # in `cargo test` covers it — the twin half is hermetic and the postgres
      # half is behind the gates above — and CONTRIBUTING.md §"The suite proves
      # less than it looks like it proves" lists running it by hand as the
      # obligation this job takes over.
      #
      # The script builds `target/release/ply` itself since 2026-08-27, and
      # refuses to run against a binary older than the sources in its own
      # dep-info. This step is kept, and it is not redundant: a compile error
      # fails a step named for it rather than fifty lines into the script's
      # output, and this is where the release build's minutes are spent and
      # named. The rationale it replaces was:
      #
      #   > The release build is the script's own requirement: step 1 runs
      #   > `target/release/ply` before `serve.sh` gets a chance to build it.
      #
      # which was true of the script as it stood and is not true of it now.
      #
      # Half of the rationale that replaced *that* has gone the same way. This
      # comment said:
      #
      #   > This step is kept, and it is not redundant: it is `--locked`, so a
      #   > `Cargo.lock` that does not match the manifests fails here instead of
      #   > being quietly updated by the script's build, and a compile error
      #   > fails a step named for it rather than fifty lines into the script's
      #   > output.
      #
      # The first half described a hole rather than a guarantee. `--locked` here
      # bought nothing while the three builds that follow it in this job could
      # each re-resolve the lock it had just checked: `same-tests.sh`'s own build,
      # and `serve.sh`'s, which `same-tests.sh` starts twice. All three pass
      # `--locked` since 2026-08-27, so this step is the first of four locked
      # builds rather than the only one, and the flag stays here so that a lock
      # failure fails a step named for the lock.
      - name: cargo build --locked --release -p ply-cli
        run: cargo build --locked --release -p ply-cli

      # `same-tests.sh` refuses to run against a binary that is not this tree,
      # and a freshness check nobody has watched fail is the same defect one
      # level up — so the check is driven red and green here before it is
      # relied on. `--self-test` touches no tracked file: it compares the
      # binary against a corrupted *copy* of the stdlib and against a dep-info
      # it writes under a scratch directory. CONTRIBUTING.md §"The binary is an
      # instrument too" has the reproduction this replaces.
      - name: The freshness check can still go red
        run: .github/binary-is-current.sh --self-test

      - name: The binary is built from this tree
        run: .github/binary-is-current.sh target/release/ply

      # M9's end-to-end check, and it is here rather than in `cargo test`
      # because this is where a *verified-fresh release* binary already exists.
      # `crates/ply-codegen-tests/tests/suite/fragment.rs` and
      # `crates/ply-cli/tests/suite/backend.rs` run the code generator over
      # corpora of five and nine definitions; this runs it over `examples/`,
      # which is the shipped standard library at corpus scale.
      #
      # Under tier-only (ADR 0048) the compiled tier IS the evaluator, so this runs it green over
      # `examples/` at corpus scale. A corrupt tier is caught by the program's own tests going red
      # (`crates/ply-cli/tests/suite/backend.rs` proves that for every corruption), so the check
      # here is that the honest tier is green AND not vacuous.
      #
      # The `entered`/`units` assertions are the half that stops it being vacuous. The
      # compute-kernel record has a run reporting a 0.998x speedup over a backend that entered
      # **nothing**, and a green run over a seam no call reached says nothing at all. A code
      # generator whose fragment collapses to zero — one refused construct spreading through the
      # fixpoint is enough — would pass every assertion here except these.
      - name: The code generator runs examples/ green and enters the seam
        run: |
          set -uo pipefail
          # `set -e` is off for the run itself on purpose: `ply test` exits 1 when a test fails,
          # and letting the shell die there would skip the assertions below and report the failure
          # as "the command exited 1" rather than as which of them broke.
          ./target/release/ply test examples --backend c \
            --json > /tmp/backend.json || true
          set -e
          python3 - <<'PY'
          import json, sys
          r = json.load(open("/tmp/backend.json"))
          b = r.get("backend") or {}
          print(json.dumps(b, indent=2))
          if not r["ok"] or r["summary"]["failed"]:
              sys.exit("the code generator is red over examples/")
          if b.get("name") != "c":
              sys.exit(f"a run asked for c installed {b.get('name')!r}")
          if not b.get("entered"):
              sys.exit("the code generator entered nothing, so the run above is green over a "
                       "seam no call reached")
          if not b.get("units"):
              sys.exit("no unit was compiled, so `c` is not a code generator here")
          PY

      # `examples/` is small. The self-hosted front end is thirteen thousand lines of Ply and it
      # is where this tier's ownership rules actually get exercised: it freed a parser's whole
      # state under the seam because a record was read again after a field read let it go, and
      # every test the tier had passed while it did. This is the workload that says otherwise.
      - name: The C tier runs the self-hosted front end green and enters the seam
        run: |
          set -uo pipefail
          d=$(mktemp -d)
          cp crates/ply-compiler/ply/*.ply "$d/"
          ./target/release/ply test "$d" --no-cache --backend c \
            --json > /tmp/spike-c.json || true
          set -e
          python3 - <<'PY'
          import json, sys
          r = json.load(open("/tmp/spike-c.json"))
          b = r.get("backend") or {}
          print(json.dumps(b, indent=2))
          if not r["ok"] or r["summary"]["failed"]:
              sys.exit("the C tier is red over the self-hosted front end")
          if not b.get("entered"):
              sys.exit("the C tier entered nothing, so the run above is green over a "
                       "seam no call reached")
          PY

      # ADR 0042's third step, and under tier-only (ADR 0048) the only one: the emitter written
      # in Ply produces the unit the tier runs. The count says it answered rather than falling
      # back to the reference, and the corpus running green over what it produced is the check
      # that it produced correctly.
      #
      # In a cache of its own, or the count is vacuous: a step above already ran `examples` on
      # this producer, and a unit that comes back whole from the object cache is a unit the
      # emitter was never entered for. That is exactly what `PLY_C_CACHE` is for.
      - name: The Ply emitter produces the unit, and examples/ runs green
        run: |
          set -uo pipefail
          PLY_C_CACHE=$(mktemp -d) PLY_C_REFUSALS=1 \
            ./target/release/ply test examples --backend c --no-cache \
            --json > /tmp/whole.json 2> /tmp/whole.err || true
          set -e
          grep -E "ply emitter answered [1-9][0-9]* of" /tmp/whole.err || {
            echo "the Ply emitter answered nothing, or was never asked:"; cat /tmp/whole.err | tail -20; exit 1; }
          python3 -c 'import json,sys; r=json.load(open("/tmp/whole.json")); \
            sys.exit(0 if r["ok"] and not r["summary"]["failed"] else \
              "with the chain entered whole, the C tier is red over examples/")'

      # ADR 0045's fourth stage: the language's own claims, sorted out of the Rust suites into a
      # corpus `ply test` runs. Green on the default tier, and green with the tier pinned as the
      # only engine -- or the claim is about an engine and not the language.
      - name: The language corpus, on the default tier and tier-only
        run: |
          set -euo pipefail
          ./target/release/ply test tests/lang --no-cache
          PLY_TIER_ONLY=1 \
            ./target/release/ply test tests/lang --backend c --no-cache
      # ADR 0045's first stage for the judge: every law and spec clause is a root of the unit, and
      # `ply prove --backend c` enters them. Under tier-only the tier is the judge, so the corpus
      # must prove cleanly (nothing refuted) and the tier must have entered the propositions rather
      # than the run being green over a seam no proposition reached.
      - name: The compiled tier judges the corpus specifications
        run: |
          set -euo pipefail
          for corpus in examples crates/ply-std/ply; do
            PLY_C_REFUSALS=1 PLY_C_PHASES=1 \
              ./target/release/ply prove "$corpus" --no-cache --json --backend c \
              > /tmp/prove-c.json 2> /tmp/prove-c.err
            entries=$(grep -c "^entry:" /tmp/prove-c.err || true)
            [ "$entries" -gt 0 ] || { echo "the tier entered nothing while proving $corpus"; exit 1; }
            python3 - <<'PY'
          import json, sys
          r = json.load(open("/tmp/prove-c.json"))
          s = r["summary"]
          print("  prove:", json.dumps(s))
          if not r["ok"] or s["obligations"] == 0 or s["refuted"]:
              sys.exit("the tier did not judge the corpus specifications cleanly")
          PY
          done
      - name: A served example with the tier holding its accept loop
        run: .github/served-with-tier.sh
      - name: The compiled tier as the only engine, over every corpus and the served example
        run: |
          set -euo pipefail
          for d in examples crates/ply-std/ply; do
            PLY_TIER_ONLY=1 \
              ./target/release/ply test "$d" --backend c --no-cache
          done
          d=$(mktemp -d)
          cp crates/ply-compiler/ply/*.ply "$d/"
          PLY_TIER_ONLY=1 \
            ./target/release/ply test "$d" --backend c --no-cache
          PLY_TIER_ONLY=1 .github/served-with-tier.sh
      # The tier shipped a wrong BLAKE3 digest on a 64KB input while every test it had passed ---
      # the input was the first one long enough for a loop to come round --- so this pairs the tier
      # against a hash long enough to build a tree, the shape that broke. The test hashes the same
      # input twice and asserts the digests are equal, so a tier that held a record back part way
      # through the loop is caught by its own answer changing.
      - name: The C tier hashes a long input consistently
        run: |
          set -e
          d=$(mktemp -d)
          python3 - "$d/input.ply" <<'PY'
          import sys
          data = bytes((i % 251) for i in range(65536))
          lit = 'b"' + ''.join(('\\x%02x' % b) if (b < 0x20 or b >= 0x7f or b in (0x22, 0x5c))
                               else chr(b) for b in data) + '"'
          open(sys.argv[1], "w").write("pub fn long() -> Bytes = %s\n" % lit)
          PY
          cat > "$d/h.ply" <<'PLY'
          import std.hash (blake3)
          import input (long)
          // Sixty-four chunks: the tree path, and long enough that every loop in the
          // hash comes round with a record its tier may have held back.
          test "a long input hashes to a stable digest" {
            assert_eq(blake3(long()), blake3(long()))
          }
          pub fn digest() -> Bytes = blake3(long())
          PLY
          ./target/release/ply test "$d" --no-cache --backend c --json \
            > /tmp/c-hash.json
          python3 -c 'import json,sys; r=json.load(open("/tmp/c-hash.json")); \
            sys.exit(0 if r["ok"] and not r["summary"]["failed"] else \
              "the C tier hashes a long input inconsistently")'

      - name: examples/same-tests.sh
        run: ./examples/same-tests.sh

  # Every job, in one required check. Without this, a matrix that produced no
  # legs — or a job skipped because something it needed was skipped — reports a
  # green tick over nothing run at all.
  ci:
    name: CI
    if: always()
    needs:
      [
        plan,
        fmt,
        clippy,
        test,
        test-postgres,
        ucontext-probe,
        same-tests,
      ]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Every job succeeded
        run: |
          set -euo pipefail
          echo '${{ toJSON(needs) }}' > /tmp/needs.json
          cat /tmp/needs.json
          not_ok=$(jq -r 'to_entries[] | select(.value.result != "success") | "\(.key) = \(.value.result)"' /tmp/needs.json)
          if [ -n "$not_ok" ]; then
            echo "$not_ok" >&2
            exit 1
          fi
          echo "fmt, clippy and the whole test suite are green."
