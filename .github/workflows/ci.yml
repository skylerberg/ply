# One job runs everything, in a checkout its runner keeps from run to run: cargo's `target`, each
# package's store and the C the bootstrap and the tests compiled are there from the run before, so
# a run pays for what moved since. A hosted runner starts with none of it.
# The toolchain pin recurs in every workflow under .github/: raise it everywhere at once.

name: CI

# Pushes only on main: a branch with a pull request is already run by `pull_request`.
# A change to prose alone starts no run: sound only while nothing built or tested reads a `.md`
# file, which AGENTS.md's "tests check the program, never a document" already demands. So `CI`
# cannot be a required check: a prose-only pull request would wait on it forever.
on:
  push:
    branches: [main]
    paths-ignore: ["**.md", "docs/**"]
  pull_request:
    paths-ignore: ["**.md", "docs/**"]
  # Nightly, and on demand: the run starts from nothing an earlier run kept, so no kept answer goes
  # unchecked, and the modules of the CLI's suite no other run takes run: a fourteenth of the edit
  # sweep, the whole of it in two weeks, and the rest whole.
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

# A newer push to a pull request supersedes its run; a merge to main never cancels the run before
# it, whose `publish` jobs put out the `ply` the next bootstraps start from.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  RUST_TOOLCHAIN: "1.93.1"
  NEXTEST_VERSION: "0.9.143"
  CARGO_TERM_COLOR: always
  # Line tables, which a test's backtrace reads. The full DWARF a developer's build keeps is for
  # `ply --count-alloc-sites` naming inlined frames (Cargo.toml), which nothing in CI asks of it.
  CARGO_PROFILE_DEV_DEBUG: line-tables-only
  RUST_BACKTRACE: "1"
  # The C cache and the stages are every run's on the runner's machine, so they are held to what
  # its disk carries, where a developer's are held to two gigabytes.
  PLY_C_CACHE_MAX: "107374182400"

jobs:
  ci:
    name: CI
    # A fork's pull request runs on a hosted runner, every other run on this repository's own.
    runs-on: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && 'ubuntu-24.04' || 'liquid' }}
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          clean: false
      # What a run left in the tree goes, but for what the next one starts from.
      - name: Clean the checkout of all but cargo's target and the packages' stores
        run: git clean -ffdxq -e target -e .ply-cache
      - name: Start from nothing a run kept
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: |
          set -euo pipefail
          git clean -ffdxq -e target
          {
            echo "PLY_C_CACHE=$RUNNER_TEMP/ply-c-cache"
            echo "PLY_C_STAGE=$RUNNER_TEMP/ply-c-stage"
            echo "PLY_CACHE_UPSTREAM=$RUNNER_TEMP/ply-upstream"
          } >> "$GITHUB_ENV"

      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # v1
        if: runner.environment == 'github-hosted'
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: clippy, rustfmt
      - uses: taiki-e/install-action@0758d235715de2f3551eacc980d9ae8fce9342c3 # v2.87.3
        if: runner.environment == 'github-hosted'
        with:
          tool: cargo-nextest@${{ env.NEXTEST_VERSION }}
      - name: Install tcc
        if: runner.environment == 'github-hosted'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq tcc
      # The runner's own toolchain is installed once, by hand: a pin it has drifted from fails here.
      - name: Check the toolchain is the pinned one
        id: ready
        run: |
          set -euo pipefail
          rustc --version
          cargo nextest --version
          [[ $(rustc --version) == "rustc $RUST_TOOLCHAIN "* ]]
          [[ $(cargo nextest --version) == "cargo-nextest $NEXTEST_VERSION "* ]]
          tcc -v

      - name: Check the CI tables, and probe ucontext
        run: |
          set -euo pipefail
          .github/ci-tables.sh verify
          # The runner's awk is not the one a developer has, and the self-test holds both to one answer.
          .github/ci-timings.sh --self-test
          ./probes/ucontext/run.sh

      - name: Lint the Rust with clippy
        run: cargo clippy --locked --workspace --all-targets -- -D warnings
      # Whatever clippy said, so one run reports both: each check from here runs beside an earlier
      # one's failure, once the tree and the toolchain are there.
      - name: Check the Rust formatting
        if: ${{ !cancelled() && steps.ready.outcome == 'success' }}
        run: cargo fmt --all --check

      # The host packages' tests bind sockets and processes, so they run after every other test.
      - name: Run the Rust tests
        id: rust
        if: ${{ !cancelled() && steps.ready.outcome == 'success' }}
        run: |
          set -euo pipefail
          hosts=$(.github/ci-tables.sh host-filter)
          cargo nextest run --locked --workspace --no-fail-fast -E "not ($hosts)" 2>&1 | tee "$RUNNER_TEMP/nextest.log"
          cargo nextest run --locked --workspace --no-fail-fast --success-output immediate -E "$hosts"
      # A check that stops running reports nothing. The awk strips colour first.
      - name: Check every tree check ran
        if: ${{ !cancelled() && steps.rust.outcome == 'success' }}
        run: |
          set -euo pipefail
          ran=0
          while read -r package target test; do
            if [ "$target" = lib ]; then id=$package; else id="$package::$target"; fi
            awk -v id="$id" -v test="$test" '
              { gsub(/\033\[[0-9;]*m/, "") }
              $1 == "PASS" && $NF == test && $(NF - 1) == id { found = 1 }
              END { exit !found }
            ' "$RUNNER_TEMP/nextest.log" || {
              echo "'$id $test' did not run: the table names a test the binary does not have" >&2
              exit 1
            }
            ran=$((ran + 1))
          done < <(.github/ci-tables.sh tree-checks)
          echo "$ran tree checks ran"
          [ "$ran" -gt 0 ] || { echo "the table is empty" >&2; exit 1; }

      - uses: ./.github/actions/bootstrap
        id: bootstrap
        if: ${{ !cancelled() && steps.ready.outcome == 'success' }}
        with:
          out: target/release/ply
          kept: ${{ github.event_name != 'schedule' && github.event_name != 'workflow_dispatch' }}
      # Where the suites' grants name it.
      - name: Put the `ply` where the Ply tests start it
        id: ply
        if: ${{ !cancelled() && steps.bootstrap.outcome == 'success' }}
        run: |
          set -euo pipefail
          mkdir -p target/debug
          cp target/release/ply target/debug/ply

      # A check may take minutes and make any number of calls; a quarter of an hour abandons one.
      - name: Run the Ply tests
        if: ${{ !cancelled() && steps.ply.outcome == 'success' }}
        env:
          EVENT: ${{ github.event_name }}
        run: .github/ci-corpus.sh all "$EVENT"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ !cancelled() && steps.ply.outcome == 'success' }}
        with:
          name: test-durations
          path: /tmp/test-durations
          retention-days: 14
          if-no-files-found: error

      # A source committed unformatted puts its reformatting into the next change that touches it.
      - name: Check the maintained Ply sources are formatted
        if: ${{ !cancelled() && steps.ply.outcome == 'success' }}
        run: |
          set -euo pipefail
          mapfile -t sources < <(.github/ci-tables.sh formatted-sources)
          target/debug/ply fmt --check "${sources[@]}" ||
            { echo "run 'ply fmt' on what it names and commit that" >&2; exit 1; }
      # A lock pins the closure's names and versions; a path dependency in this checkout carries no
      # digest, so an edit to one moves no lock. On the merge with main, not only the branch: two
      # changes that each moved a lock leave main's stale.
      - name: Check every lockfile pins this tree
        if: ${{ !cancelled() && steps.ply.outcome == 'success' }}
        run: |
          set -euo pipefail
          locks=$(git ls-files '*ply.lock')
          for lock in $locks; do target/debug/ply resolve "$(dirname "$lock")" >/dev/null; done
          git diff --exit-code -- $locks || { echo "a ply.lock does not pin these sources: run 'ply resolve' on it" >&2; exit 1; }

      # The editor grammar is a second reading of the language beside `crates/ply-compiler/ply`, so
      # it gets its own check: regenerate the committed parser, hold the corpus trees to the grammar,
      # and parse every Ply module in the tree with it.
      - name: Generate and test the tree-sitter grammar
        if: ${{ !cancelled() && steps.ready.outcome == 'success' }}
        working-directory: editors/tree-sitter-ply
        run: |
          set -euo pipefail
          npm ci --no-audit --no-fund
          npx tree-sitter generate
          git diff --exit-code -- src
          npx tree-sitter test
          # A malformed query compiles to nothing, so it is one the build has to refuse.
          for q in highlights indents; do
            npx tree-sitter query "queries/$q.scm" ../../examples/hello.ply > /dev/null
          done
      - name: Parse every Ply module in the tree
        if: ${{ !cancelled() && steps.ready.outcome == 'success' }}
        run: editors/tree-sitter-ply/scripts/parse-corpus.sh

      # The `ply` `publish` puts out.
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: github.event_name == 'push'
        with:
          name: ply
          path: target/release/ply
          retention-days: 2
          if-no-files-found: error

  # Main's `ply`, once the run that tested it is green, to the rolling release `scripts/stage0.sh`
  # downloads: the stage0 every later bootstrap starts from.
  publish:
    name: Publish main's ply for Linux
    if: github.event_name == 'push'
    needs: [ci]
    runs-on: liquid
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ply
          path: ${{ runner.temp }}/ply
      - name: Upload it to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mv "$RUNNER_TEMP/ply/ply" "$RUNNER_TEMP/ply/ply-linux-x64"
          gh release upload main-latest "$RUNNER_TEMP/ply/ply-linux-x64" --clobber --repo "$GITHUB_REPOSITORY"

  publish-macos:
    name: Bootstrap and publish main's ply for macOS
    if: github.event_name == 'push'
    needs: [ci]
    # The stage0 it starts from is built for macOS 15.
    runs-on: macos-15
    timeout-minutes: 90
    permissions:
      contents: write
    env:
      PLY_C_CACHE: /tmp/ply-c-cache
      PLY_C_STAGE: /tmp/ply-c-stage
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The C the last bootstrap here compiled, and the `ply` it made, which stands where nothing a
      # bootstrap reads has moved since.
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            /tmp/ply-c-cache
            /tmp/ply-c-stage
            target/release/ply
            target/release/ply.toolchain
          key: ply-c-macos-${{ github.run_id }}
          restore-keys: ply-c-macos-
      - uses: ./.github/actions/bootstrap
        with:
          out: target/release/ply
          kept: true
      # A `Float` answers the same bits on every target: the float programs Linux checked, here too.
      - name: Hold its floats to the digests the language suite pins
        run: |
          set -euo pipefail
          target/release/ply test tests/lang/floats --no-cache
          target/release/ply test tests/lang/floats --no-cache --profile release
      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            /tmp/ply-c-cache
            /tmp/ply-c-stage
            target/release/ply
            target/release/ply.toolchain
          key: ply-c-macos-${{ github.run_id }}
      - name: Upload it to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cp target/release/ply /tmp/ply-macos-arm64
          gh release upload main-latest /tmp/ply-macos-arm64 --clobber --repo "$GITHUB_REPOSITORY"
