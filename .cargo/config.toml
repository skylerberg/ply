# DWARF, compressed in the binaries the Linux linker writes. The workspace
# keeps full debug info (the root manifest's profile block says why: the
# allocation-attribution suite reads inlined frames out of it), and it is most
# of every test binary: the nextest archive CI ships between its jobs was
# 1.2 GB for 58 of them. Compressed sections symbolize exactly as before --
# `backtrace` reads them through gimli -- and cost the linker a moment per
# binary. Per target so a macOS checkout, whose linker takes no such flag, is
# untouched.
[target.x86_64-unknown-linux-gnu]
rustflags = ["-C", "link-arg=-Wl,--compress-debug-sections=zlib"]
