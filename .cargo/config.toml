# `cargo pack BINARY` appends the checkout's Ply sources and runnables to a `ply` the Rust build made.
[alias]
pack = "run --quiet -p ply-launcher --bin ply-pack --"

# What the bundled SQLite is compiled with, after the flags `libsqlite3-sys` passes itself: no
# extension loading, no shared cache, no URI filenames, no memory mapping, temporary storage in
# memory only, double-quoted strings refused, a schema's functions and virtual tables untrusted,
# and none of the full-text, R-tree or page-statistics modules `std.sqlite` does not admit.
[env]
LIBSQLITE3_FLAGS = """
-DSQLITE_OMIT_LOAD_EXTENSION
-DSQLITE_OMIT_SHARED_CACHE
-DSQLITE_DQS=0
-DSQLITE_TRUSTED_SCHEMA=0
-DSQLITE_TEMP_STORE=3
-DSQLITE_MAX_MMAP_SIZE=0
-DSQLITE_DEFAULT_MEMSTATUS=0
-DSQLITE_LIKE_DOESNT_MATCH_BLOBS
-DSQLITE_STRICT_SUBTYPE=1
-DSQLITE_PRINTF_PRECISION_LIMIT=100000
-USQLITE_USE_URI
-USQLITE_ENABLE_FTS3
-USQLITE_ENABLE_FTS3_PARENTHESIS
-USQLITE_ENABLE_FTS5
-USQLITE_ENABLE_RTREE
-USQLITE_ENABLE_DBSTAT_VTAB
-USQLITE_SOUNDEX
"""
