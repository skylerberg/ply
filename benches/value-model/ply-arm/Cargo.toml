# The Ply side of ADR 0035's gate, measured the way the Rust side is: one process, the kernel
# called directly, the minimum over the same number of repeats. `ply test` runs a kernel once per
# process, and at k1's fifth of a millisecond the process is most of what gets timed.
[package]
name = "ply-arm"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
ply-span = { path = "../../../crates/ply-span" }
ply-syntax = { path = "../../../crates/ply-syntax" }
ply-core = { path = "../../../crates/ply-core" }
ply-eval = { path = "../../../crates/ply-eval" }
ply-codegen = { path = "../../../crates/ply-codegen" }
ply-std = { path = "../../../crates/ply-std" }

[profile.release]
opt-level = 3
debug = false

[workspace]
