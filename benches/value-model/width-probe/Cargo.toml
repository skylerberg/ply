# Its own workspace, as `benches/value-model/rust` is: it must not be built by the tree's
# `cargo build --workspace`, and it has no dependencies to share.
[workspace]

[package]
name = "width-probe"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "width-probe"
path = "src/main.rs"

[profile.release]
opt-level = 3
