[package]
name = "ply-eval"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
# The host boundary has to know which declarations ship with the compiler: a
# registration may spell a program-wide effect name only under the reserved
# stdlib root, where the module is fixed at compile time.
blake3 = { workspace = true }
curve25519-dalek = { workspace = true }
flate2 = { workspace = true }
indexmap = { workspace = true }
libm = { workspace = true }
memchr = { workspace = true }
p256 = { workspace = true }
ring = { workspace = true }
rust_decimal = { workspace = true }
rustc-hash = { workspace = true }
serde = { workspace = true }
stacker = { workspace = true }
subtle = { workspace = true }
zeroize = { workspace = true }

# The unit tests live in `ply-eval-tests`; an empty test harness is still a compile.
[lib]
test = false
