[package]
name = "ply-eval"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
ply-span = { workspace = true }
ply-ty = { workspace = true }
# The host boundary has to know which declarations ship with the compiler: a
# registration may spell a program-wide effect name only under the reserved
# stdlib root, where the module is fixed at compile time.
ply-std = { workspace = true }
blake3 = { workspace = true }
memchr = { workspace = true }
rpds = { workspace = true }
rust_decimal = { workspace = true }
rustc-hash = { workspace = true }
stacker = { workspace = true }

# The unit tests live in `ply-eval-tests`; an empty test harness is still a compile.
[lib]
test = false
