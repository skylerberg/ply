[package]
name = "ply-store"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
ply-span = { workspace = true }
ply-syntax = { workspace = true }
ply-core = { workspace = true }
ply-hash = { workspace = true }
blake3 = { workspace = true }
memmap2 = { workspace = true }
stacker = { workspace = true }
# `rc`: cached entries are handed out as `Arc`, because a store that decodes an
# entry from a mapped byte range has no resident value to lend.
serde = { workspace = true, features = ["rc"] }
serde_json = { workspace = true }
anyhow = { workspace = true }
