[package]
name = "ply-host"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
blake3 = { workspace = true }
ply-eval = { workspace = true }
# `ring` is already in the tree through `rustls`; `std.random` reads its `SystemRandom` rather
# than a second entropy source.
ring = { workspace = true }
# Already in the tree through `tokio`; the process host signals its children and waits on one
# without reaping it through `kill` and `waitid`, which `std::process` does not offer.
libc = "0.2.189"
rustls = { workspace = true }
tokio = { workspace = true }
rcgen = { workspace = true }
rustls-pemfile = { workspace = true }
webpki-roots = { workspace = true }

# The unit tests live in `ply-host-tests`; an empty test harness is still a compile.
[lib]
test = false
