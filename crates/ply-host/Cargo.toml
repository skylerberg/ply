[package]
name = "ply-host"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
ply-eval = { workspace = true }
ply-span = { workspace = true }
ply-std = { workspace = true }
# For `render_float`, so a traced float reads as the program would print it.
ply-ty = { workspace = true }
# `ring` is already in the tree through `rustls`; `std.random` reads its `SystemRandom` rather
# than a second entropy source.
ring = "0.17.14"
rustls = { workspace = true }
tokio = { workspace = true }
rcgen = { workspace = true }
rustls-pemfile = { workspace = true }
webpki-roots = { workspace = true }

# The unit tests live in `ply-host-tests`; an empty test harness is still a compile.
[lib]
test = false
