[package]
name = "ply-host"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
blake3 = { workspace = true }
ply-eval = { workspace = true }
# `ring` is already in the tree through `rustls`; `std.random` reads its `SystemRandom` rather
# than a second entropy source.
ring = { workspace = true }
argon2 = { workspace = true }
scrypt = { workspace = true }
blowfish = { workspace = true }
zeroize = { workspace = true }
# Already in the tree through `tokio`; the process host signals its children and waits on one
# without reaping it through `kill` and `waitid`, which `std::process` does not offer.
libc = "0.2.189"
# Already in the tree through `tokio`; socket options, a bind with options set before it, and a
# datagram's truncation flag, none of which `std::net` offers.
socket2 = { version = "0.6.5", features = ["all"] }
rustls = { workspace = true }
# Already in the tree through `ply-eval`, whose engine a connection opened here is handed to: a
# file's open flags and its wait on a lock are the host's to set.
rusqlite = { workspace = true }
tokio = { workspace = true }
rcgen = { workspace = true }
rustls-pemfile = { workspace = true }
webpki-roots = { workspace = true }
# Already in the tree through `rustls`, at its version and features: which names a certificate
# covers, which is how a listener chooses one by the name a client asks for.
webpki = { package = "rustls-webpki", version = "0.103.14", default-features = false, features = ["alloc"] }

# The unit tests live in `ply-host-tests`; an empty test harness is still a compile.
[lib]
test = false
