[package]
name = "ply-host"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
deadpool-postgres = { workspace = true }
ply-core = { workspace = true }
ply-eval = { workspace = true }
ply-span = { workspace = true }
ply-std = { workspace = true }
# For `ast::Mode`, which is what an `EffectAtom` carries: the atoms a statement
# touches are built here and read by the scheduler.
ply-syntax = { workspace = true }
postgres-protocol = { workspace = true }
# `db-tokio-postgres` supplies the `numeric` conversion rather than W4
# reimplementing base-10000 digit packing inside the trusted computing base.
rust_decimal = { workspace = true, features = ["db-tokio-postgres"] }
rustls = { workspace = true }
rustls-pemfile = { workspace = true }
tokio = { workspace = true }
tokio-postgres = { workspace = true }

[dev-dependencies]
ply-syntax = { workspace = true }
rcgen = { workspace = true }
tempfile = { workspace = true }
