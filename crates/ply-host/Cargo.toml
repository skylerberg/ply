[package]
name = "ply-host"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
deadpool-postgres = { workspace = true }
ply-eval = { workspace = true }
ply-span = { workspace = true }
ply-std = { workspace = true }
# For `ast::render_float`, so a traced float reads as the program would print it.
ply-syntax = { workspace = true }
ply-ty = { workspace = true }
postgres-protocol = { workspace = true }
# `db-tokio-postgres` supplies the `numeric` conversion rather than W4
# reimplementing base-10000 digit packing inside the trusted computing base.
rust_decimal = { workspace = true, features = ["db-tokio-postgres"] }
rustls = { workspace = true }
rustls-pemfile = { workspace = true }
tokio = { workspace = true }
tokio-postgres = { workspace = true }

# The unit tests live in `ply-host-tests`; an empty test harness is still a compile.
[lib]
test = false
