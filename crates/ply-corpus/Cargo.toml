[package]
name = "ply-corpus"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "ply-corpus"
path = "src/main.rs"

[dependencies]
ply-span = { workspace = true }
ply-syntax = { workspace = true }
ply-core = { workspace = true }
ply-derive = { workspace = true }
ply-hash = { workspace = true }
ply-eval = { workspace = true }
ply-store = { workspace = true }
ply-test = { workspace = true }
ply-prove = { workspace = true }
ply-host = { workspace = true }
ply-std = { workspace = true }
ply-cli = { workspace = true }
anyhow = { workspace = true }
clap = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
# A dependency rather than a dev-dependency because `serve` writes the endpoint
# it is about to measure: the project under load is generated, not checked in.
tempfile = { workspace = true }
# W3's TLS section needs a client, and a benchmark that measured a handshake
# with verification switched off would be measuring a different handshake. The
# certificate is generated per run rather than checked in.
rcgen = { workspace = true }
rustls = { workspace = true }
