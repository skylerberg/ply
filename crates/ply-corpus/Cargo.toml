[package]
name = "ply-corpus"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "ply-corpus"
path = "src/main.rs"

# Its own binary because a counting `#[global_allocator]` is a whole-binary
# decision and `ply-corpus` is where the clocks are. `w6-ladder` runs it.
[[bin]]
name = "w6-alloc"
path = "src/bin/w6-alloc.rs"

[dependencies]
ply-span = { workspace = true }
ply-syntax = { workspace = true }
ply-core = { workspace = true }
ply-derive = { workspace = true }
ply-hash = { workspace = true }
ply-eval = { workspace = true }
ply-store = { workspace = true }
ply-test = { workspace = true }
ply-prove = { workspace = true }
ply-host = { workspace = true }
ply-std = { workspace = true }
ply-cli = { workspace = true }
anyhow = { workspace = true }
clap = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
# A dependency rather than a dev-dependency because `serve` writes the endpoint
# it is about to measure: the project under load is generated, not checked in.
tempfile = { workspace = true }
rayon = { workspace = true }
# W3's TLS section needs a client, and a benchmark that measured a handshake
# with verification switched off would be measuring a different handshake. The
# certificate is generated per run rather than checked in.
rcgen = { workspace = true }
rustls = { workspace = true }
# W4's floor row: the same statements against the same server with no Ply in the
# path. A benchmark that priced the language against a number taken elsewhere
# would be pricing two machines.
tokio = { workspace = true }
tokio-postgres = { workspace = true }
rust_decimal = { workspace = true, features = ["db-tokio-postgres"] }

# `tests/r4_value_construction.rs` and `tests/w6_alloc_sites.rs` attribute an
# allocation to the code that asked for it, which means a stack walk per
# allocation. See the workspace manifest for why it is this crate and not
# `std::backtrace`.

[dev-dependencies]
backtrace = { workspace = true }
