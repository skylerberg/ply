[package]
name = "ply-corpus"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

# The unit tests live in `ply-corpus-tests`; an empty test harness is still a compile.
[lib]
test = false

[[bin]]
name = "ply-corpus"
path = "src/main.rs"

# Its own binary because a counting `#[global_allocator]` is a whole-binary
# decision and `ply-corpus` is where the clocks are. `w6-ladder` runs it.
[[bin]]
name = "w6-alloc"
path = "src/bin/w6-alloc.rs"

[dependencies]
ply-machine = { workspace = true }
ply-span = { workspace = true }
ply-ty = { workspace = true }
ply-eval = { workspace = true }
ply-codegen = { workspace = true }
ply-store = { workspace = true }
ply-test = { workspace = true }
ply-host = { workspace = true }
ply-std = { workspace = true }
anyhow = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
# A dependency rather than a dev-dependency because `serve` writes the endpoint
# it is about to measure: the project under load is generated, not checked in.
tempfile = { workspace = true }
