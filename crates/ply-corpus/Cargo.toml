[package]
name = "ply-corpus"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

# The unit tests live in `ply-corpus-tests`; an empty test harness is still a compile.
[lib]
test = false

[[bin]]
name = "ply-corpus"
path = "src/main.rs"

[dependencies]
ply-machine = { workspace = true }
ply-span = { workspace = true }
ply-ty = { workspace = true }
ply-eval = { workspace = true }
ply-codegen = { workspace = true }
ply-test = { workspace = true }
ply-host = { workspace = true }
ply-std = { workspace = true }
anyhow = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
# A dependency rather than a dev-dependency: the harnesses write the projects they
# run into directories of their own.
tempfile = { workspace = true }
