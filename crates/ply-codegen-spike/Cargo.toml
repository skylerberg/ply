[package]
name = "ply-codegen-spike"
version = "0.1.0"
edition = "2024"
publish = false

# Its own workspace on purpose. ADR 0016 §3.5 requires that deferring M9 delete
# the spike and nothing else, and a crate the shipping workspace never mentions
# is deleted by `rm -r`. Nothing in `crates/*` gains a dependency on it.
#
# Kept after measuring the alternative rather than by inheritance (2026-08-31),
# because the reason usually given for removing this line does not survive being
# run. The claim was that `cargo metadata` at the repository root fails with
# "multiple workspace roots" while this line stands. **It does not**: at the
# root, `cargo +1.93.1 metadata --format-version 1` exits 0 and lists the
# thirteen shipping members, with and without `--no-deps`. There is no failure
# here to repair.
#
# What removing the line actually does, checked by removing it: every cargo
# command run *inside this directory* fails, exit 101 —
#
#   error: current package believes it's in a workspace when it's not:
#   current:   crates/ply-codegen-spike/Cargo.toml
#   workspace: Cargo.toml
#
# — because a package under the root's directory that is neither in `members`
# nor in `exclude` is an error. Repairing that needs `exclude =
# ["crates/ply-codegen-spike"]` in the root manifest, which was also tried and
# also works (root exit 0, inside-spike exit 0). So the choice is between two
# arrangements that both build, and the tie is broken on what ADR 0016 §3.5
# asked for: `exclude` puts the spike's name in the *shipping* manifest and
# leaves a dangling entry behind when the crate is deleted, and this line does
# not. Neither arrangement puts cranelift in the shipping `Cargo.lock`
# (`grep -c cranelift Cargo.lock` is 0 under both) and neither makes
# `cargo check --workspace` or `cargo test --workspace` reach this crate; that
# is decided by `members`, which names it under neither.
#
# `.github/ci-shards.sh verify` is indifferent to which is used — it compares
# `KNOWN_OUTSIDE` against `workspace.members`, and this crate is absent from
# `members` either way.
[workspace]

[dependencies]
ply-span = { path = "../ply-span" }
ply-syntax = { path = "../ply-syntax" }
ply-core = { path = "../ply-core" }
ply-derive = { path = "../ply-derive" }
ply-eval = { path = "../ply-eval" }
ply-std = { path = "../ply-std" }
anyhow = "1.0.104"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
cranelift-jit = "0.132.3"
cranelift-codegen = "0.132.3"
cranelift-frontend = "0.132.3"
cranelift-module = "0.132.3"
cranelift-native = "0.132.3"

[profile.release]
opt-level = 3
lto = "thin"
