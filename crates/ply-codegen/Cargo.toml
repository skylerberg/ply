[package]
name = "ply-codegen"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

# A workspace member, and that is the decision this file records.
#
# `crates/ply-codegen-spike` declares its own `[workspace]` so that nothing in
# the shipping tree builds it (the codegen spike). This crate is the opposite of
# that on purpose. the backend authorisation's amendment records the authorisation; the
# reason for taking the *default* path rather than an opt-in one is that the
# spike bit-rotted twice while sitting off it, and `CONTRIBUTING.md` §"The one
# rule" makes an unexercised path this project's most expensive defect class. A
# `--features cranelift` that CI ran once a milestone would be the same mistake
# with a shorter name.
#
# The cost of that decision was measured before it was taken rather than
# asserted; the figure and the run are in the backend decision
# §4.9.
#
# The cranelift versions are pinned to the 0.132 series deliberately.
# 0.132.0–0.132.3 declare `rust-version = "1.93.0"` and therefore build on the
# 1.93.1 this workspace pins; **0.133 and later require 1.94.0**, and taking one
# would put a second toolchain back into a repository that has exactly one.
# Bumping past 0.132 is a toolchain decision and not a dependency bump.
[dependencies]
ply-span = { workspace = true }
ply-syntax = { workspace = true }
ply-core = { workspace = true }
ply-eval = { workspace = true }
anyhow = { workspace = true }
memchr = { workspace = true }
cranelift-jit = "0.132.3"
cranelift-codegen = "0.132.3"
cranelift-frontend = "0.132.3"
cranelift-module = "0.132.3"
cranelift-native = "0.132.3"
