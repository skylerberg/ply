# The lexer and parser differentials: the compiler written in Ply against the
# Rust front end it was ported from.
[package]
name = "ply-compiler-diff"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[dependencies]
ply-syntax = { workspace = true }
ply-span = { workspace = true }
ply-derive = { workspace = true }
ply-eval = { workspace = true }
ply-codegen = { workspace = true }
ply-std = { workspace = true }

[[bin]]
name = "refdump"
path = "src/main.rs"

[lib]
name = "ply_compiler_diff"
path = "src/lib.rs"
