# The differentials: the compiler written in Ply against the Rust one it was
# ported from, phase by phase, and its emitter's C against `ply-codegen`'s byte
# for byte.
#
# A workspace member, so `cargo test --workspace` runs it. It was a separate
# cargo project for as long as it was a spike, on the argument that a new member
# would move test counts three documents stated -- those counts are gone, and
# this is not a spike: `ply-compiler` is what every run compiles through, and a
# differential that stops running reports nothing, which is indistinguishable
# from passing.
[package]
name = "ply-compiler-diff"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[dependencies]
# The front end under comparison. By path through the workspace, so the
# comparison is against the tree it sits in rather than against a copy.
ply-syntax = { workspace = true }
ply-span = { workspace = true }
ply-core = { workspace = true }
ply-derive = { workspace = true }
ply-hash = { workspace = true }
ply-eval = { workspace = true }
ply-codegen = { workspace = true }
ply-compiler = { workspace = true }

[[bin]]
name = "refdump"
path = "src/main.rs"

[lib]
name = "ply_compiler_diff"
path = "src/lib.rs"
